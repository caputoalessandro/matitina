const LONG = {
intro:[
 {h:"Disegnare come leggere", p:[
  "L'idea di fondo del libro è un paragone con la lettura. Nessuno pensa che per leggere serva un dono speciale: si imparano le lettere, i suoni, le sillabe, il lessico, e a un certo punto i pezzi si fondono e si «legge» senza pensarci. Il disegno funziona allo stesso modo: è un'abilità globale fatta di abilità più piccole, e chi dice «non so disegnare» di solito non ha mai imparato una o più di queste componenti.",
  "Il libro è pensato proprio per chi parte da zero e pensa di non avere talento. Gli esercizi non puntano a fare «arte», ma a costruire l'alfabeto del vedere: una base solida su cui poi ognuno può andare dove vuole, dal ritratto al paesaggio all'astratto."]},
 {h:"Le cinque abilità di base", p:[
  "Per disegnare ciò che si ha davanti servono cinque modi di vedere. I bordi: dove una cosa finisce e ne comincia un'altra. Gli spazi: ciò che sta intorno e tra le cose. I rapporti: angoli e proporzioni, cioè prospettiva. Le luci e le ombre: i gradi di chiaro e di scuro che fanno sembrare le cose in rilievo. E la gestalt, la percezione dell'insieme.",
  "Le prime quattro vanno insegnate in modo diretto, una alla volta, ed è quello che fanno i capitoli dal 6 al 10. La quinta non si insegna: arriva come una conseguenza, un «aha» che si prova quando, dopo aver osservato con cura le parti, all'improvviso si vede la cosa intera. L'autrice la avvicina al piacere estetico, alla sensazione di bellezza."]},
 {h:"La strategia: un compito che la parte verbale rifiuta", p:[
  "Il cuore del metodo è una constatazione semplice. La parte del cervello che lavora con le parole è veloce, dominante e tende a buttarsi su ogni compito, anche quando non è adatta. Davanti a un volto, invece di guardare, «nomina»: occhio, naso, bocca, e disegna i simboli che conosce. Combatterla di petto non funziona.",
  "Funziona invece aggirarla: proporre un compito che lei trova inutile, noioso o impossibile, così si fa da parte da sola. Ogni esercizio del libro è una variante di questo trucco: un'immagine capovolta che non si lascia nominare, un contorno così lento da essere insopportabile, uno spazio vuoto che non è «niente», un angolo che contraddice ciò che si sa, un'ombra che cambia forma a ogni movimento."]},
 {h:"Plasticità, sabotatore e trasferimento", p:[
  "Oggi sappiamo che il cervello si modifica con l'esperienza: imparare una nuova abilità crea nuovi collegamenti. Questo mette in crisi l'idea di un talento fisso, dato o non dato alla nascita. Come la lettura, una volta acquisito il disegno resta per tutta la vita.",
  "Attenzione però al «grande sabotatore»: proprio perché viene messa da parte, la mente verbale troverà sempre qualcosa di più urgente da fare. Il rimedio è lo stesso: iniziare comunque con qualcosa che lei scarta, anche solo uno spazio negativo o una copia capovolta. Con il tempo le resistenze calano. E le abilità del vedere, imparate disegnando, si possono trasferire al modo di pensare e risolvere problemi: è il tema del capitolo 11."]}
],
c1:[
 {h:"Perché la bicicletta", p:[
  "Insegnare a disegnare somiglia a insegnare ad andare in bicicletta: si può descrivere a parole quanto si vuole, ma la cosa vera si capisce solo provandola, magari dopo aver visto qualcuno farla. Per questo frasi come «guarda meglio» o «controlla le proporzioni» servono a poco: chi impara non sa cosa guardare, né come.",
  "Il disegno dal vero dipende da un modo di vedere particolare, diverso da quello che usiamo ogni giorno per riconoscere gli oggetti e muoverci. Nella vita normale ci basta capire «che cosa» è una cosa; per disegnarla bisogna invece vedere «com'è» davvero, con le sue forme, i suoi angoli, i suoi rapporti."]},
 {h:"Non è magia", p:[
  "Molti considerano il disegno un'abilità quasi magica, e spesso gli artisti non aiutano: alla domanda «come fai?» rispondono «guardo e disegno quello che vedo». È vero, ma non spiega niente. Il libro vuole togliere il mistero: chi sa firmare o scrivere un messaggio ha già la coordinazione sufficiente. Il problema non è la mano, è l'occhio, o meglio il modo in cui il cervello interpreta ciò che l'occhio vede.",
  "Per questo l'insegnamento punta più a sbloccare che ad aggiungere: le capacità ci sono, ma vecchie abitudini di visione le coprono."]},
 {h:"Uno stato mentale diverso", p:[
  "Chi disegna bene entra in uno stato particolare: concentrazione intensa, il tempo che sparisce, le voci intorno che diventano rumore di fondo, una sensazione di calma e di sicurezza. È simile a ciò che succede guidando a lungo in autostrada, leggendo un romanzo che ci assorbe o praticando uno sport.",
  "Questo stato è fragile: basta una domanda, un telefono che squilla, e si torna al modo di pensare abituale. Imparare a disegnare significa anche imparare a creare le condizioni per entrarci, e a riconoscerlo quando ci si è dentro."]},
 {h:"Perché soggetti difficili", p:[
  "Gli esercizi usano di proposito i soggetti considerati più ardui: una mano, una sedia, una stanza in prospettiva, un ritratto, un autoritratto. Il motivo è che disegnare è sempre lo stesso compito, qualunque sia il soggetto; tanto vale dimostrare a sé stessi di saper affrontare quelli che spaventano di più.",
  "I volti hanno un vantaggio in più: chiunque si accorge subito se un ritratto è sbagliato, quindi la verifica è immediata, e riuscire a ottenere una somiglianza dà una grande fiducia. In più il riconoscimento dei volti è una specialità della parte visiva del cervello, quella che vogliamo allenare."]}
],
c2:[
 {h:"Gli strumenti e perché servono", p:[
  "Il materiale è semplice: carta, un paio di matite, una grafite in stick, tre gomme, nastro, una tavola. Due strumenti però sono speciali: il piano trasparente con la croce disegnata sopra e i mirini di cartoncino nero. Sembrano accessori, ma il libro li considera essenziali per capire che cosa sia davvero il disegno dal vero.",
  "Il piano trasparente rende concreto un concetto che di solito resta astratto: guardare il mondo attraverso una finestra e copiare ciò che si vede «appiattito» sul vetro. I mirini servono a inquadrare e a scegliere la composizione. Tutti hanno la stessa proporzione tra larghezza e altezza, così ciò che si vede nel mirino si può riportare sul foglio cambiando solo la scala. Quando le abilità saranno interiorizzate, si potranno abbandonare."]},
 {h:"I disegni prima del corso", p:[
  "Prima di imparare qualunque cosa, si fanno tre disegni: una persona a memoria, un autoritratto allo specchio, la propria mano. È un momento scomodo, ma importante: con il progresso arriva una curiosa amnesia, si dimentica come si disegnava, e si diventa sempre più critici. Avere un punto di partenza datato e firmato permette di misurare davvero la strada fatta.",
  "Quando si guardano questi disegni conviene cercare non i difetti ma i piccoli punti in cui si è osservato davvero: una curva del sopracciglio, il risvolto di un colletto. Sono il segno che la capacità di vedere c'è già."]},
 {h:"La tirannia dei simboli", p:[
  "Il disegno a memoria fa emergere qualcosa di prezioso: il sistema di simboli che ognuno ha costruito da bambino. Occhi a mandorla con il cerchietto, naso a uncino, unghie come piccoli archi. Spesso gli stessi simboli ricompaiono identici anche nell'autoritratto, cioè anche quando si sta guardando un volto vero: la mano traccia ciò che «sa» invece di ciò che vede.",
  "Il livello di questi disegni corrisponde in genere all'età in cui si è smesso di disegnare, spesso tra i nove e i dodici anni. Non dice nulla sul potenziale: indica solo dove ci si è fermati. Il corso non insegna trucchi tecnici, ma a vedere in modo diverso, ed è questo che trasforma i risultati."]},
 {h:"Lo stile è già tuo", p:[
  "Il libro non insegna uno stile. La firma lo dimostra: è un disegno fatto con una linea, unico e riconoscibile, che esprime velocità, pressione, ritmo, carattere. Già oggi, scrivendo il proprio nome, si usa la linea in modo espressivo.",
  "Lo stile personale emerge da solo man mano che si impara a vedere meglio: due persone che disegnano lo stesso modello con gli stessi materiali ottengono due ritratti somiglianti ma diversissimi. Esistono molti tipi di linea, decisa, spezzata, sottile e precisa, che scompare e riappare, e nessuno è migliore degli altri. Più si vede chiaramente, più il disegno rivela anche chi lo ha fatto."]}
],
c3:[
 {h:"Un cervello doppio", p:[
  "Visti dall'alto, i due emisferi sembrano le due metà di una noce, collegate da un fascio di fibre, il corpo calloso. Ognuno controlla il lato opposto del corpo: la mano destra dipende dall'emisfero sinistro e viceversa. Per molto tempo si è pensato che il sinistro, sede del linguaggio nella grande maggioranza delle persone, fosse quello «principale», e il destro un fratello minore muto.",
  "Gli studi di Roger Sperry e del suo gruppo sui pazienti a cui era stato separato il corpo calloso hanno cambiato questa visione: entrambi gli emisferi svolgono funzioni complesse, ma in modi diversi. A volte collaborano, a volte uno prende il comando, a volte entrano in conflitto. Per evitare discussioni sulla localizzazione precisa, il libro parla di «modalità L» e «modalità R»."]},
 {h:"Modalità L e modalità R", p:[
  "La modalità L è verbale e analitica: nomina, scompone, conta, segue una sequenza, usa simboli, ragiona per passaggi logici, tiene il tempo. È perfetta per un teorema o una scaletta, ma tende a semplificare: le basta riconoscere una cosa per categorizzarla e passare oltre.",
  "La modalità R è visiva e globale: vede come le parti stanno insieme, coglie i rapporti nello spazio, lavora per analogie e intuizioni, non sente il tempo che passa e accetta ciò che è ambiguo o contraddittorio. È quella che serve per disegnare ciò che si ha davanti, perché non sostituisce la realtà con un concetto. Per descrivere una scala a chiocciola senza fare il gesto della spirale, ci si accorge di quanto le parole possano essere insufficienti."]},
 {h:"Un vecchio pregiudizio", p:[
  "Molte lingue tradiscono un pregiudizio contro la sinistra, e quindi indirettamente contro l'emisfero destro che la controlla: «sinistro» significa anche minaccioso, «destro» abile; in francese gauche vuol dire goffo. Un tempo si costringevano i bambini mancini a usare la destra, con conseguenze spesso pesanti. Come nota l'autrice, le parole le ha inventate la metà verbale del cervello, che si è tenuta quelle migliori.",
  "Anche le intuizioni improvvise, il classico «eureka» di Archimede nella vasca, sono momenti in cui la modalità R vede un collegamento che il ragionamento passo passo non aveva trovato."]},
 {h:"Mancini, destrimani e chi prende il compito", p:[
  "Mancini e destrimani imparano a disegnare allo stesso modo: non serve passare all'altra mano, che rende solo il tratto più goffo. Si disegna con la mano che si usa di solito.",
  "Il punto chiave per il resto del libro è come i due emisferi si spartiscono il lavoro. Sembra contino due cose: chi arriva prima e chi ci tiene di più. La parte verbale è veloce e dominante, e cede solo se il compito le pare troppo lento, troppo dettagliato o impossibile per lei. Gli esercizi sono costruiti esattamente così, per far sì che sia lei a rinunciare."]}
],
c4:[
 {h:"Vaso/Volti: sentire il conflitto", p:[
  "Il primo esercizio è costruito apposta per creare un inceppo. Si copia mezzo profilo, poi lo si ripassa dicendo ad alta voce i nomi delle parti: fronte, naso, labbra, mento. Così si accende la parte verbale. Poi si chiede di disegnare l'altro profilo per ottenere un vaso simmetrico, un compito che si risolve solo guardando forme, curve e distanze.",
  "A metà strada quasi tutti avvertono confusione, a volte una vera paralisi della mano: non si sa più se la linea deve andare a destra o a sinistra. È esattamente lo scopo: rendere percepibile lo scontro tra due modi di pensare. Ognuno trova la sua via d'uscita, guardare lo spazio tra i profili, tracciare una griglia, partire dal basso, smettere di pensare a un volto, ed è utile annotarla."]},
 {h:"Pensare come un navigatore delle isole", p:[
  "Il libro usa il paragone tra due navigatori. Quello europeo parte con un piano scritto, rotte e coordinate, e lo esegue tappa per tappa. Quello delle isole Truk tiene in mente la meta in rapporto alle altre isole e corregge di continuo la direzione osservando sole, vento, onde: sa navigare benissimo ma non saprebbe spiegarlo a parole.",
  "Il secondo profilo va disegnato come il secondo navigatore. Le domande giuste sono solo spaziali: dove comincia questa curva? quanto è profonda? che angolo fa rispetto al bordo del foglio? quanto è lunga rispetto alla linea appena fatta? Niente nomi, niente regole del tipo «il mento sporge quanto le labbra»."]},
 {h:"Il disegno capovolto", p:[
  "Le cose capovolte sono difficili da riconoscere e da nominare: un volto famoso a testa in giù diventa irriconoscibile, la propria calligrafia illeggibile. La parte verbale, che vive di riconoscimento, trova il compito fastidioso e inutile e si ritira. La parte visiva invece non fa differenza tra diritto e rovescio: vede solo linee e forme interessanti.",
  "Copiando il ritratto di Stravinsky di Picasso a testa in giù, quasi tutti ottengono un risultato sorprendente. Spesso le parti più riuscite sono proprio le più difficili, come le gambe accavallate viste di scorcio, perché non si sapeva che cosa si stava disegnando. Dove invece il cervello riconosce qualcosa, le mani e il volto, tornano i dubbi e le cancellature. La lezione è semplice: se lo vedi, disegnalo così com'è."]},
 {h:"Riconoscere lo stato R", p:[
  "Il passaggio da una modalità all'altra non si percepisce nel momento in cui avviene, ma lo si riconosce dopo. Si perde la nozione del tempo, le parole degli altri diventano suoni, ci si sente attenti ma rilassati, sicuri, e il disegno comincia a sembrare un puzzle affascinante.",
  "Ripetere l'esperienza con altri disegni capovolti aiuta a familiarizzare con questa sensazione. L'obiettivo del corso è riuscire a provocarla anche quando il soggetto è dritto, cercando sempre informazioni visive che la parte verbale non vuole o non sa trattare."]}
],
c5:[
 {h:"Come disegnano i bambini", p:[
  "Verso un anno e mezzo arriva lo scarabocchio: il piacere puro di vedere una linea uscire dalla matita. Poi la grande scoperta: un segno può stare al posto di qualcosa. Un cerchio con due puntini diventa la mamma, il cane, il sole. Da lì i bambini costruiscono un vocabolario di simboli, li perfezionano e li ripetono finché diventano stabilissimi.",
  "Verso i quattro-cinque anni i disegni raccontano storie ed esprimono emozioni: un braccio enorme perché è quello che regge l'ombrello, una sorella con i denti in bella vista. Poi arriva il paesaggio simbolico, quasi uguale per tutti: terra in basso, cielo in alto, la casa con la maniglia, il sole in un angolo, gli alberi, le montagne a cono. Colpisce il senso di composizione dei bambini piccoli: ogni elemento sta esattamente dove deve stare dentro i bordi del foglio."]},
 {h:"La crisi dei dieci anni", p:[
  "Tra i nove e gli undici anni le cose cambiano. Il linguaggio prende il sopravvento, i bambini si concentrano sugli oggetti singoli e perdono il senso della composizione. Soprattutto vogliono il realismo: che le cose sembrino vere, che vadano indietro nello spazio. E i simboli che conoscono non bastano più.",
  "Senza un insegnamento adatto il disegno «non torna», arrivano frustrazione e imbarazzo, spesso aggravati da una battuta sarcastica di un adulto o di un compagno. Molti smettono per sempre. Diventano gli adulti che dicono di non saper tracciare una linea dritta e che, se costretti a disegnare una persona, producono ancora la figura che facevano a dieci anni."]},
 {h:"Il paradosso del cubo", p:[
  "Per capire il nodo del problema basta un cubo visto d'angolo. Sappiamo che è fatto di quadrati e angoli retti, ma per farlo sembrare un cubo bisogna disegnare forme che non sono quadrate, con angoli acuti e ottusi, esattamente come appaiono all'occhio. Chi parte da ciò che sa, angolo retto in basso, base dritta, accumula errori e si confonde.",
  "Non è un problema di mano: i ragazzi tracciano benissimo le linee. È la conoscenza, utile in mille altre situazioni, che impedisce di vedere la cosa così com'è. Picasso diceva che l'arte è una bugia che ci fa vedere la verità: qui la «bugia» è disegnare forme storte per ottenere un'immagine vera."]},
 {h:"Mettere da parte i simboli", p:[
  "Davanti a un volto la mente verbale tira fuori il suo repertorio: ecco l'occhio, ecco il naso, ecco i capelli. Lo stesso vale per mani, alberi, erba. Non serve combattere questi simboli: basta proporre compiti per cui non esistono simboli, così la parte visiva può guardare con calma.",
  "Ridisegnare il paesaggio d'infanzia serve a riportarli alla luce e a ricordare quanto fossero «perfetti» nel loro genere. Ma il disegno dal vero chiede altro: guardare a lungo, raccogliere moltissime informazioni e vedere come stanno insieme, come fece Dürer con la sua lepre."]}
],
c6:[
 {h:"Che cos'è un bordo", p:[
  "Nel linguaggio comune il bordo è un contorno, un confine. Nel disegno ha un significato più preciso: è il punto in cui due cose si toccano, e la linea che lo rappresenta, la linea di contorno, appartiene a entrambe. Il profilo del Vaso/Volti era insieme il bordo del volto e del vaso; in un puzzle il bordo della barca è anche il bordo dell'acqua.",
  "Anche il formato, cioè il bordo del foglio, è un bordo condiviso: è il limite esterno del cielo, del terreno, di tutte le forme che lo toccano. Questo concetto apparentemente banale è la base del capitolo successivo sugli spazi negativi."]},
 {h:"Il contorno puro e il suo paradosso", p:[
  "L'esercizio chiave del capitolo deriva dal metodo di Kimon Nicolaides, che chiedeva di disegnare immaginando di toccare il bordo con la matita e guardando il modello invece del foglio. La versione del libro è più drastica: girati dall'altra parte, si disegnano per cinque minuti le pieghe del palmo, lentissimamente, senza mai guardare il foglio.",
  "Il risultato non somiglia affatto a una mano: è un groviglio di segni. Eppure è l'esercizio più efficace del corso: quando lo si salta, gli studenti progrediscono di meno. La lentezza estrema e la minuzia annoiano la parte verbale («è una piega, l'ho già detto»), che se ne va; la parte visiva scopre che ogni piega è fatta di dettagli e ogni dettaglio di dettagli più piccoli, quasi come un frattale. Torna la meraviglia infantile per le cose comuni."]},
 {h:"Il piano pittorico", p:[
  "Il concetto più importante del capitolo è il piano pittorico: una finestra immaginaria, sempre parallela al viso, attraverso cui l'artista guarda. Ciò che sta dietro, anche se va in profondità, appare schiacciato sul vetro come in una fotografia. Disegnare dal vero significa copiare quell'immagine piatta sul foglio.",
  "Alberti descrisse questa idea nel Rinascimento, Dürer costruì veri strumenti, Van Gogh si fece fare dal fabbro un telaio pesantissimo che trascinava fino alla spiaggia, e anche Holbein disegnava su vetro per andare più veloce. Con il piano trasparente si fa la stessa cosa: si appoggia sulla mano vista di scorcio, si chiude un occhio, si tiene ferma la testa e si ricalcano i bordi. Il risultato stupisce: una vista difficilissima resa con facilità."]},
 {h:"Un occhio chiuso, una sola vista", p:[
  "Chiudere un occhio elimina la visione binoculare, quella che dà la profondità: l'immagine diventa piatta e quindi copiabile. Tenere ferma la testa garantisce di disegnare una sola vista: se un dito non si vede, non lo si disegna. Più l'oggetto è vicino, più conviene chiudere un occhio.",
  "Il paradosso è che l'immagine piatta, copiata sul foglio, sembra tridimensionale a chi guarda. A domande come «come faccio a far venire il dito verso di me?» la risposta è sempre la stessa: disegna esattamente ciò che vedi sul piano. Il contorno modificato su fondo tonale mette insieme tutto: si guarda la mano quasi sempre, si controllano gli angoli con la croce, si disegnano le forme intorno alle unghie invece delle unghie, e il risultato è il primo vero disegno del corso."]}
],
c7:[
 {h:"Spazi negativi e forme positive", p:[
  "Gli oggetti sono le forme positive; gli spazi tra e intorno a essi sono gli spazi negativi. Il nome non è felice, ma l'idea è potente: nel disegno questi spazi sono reali quanto gli oggetti. L'esempio del libro è un personaggio dei cartoni che sfonda una porta lasciando un buco con la sua sagoma: ciò che resta della porta è lo spazio negativo, solido e con una forma precisa.",
  "Siccome forme e spazi condividono i bordi, disegnare uno spazio significa disegnare anche la forma accanto. E gli spazi non hanno nome, non hanno simboli memorizzati, non c'è niente da «sapere» su di loro: per questo li si vede come sono davvero. Le corna di un muflone viste di scorcio o le gambe di un animale diventano facili se si disegna lo spazio tra di esse."]},
 {h:"A cosa servono", p:[
  "Gli spazi negativi hanno tre funzioni. Rendono facili le parti difficili, come scorci e forme complicate, perché si disegnano «gratis» guardando ciò che le circonda. Unificano il disegno e rafforzano la composizione: quando spazi e forme ricevono la stessa attenzione, tutto il foglio diventa interessante. E allenano la percezione: dopo questa lezione si cominciano a vedere spazi ovunque, tra i rami, tra i palazzi, nella freccia nascosta di un logo famoso.",
  "Anche la parte verbale c'entra: non vuole occuparsi del «niente», quindi davanti a uno spazio vuoto si ritira. Per la parte visiva invece forme e spazi sono ugualmente affascinanti."]},
 {h:"Formato e composizione", p:[
  "La composizione è il modo in cui forme e spazi sono disposti dentro il formato, cioè dentro i bordi del disegno. I bambini piccoli ne hanno un senso istintivo, poi lo perdono concentrandosi sugli oggetti. Molti principianti trattano il foglio come se non avesse bordi e poi «riempiono lo sfondo».",
  "Per questo ogni disegno comincia scegliendo l'inquadratura con il mirino e tracciando il formato sul foglio. Il formato comanda: la stessa sagoma sta bene in un rettangolo verticale e male in uno orizzontale. E se si curano gli spazi negativi, molti problemi di composizione si risolvono da soli."]},
 {h:"L'unità base", p:[
  "Uno dei dubbi più comuni è da dove cominciare. Se la prima forma è troppo grande, ciò che interessava finisce fuori dal foglio; se è troppo piccola, bisogna riempire con cose inutili. L'unità base risolve il problema: si sceglie una forma o uno spazio di media grandezza, lo si chiama «Uno», lo si posiziona e dimensiona con cura rispetto al formato e alla croce, e tutto il resto si misura in rapporto a lui: uno a tre quarti, uno a due, e così via.",
  "Gli artisti esperti lo fanno in un attimo, quasi senza accorgersene; Matisse, rivedendosi al rallentatore, si stupì di vedere la sua mano che misurava nell'aria prima di disegnare la testa della modella. La sedia è il soggetto ideale per esercitarsi: sappiamo troppo sulle sedie (gambe uguali, sedile largo) e quello che sappiamo contraddice ciò che vediamo. Disegnando solo gli spazi, la sedia appare giusta da sola."]}
],
c8:[
 {h:"Prospettiva senza paura", p:[
  "La prospettiva spaventa molti studenti, anche Van Gogh ci ha lottato a lungo. Il libro la affronta in due tempi: prima pochi concetti di prospettiva formale, poi il metodo che usano davvero quasi tutti gli artisti, la prospettiva intuitiva o «traguardo». È come le regole della strada: all'inizio sembrano troppe, poi diventano automatiche e guidare è un piacere.",
  "La difficoltà vera è il paradosso. Un corridoio ha soffitto e pavimento orizzontali e altezza costante, ma per disegnarlo bisogna tracciare linee inclinate che si avvicinano. La parte verbale protesta («non può essere!»), quella visiva accetta ciò che vede. Una studentessa, dopo aver misurato tre volte lo stesso angolo dicendo che era impossibile, alla fine lo disegnò e scoprì che funzionava."]},
 {h:"I concetti della prospettiva formale", p:[
  "Il punto di vista è fisso: non ci si sposta e non si gira la testa. Il piano pittorico resta parallelo agli occhi. La linea d'orizzonte è sempre all'altezza degli occhi di chi guarda: se si sale su una scogliera sale con noi, se ci si siede si abbassa, anche quando non è visibile. Dove metterla nel foglio è una scelta di composizione.",
  "Nella prospettiva a un punto, i bordi orizzontali che vanno in profondità convergono verso un unico punto di fuga sull'orizzonte. Quelli sopra l'orizzonte scendono verso di esso, quelli sotto salgono, quelli all'altezza degli occhi restano orizzontali. Le verticali degli edifici restano verticali, salvo nella rara prospettiva a tre punti, guardando grattacieli dal basso o dall'alto."]},
 {h:"Due punti di fuga e il traguardo", p:[
  "Nella realtà la vista più comune è a due punti di fuga, e spesso con molti oggetti orientati in modo diverso, ciascuno con i suoi punti. Quasi sempre questi punti cadono fuori dal foglio, a volte lontanissimi: nessuno vuole lavorare con spaghi e righelli lunghi un metro.",
  "Per questo si traguarda. Le regole formali restano come aspettativa: so che questo bordo sopra i miei occhi deve scendere, quindi lo cerco. Poi misuro l'angolo reale confrontandolo con la verticale o l'orizzontale, le due costanti a cui l'artista si aggrappa come a un salvagente. Conviene ricordare la «fetta di torta» che l'angolo forma invece dei gradi, e scegliere il riferimento che dà l'angolo più piccolo. Sempre restando sul piano: la matita non deve «bucarlo» puntando verso il fondo della stanza."]},
 {h:"Misurare le proporzioni", p:[
  "La seconda metà del traguardo riguarda le proporzioni. Il gesto è formale: un occhio chiuso, braccio teso, gomito bloccato perché la scala resti costante, matita sul piano immaginario. Si misura l'unità base segnandola con il pollice sulla matita, la si confronta con un'altra misura e si ricava un rapporto semplice, ad esempio uno a due e due terzi.",
  "Poi viene la regola che gli studenti hanno sintetizzato con «pulisci la misura dalla matita»: il disegno ha una scala diversa dalla realtà, quindi non si porta la misura sul foglio, si porta il rapporto. Si rimisura l'unità nel disegno e si riporta lo stesso rapporto. La parte più difficile non è tecnica: è credere alle proprie misure senza ricontrollarle all'infinito. Chi impara a traguardare può disegnare qualunque cosa veda, scorci compresi."]}
],
c9:[
 {h:"Il cervello ritocca ciò che vedi", p:[
  "Uno dei fenomeni più sorprendenti per chi impara a disegnare è la costanza percettiva. Il cervello sa che le teste hanno più o meno la stessa grandezza e che un tavolo è rettangolare, e corregge l'immagine che arriva dall'occhio per farla combaciare con ciò che sa. Non ci avverte di averlo fatto.",
  "Gli esempi del libro sono spiazzanti: quattro figure identiche in un paesaggio sembrano di grandezza diversa; due piani di tavolo identici sembrano uno lungo e stretto e l'altro quasi quadrato; la propria testa allo specchio sembra a grandezza naturale ma è metà del vero. Anche dopo aver misurato, l'illusione resta. L'unico rimedio è introdurre un «intoppo», una misura, e poi fidarsi di essa più che della sensazione."]},
 {h:"Il cranio mozzato", p:[
  "L'errore più comune nei ritratti dei principianti riguarda la posizione degli occhi. Quasi tutti li vedono a un terzo dall'alto, mentre negli adulti la linea degli occhi sta a metà della testa, tra la sommità del cranio (o dei capelli) e il fondo del mento. Siccome i lineamenti sono la parte interessante, il cervello li ingrandisce e rimpicciolisce la fronte e il cranio, e nel disegno la testa risulta tagliata in alto.",
  "Gli studenti di un corso dell'autrice, pur misurando, dicevano sinceramente di non riuscire a vederlo: «lo vedremo quando ci crederemo». Misurare sulla propria testa, allo specchio, sulle foto, persino sullo schermo della tv, serve a convincere la parte logica. I lineamenti in realtà occupano una porzione piccola della testa, e un cranio intero cambia completamente la somiglianza."]},
 {h:"Orecchio, collo e altre misure", p:[
  "Nel profilo il secondo errore tipico è l'orecchio troppo vicino ai lineamenti, che porta a tagliare anche il retro del cranio. La regola da ricordare: la distanza dalla linea degli occhi al mento è uguale a quella dal retro dell'occhio al retro dell'orecchio. Unendo i tre punti si visualizza un triangolo isoscele direttamente sul modello.",
  "Il fondo dell'orecchio cade circa tra naso e bocca, ma varia da persona a persona e va controllato. Il collo si attacca al cranio più in alto di quanto si creda, all'incirca all'altezza del naso o della bocca, ed è largo: niente collo sottile piantato sotto un ovale come nei disegni dei bambini."]},
 {h:"Dal Sargent al modello vero", p:[
  "Copiare un disegno di un maestro è un vecchio metodo tornato di moda: costringe a rallentare e a vedere ciò che vedeva l'artista, e le immagini copiate restano impresse a lungo. Il profilo di Madame X di Sargent permette di allenare tutti i passaggi: unità base, spazi negativi davanti al viso e al collo, angoli rispetto alla croce, posizione dell'orecchio.",
  "Poi il ritratto vero. Alcuni accorgimenti aiutano a scavalcare i simboli: disegnare il bianco dell'occhio come spazio negativo invece dell'iride; guardare gli spazi intorno agli occhiali, che di profilo hanno forme diverse da come le conosciamo; disegnare il colletto attraverso gli spazi intorno; rendere i capelli per masse, direzioni e zone scure invece di tracciare singoli capelli. E soprattutto evitare giudizi verbali sul modello: chi pensa «ha la faccia lunga» finisce per disegnarla più lunga di quella vera."]}
],
c10:[
 {h:"La logica della luce", p:[
  "Il chiaroscuro, che gli studenti chiamano «ombreggiare», nel libro diventa logica della luce: la luce cade sulle forme e produce luci e ombre in modo prevedibile. Ci sono quattro elementi. La luce piena, dove la sorgente colpisce più direttamente. L'ombra portata, la più scura, dove l'oggetto blocca la luce. La luce riflessa, più debole, rimbalzata dalle superfici vicine. L'ombra di cresta, sul colmo della forma tra luce piena e luce riflessa.",
  "Le ultime due sono le più difficili da vedere ma sono quelle che «arrotondano» le forme. Il tutto si misura in valori, dal bianco della carta al nero più fitto della grafite: chiari = valori alti, scuri = valori bassi. Il percorso ideale va dalla linea alle forme, ai rapporti, ai valori, e da lì al colore e alla pittura."]},
 {h:"Perché funziona: forme senza nome", p:[
  "Le forme delle ombre non hanno nome e cambiano a ogni minimo movimento del modello: la parte verbale non sa che farsene e lascia il campo. Usiamo continuamente queste informazioni per capire il volume delle cose, ma senza accorgercene. Capovolgendo un autoritratto a chiaroscuro si vede solo un mosaico di macchie; raddrizzato, le macchie spariscono e resta una testa in rilievo.",
  "Qui sta un altro paradosso: se si disegnano le forme di luce e ombra esattamente come appaiono, chi guarda non le nota, vede solo un volto «vero». La parte visiva del cervello è bravissima a completare le informazioni mancanti, e su questo si basa la magia: dando pochi indizi giusti, lo spettatore vede cose che non sono disegnate, come l'occhio in ombra nell'autoritratto di Hopper o nella fotografia di Steichen. Il difficile è sapersi fermare."]},
 {h:"Le proporzioni del volto", p:[
  "Il ritratto si fa in tre pose: frontale, profilo, tre quarti. Nella vista frontale valgono alcune regole generali, da adattare a ogni volto: l'asse centrale e la linea degli occhi restano sempre ad angolo retto anche se la testa è inclinata; tra gli occhi c'è lo spazio di un occhio; la base del naso si trova con un triangolo rovesciato che parte dagli angoli esterni degli occhi; la bocca sta a circa un terzo tra naso e mento; le narici cadono sotto gli angoli interni degli occhi, gli angoli della bocca sotto le pupille; le orecchie vanno dagli occhi a naso-bocca; il collo è largo quasi quanto la mandibola. Nasi, bocche, orecchie e colli sono quasi sempre più grandi di quanto ci si aspetti.",
  "Il tre quarti è il più espressivo e il più insidioso: le due metà del viso hanno larghezze diverse, l'occhio e la bocca dal lato girato sono più corti e cambiano forma, del naso si vedono lato e base. Tutto questo contraddice i simboli simmetrici dell'infanzia. L'errore classico è avvicinare l'occhio vicino al naso: la distanza è circa la larghezza di un occhio. Per l'orecchio la regola diventa: dall'angolo anteriore dell'occhio al retro dell'orecchio = occhi-mento."]},
 {h:"Tratteggio, autoritratto e gestalt", p:[
  "Per i toni ci sono due tecniche. Il tratteggio: gruppi di segni paralleli fatti muovendo la mano dal polso, incrociati con un angolo appena diverso o più marcato, sovrapposti per scurire; ogni artista sviluppa il suo, quasi una firma. E il tono continuo, ottenuto con piccoli movimenti sovrapposti. Entrambi si imparano solo con la pratica.",
  "L'autoritratto finale riunisce tutto: lo specchio fa da piano pittorico, una lampada di lato crea luci e ombre nette, si parte dalle grandi masse cancellando le luci sul fondo grigio e scurendo le ombre, e i lineamenti si lasciano emergere invece di disegnarli per primi. Ogni tanto ci si alza per guardare da lontano con occhio critico e poi si torna a lavorare. Alla fine, accanto all'autoritratto iniziale, la differenza è evidente: non più simboli, ma osservazione. La somiglianza, la gestalt, arriva da sola come risultato di tutte le parti viste bene."]}
],
c11:[
 {h:"Continuare a disegnare", p:[
  "Le nuove connessioni nel cervello si consolidano solo con la ripetizione. Il consiglio è semplice: un piccolo taccuino sempre con sé e un disegno di qualunque cosa capiti a portata di mano nei momenti morti. Copiare foto di giornale capovolte è il modo più rapido per cambiare modalità; disegnare dal vero e copiare i maestri sono la pratica migliore.",
  "Anche quando non si può disegnare si può allenare l'occhio: cercare spazi negativi, individuare la propria linea d'orizzonte, valutare un angolo rispetto alla verticale, controllare le proporzioni dei volti in tv."]},
 {h:"Computer e mente visiva", p:[
  "I computer imitano benissimo il modo di pensare verbale e sequenziale: contano, ordinano, seguono procedure meglio di noi. Molto più lento è stato il progresso nelle capacità visive: riconoscere un volto di tre quarti o distinguere un sorriso cordiale da uno beffardo resta difficile per le macchine e facilissimo per un bambino.",
  "Per questo l'autrice trova paradossale che la scuola insista sempre di più proprio sulle abilità in cui le macchine ci superano, trascurando quelle percettive. Riprende una proposta: insegnare ai ragazzi come funziona il loro cervello, quale modalità serve per ogni problema e come accedervi."]},
 {h:"Le cinque fasi della creatività", p:[
  "Il processo creativo viene descritto in cinque fasi, ognuna con una modalità prevalente. La prima intuizione (R): guardandosi intorno si nota qualcosa che non torna e nasce una domanda, «chissà perché…». La saturazione (L): si raccoglie tutto ciò che si sa sul problema, finché le informazioni non si incastrano e arriva la frustrazione. L'incubazione (R): si smette di pensarci e la mente lavora per conto suo, cercando lo schema in cui tutto si tiene.",
  "Poi l'illuminazione, l'«aha» improvviso che arriva spesso facendo altro, con un senso di gioia e di cose che vanno al loro posto. Infine la verifica (L guidata da R): la parte faticosa di trasformare l'intuizione in qualcosa di concreto, che molti non portano a termine. Si può persino «programmare» l'incubazione: dire a sé stessi che serve una soluzione entro una certa data, e poi staccare."]},
 {h:"Vedere un problema come un disegno", p:[
  "L'esempio del designer che deve decidere se accettare un cliente mostra come usare le cinque abilità come metafore. I bordi: dove i miei interessi toccano quelli dell'altro, e com'è quel confine, morbido o netto? Gli spazi negativi: che cosa non so, chi altro decide? I rapporti: qual è l'orizzonte di ciascuno, qual è l'unità base su cui misurare tutto, tempo, soldi, qualità? Luci e ombre: che cosa è chiaro e che cosa resta al buio? La gestalt: guardare il tutto, magari capovolgendolo mentalmente.",
  "Il capitolo chiude con esempi reali, come due inventori che ripensano un divaricatore chirurgico usato da quasi un secolo, e con l'arte delle caverne, prova di una capacità di immaginare e visualizzare straordinaria già decine di migliaia di anni fa. La domanda finale è se possiamo recuperare quella forza visiva per vedere in anticipo i pericoli e le opportunità del futuro."]}
],
c12:[
 {h:"Il disegno ti rivela", p:[
  "Ogni disegno, qualunque sia il soggetto, mostra anche chi lo ha fatto: come vede le cose e che cosa prova. Si disegna in modalità visiva, in silenzio, e poi si può tornare alle parole per interpretare ciò che è emerso; se le parole non bastano, si torna di nuovo all'intuizione. Gli esercizi del libro sono solo i primi passi di questo viaggio.",
  "Imparare a disegnare non finisce mai: c'è sempre la sensazione che nel prossimo disegno si vedrà un po' più a fondo."]},
 {h:"Consigli per andare avanti", p:[
  "Disegnare tutto: nessun soggetto è troppo difficile o troppo banale, anche un ciuffo d'erba o un carciofo. Studiare i maestri copiandone i disegni, non per imitarne lo stile ma per capire come guardavano. Proteggere il proprio stile e dargli il tempo di crescere. Se un disegno va male, fermarsi, calmarsi e ricordare che tutto ciò che serve è lì davanti agli occhi.",
  "Non aspettare l'ispirazione: bisogna predisporre le condizioni per entrare nello stato giusto, ogni giorno, altrimenti le strade appena aperte si richiudono. E insegnare a qualcun altro, perché spiegare le lezioni le fissa anche in chi le spiega. Infine usare le stesse abilità per i problemi della vita: guardarli da più punti di vista, vederne le parti nelle giuste proporzioni, lasciarli maturare mentre si fa altro."]}
]
};

const EN = {
ch:{
intro:{idea:"Drawing is a skill you learn like reading: it takes no talent, just the right component skills taught in the right order.",
 points:[
  "The book mainly teaches you to see: the same perceptual skills also help you think and solve problems.",
  "Drawing breaks down into five basic skills: edges, spaces, relationships (perspective and proportion), lights and shadows, and the whole (the gestalt). The first four are taught; the fifth comes by itself.",
  "The strategy of the whole course: to get the visual part of the brain working, give the verbal part a task it turns down (upside-down images, very slow detail, empty spaces, paradoxes, shadows).",
  "The brain is plastic: learning to draw builds new connections, and the skill stays for life, like reading.",
  "The “great saboteur”: the verbal part will find a thousand excuses to keep you from drawing. The remedy is the same trick: start with a task it rejects.",
  "Pages 27–31 show the 5-day workshop: initial self-portrait, upside-down drawing, hand, negative spaces, perspective, profile, final self-portrait."]},
c1:{idea:"Drawing depends on seeing the way an artist sees. Like riding a bike, it's hard to explain in words and you understand it by doing it.",
 points:[
  "Drawing and seeing are almost inseparable; the artist's way of seeing differs from the one we use to get around in everyday life.",
  "Exhortations (“look harder”, “check the relationships”) don't help: you need a demonstration and a method.",
  "Anyone with normal eyesight and coordination (who can sign their name or write a text message) can learn to draw.",
  "Drawing puts you in a different state: alert, absorbed, timeless, similar to highway driving. It's fragile: a question or a phone call breaks it.",
  "Deliberately “hard” subjects are chosen (hand, chair, interiors, profile, self-portrait): drawing is always the same task, only the subject changes.",
  "Portraits are highly motivating and use a specialty of the right hemisphere: recognizing faces."]},
c2:{idea:"Get your materials, build your tools and record your starting point with three “pre-instruction” drawings.",
 points:[
  "Essential materials (pp. 44–46): paper, pencils, graphite stick, erasers, picture plane, two viewfinders, a mirror. The picture plane and viewfinders are needed until you've internalized them.",
  "Picture plane, viewfinders and the format on the paper all share the same proportions: so what you see in the viewfinder transfers to the paper.",
  "The pre-instruction drawings are the proof of your progress: improvement brings a kind of amnesia about how you used to draw.",
  "Drawing from memory brings out the childhood “symbol system”: identical eyes, noses and fingernails that the hand draws almost on its own.",
  "Your starting level only shows the age at which you stopped drawing, not your potential.",
  "Style is yours like handwriting: the course doesn't teach it, it teaches you to see. There are many kinds of line (bold, broken, pure, “lost and found”), all valid (p. 59)."]},
c3:{idea:"The two hemispheres process information in different ways: drawing needs the visual mode (R), usually overridden by the verbal one (L).",
 points:[
  "The hemispheres are joined by the corpus callosum and control the opposite side of the body. Sperry's “split-brain” studies show that each has its own way of knowing.",
  "L-mode: verbal, analytic, symbolic, abstract, temporal, rational, linear. R-mode: nonverbal, synthetic, concrete, analogic, nontemporal, spatial, intuitive, holistic (list on pp. 75–76).",
  "Languages reveal an ancient bias against the left (sinister, gauche) and therefore against the right hemisphere.",
  "The “eureka” moment is the sign of R-mode: sudden connections between seemingly unrelated things.",
  "Left- and right-handers learn the same way: draw with the hand you normally use.",
  "Which side takes on a task is decided by speed and motivation: the verbal part only gives it up if it seems too slow, too detailed or impossible. The exercises exploit exactly this."]},
c4:{idea:"Two exercises to feel the shift in mode: first the conflict (Vase/Faces), then the way out (upside-down drawing).",
 points:[
  "In Vase/Faces, naming the parts of the profile activates the verbal part; completing the symmetrical vase requires the visual one: the result is a “glitch”.",
  "Drawing in R-mode means asking only spatial questions: where does the curve begin? how deep is it? what angle does it make with the edge of the paper?",
  "The European navigator follows a plan; the Trukese navigator steers by constantly reading the relationships between things: the second is the artist's way.",
  "Upside-down images resist naming: the verbal part gives up and the visual one works undisturbed. The hardest parts (like foreshortening) come out better precisely because you don't know what you're drawing.",
  "You recognize the R-state afterwards: no sense of time, other people's words not decoded, calm alertness, the feeling of a fascinating puzzle.",
  "Goal of the course: to bring on that shift at will, even with right-side-up subjects."]},
c5:{idea:"Around age 9–10 almost everyone stops drawing: the symbol system learned as a child takes the place of perception.",
 points:[
  "Stages of children's drawing: scribbling (from about a year and a half), symbols (the circle with eyes that becomes mom, the sun, a cat), drawings that tell stories, the repeated symbolic landscape.",
  "Young children have an almost perfect sense of composition within the four edges of the paper; they later lose it by focusing on individual objects.",
  "Around age 10 lateralization is complete and language dominates: kids want realism, but the drawing doesn't come out right and many give up (often also because of a sarcastic remark).",
  "The cube paradox: to make it look like a cube you have to draw non-square shapes, exactly as they appear. Knowledge (“the corners are right angles”) sabotages sight.",
  "Memorized symbols (eye, nose, hand, tree) are ready to fire: the solution is always the main strategy, a task the verbal part rejects.",
  "In R-mode you slow down, lose track of time, don't decode words, feel calm and capable: this is the state to bring under control."]},
c6:{idea:"First skill: in drawing, an edge is always shared between two things, and the contour line draws both.",
 points:[
  "An edge is where two things meet; the contour line is the shared boundary (like jigsaw puzzle pieces). The format is an edge too.",
  "Pure contour drawing (very slow, never looking at the paper) doesn't produce a “nice” drawing, but it's the most effective exercise in the course: the verbal part gets bored and leaves.",
  "Every detail becomes a whole made of smaller details, almost fractal: you rediscover wonder at ordinary things.",
  "The picture plane is an imaginary window always parallel to your face: drawing from life means copying what you see “flattened” on that plane (Alberti, Dürer, Van Gogh's frame).",
  "Close one eye and keep your head still: a single view, flat as a photograph. Copied onto paper, that flat image looks three-dimensional.",
  "A toned ground (smudged graphite) removes the fear of the blank page and forgives erasures."]},
c7:{idea:"Second skill: the negative spaces around things are as real as the objects, and drawing them makes hard parts easy.",
 points:[
  "Positive forms (objects) and negative spaces share edges: draw one and you've drawn the other. Spaces have no names, so you see them as they are.",
  "Three functions of negative spaces: they make foreshortening and complicated shapes easy; they unify the drawing and strengthen the composition; they train perception.",
  "Composition is the arrangement of shapes and spaces within the format; the format rules. Always start by choosing the framing with the viewfinder and drawing the format.",
  "Basic unit: a medium-sized shape or space to start from, called “One”. All proportions are measured against it (1:¾, 1:2…), so your chosen composition doesn't “run off the page”.",
  "The chair is the ideal subject: you know too much about chairs (equal legs, wide seat) and what you know doesn't match what you see.",
  "Starting procedure for every exercise (pp. 179–180): format, tone, crosshairs, framing with the viewfinder, basic unit on the plane, transfer to the paper, then draw."]},
c8:{idea:"Third skill: perspective and proportion. Understand the formal concepts, then “sight” with your pencil.",
 points:[
  "Perspective asks you to accept paradoxes: a cube is drawn with non-right angles and unequal sides, yet it looks like a cube.",
  "Key concepts: fixed point of view, picture plane, horizon line (always at your eye level, it rises and falls with you), vanishing points, converging lines.",
  "Horizontal edges above the horizon slant down toward the vanishing point, those below slant up, those at eye level stay horizontal; verticals stay vertical.",
  "Two-point perspective has vanishing points almost always off the page: that's why artists use sighting instead of rulers.",
  "Angles: judge them against vertical and horizontal, on the plane, without “poking through” it with the pencil. Memorize the “pie slice” of the angle rather than the degrees.",
  "Proportions: arm extended and elbow locked, one eye closed, measure the basic unit with your thumb on the pencil, compare it, then “erase the measurement” and remeasure the unit in the drawing, which has a different scale.",
  "The biggest difficulty is believing your own measurements: if you see it, draw it."]},
c9:{idea:"Edges, spaces and relationships together in a profile portrait, beating the tricks of “size constancy”.",
 points:[
  "The brain changes the sizes of what you see to match what it knows (size and shape constancy) and doesn't tell you. Measuring is the only way to catch it.",
  "The “chopped-off skull” error: people see the eyes a third of the way down, but the eye-level line is at half the head (from the top of the skull/hair to the chin).",
  "The features are small relative to the skull: the brain enlarges them because they're the important part.",
  "Ear: eye level to chin = back of the eye to back of the ear (an isosceles triangle). The bottom of the ear is about level with the space between nose and mouth.",
  "The neck joins the skull higher than you'd expect and is wide: no thin neck under an oval.",
  "Tricks: for the iris draw the white of the eye as a negative space; for glasses and collars draw the spaces around them; for hair render masses, directions and darks, not individual hairs.",
  "Copying master drawings is excellent training: it forces you to slow down and see what the artist saw."]},
c10:{idea:"Fourth skill: the “logic of light” gives volume. The fifth, the gestalt, comes on its own as an “aha”.",
 points:[
  "Four aspects of light: highlight (where light hits directly), cast shadow (the darkest, where the object blocks the light), reflected light (bounced off nearby surfaces), crest shadow (on the ridge of the form, between light and reflected light).",
  "Values range from the white of the paper to the densest black; “high” = light, “low” = dark.",
  "Shapes of light and shadow have no names and change with every movement: the verbal part rejects them. Upside down they look like blotches (Courbet, pp. 270–271).",
  "Viewers complete forms from just a few clues: suggesting is enough, and you have to know when to stop.",
  "Three poses: frontal, profile, three-quarter. Frontal: the space between the eyes is one eye-width; nostrils under the inner corners of the eyes; corners of the mouth under the pupils; ears from the eyes to the nose-mouth area; neck nearly as wide as the jaw.",
  "Three-quarter: the turned side is narrower, eye and mouth change shape; from the front corner of the eye to the back of the ear = eye-to-chin. Typical mistake: near eye too close to the nose.",
  "Hatching and crosshatching are learned with practice and become a personal signature."]},
c11:{idea:"The five drawing skills transfer to thinking: you can “see” a problem in terms of edges, spaces, relationships, lights and shadows.",
 points:[
  "Draw a little every day: a sketchbook always with you, upside-down copies of photos, copies of the masters, even just mental practice.",
  "Computers excel at L-functions; R-functions (recognizing an expression, intuiting) remain much harder to imitate, yet schools keep stressing the former.",
  "Five stages of creativity: First Insight (R, seeing the problem), Saturation (L, research), Incubation (R, it works by itself while you do other things), Illumination (the “aha”), Verification (L guided by R, the hard work).",
  "You can “program” your brain: ask it to find the solution by a certain date and then let go.",
  "The designer example: edges shared with the client, blank spaces to discover, horizon and vanishing points, basic unit, lights and shadows of the project, gestalt.",
  "True creativity also requires social value; cave art shows how powerful the ability to visualize was."]},
c12:{idea:"The course is only the beginning: drawing never ends, and every drawing also shows who made it.",
 points:[
  "You draw in R-mode and then interpret in L-mode: the drawing reveals how you see and feel things.",
  "No subject is too hard or too ordinary: everything deserves to be drawn.",
  "Copy the masters not to imitate their style but to understand how they saw.",
  "Protect and nurture your style; if a drawing goes wrong, calm down and go back to looking.",
  "Don't wait for inspiration: set up the conditions for the shift in mode, every day.",
  "Teach someone else: going over the lessons fixes them in you too."]}
},
ex:{
 strumenti:{t:"Build the picture plane and viewfinders", min:"20 min",
  mat:"Clear plastic 8×10 in (20×25 cm), black cardboard, permanent marker, scissors",
  steps:["On the picture plane, draw with the permanent marker a vertical and a horizontal line crossing at the center.",
   "Cut two rectangles of black cardboard the size of the plane (8×10 in) and draw the diagonals.",
   "Small viewfinder: mark an inner rectangle 2 in (5 cm) from the edges (the corners fall on the diagonals) and cut it out.",
   "Large viewfinder: same thing, 1 in (2.5 cm) from the edges.",
   "To use them, clip one or the other to the plane."],
  why:"Windows, plane and format share the same proportions: the scale changes, not the shape."},
 pre1:{t:"Pre-instruction 1: a person from memory", min:"15–20 min",
  mat:"Plain paper, HB pencil, tape, drawing board",
  steps:["Tape 3–4 stacked sheets to the board (they act as padding).",
   "Call a person to mind (a photo or one of your old drawings works too).",
   "Draw them as best you can: head only, half-figure or full figure.",
   "Title, signature and date at the bottom right."],
  why:"Shows how much the childhood symbols guide your hand."},
 pre2:{t:"Pre-instruction 2: self-portrait in a mirror", min:"20–30 min",
  mat:"Small mirror, HB pencil, board leaning against the wall",
  steps:["Tape the mirror to the wall and sit an arm's length away; you must see your whole head.",
   "Lean the board against the wall with its bottom edge in your lap.",
   "Look at your reflection and draw yourself.",
   "Title, signature and date."],
  why:"It will be the benchmark for the final self-portrait (ch. 10)."},
 pre3:{t:"Pre-instruction 3: my hand", min:"15–20 min",
  mat:"HB pencil, paper",
  steps:["Sit at a table.",
   "Draw your non-drawing hand, in whatever pose you like.",
   "Title, signature and date.",
   "Compare the three drawings: look for repeated symbols (identical eyes, identical nails) and note them on the back. Then put them away until the end of the course."],
  why:"The backs of the sheets become the diary of your starting point."},
 firma:{t:"Your signature as a drawing", min:"10 min",
  mat:"Plain paper, HB pencil",
  steps:["Write your signature as usual and look at it as a drawing: it's unique and yours alone.",
   "Look at the five signatures in the margin (p. 56): same name, different personalities. What do they tell you?",
   "Rewrite your name in at least three different line styles and notice what changes (speed, pressure, rhythm, size)."],
  why:"You already express yourself with line: the course focuses on seeing, style comes on its own."},
 vasi:{t:"Vase/Faces", min:"5–10 min",
  mat:"Paper, HB pencil",
  steps:["Copy half the vase/faces: profile on the left if you're right-handed, on the right if you're left-handed (figures on p. 83).",
   "Close the vase with two horizontal lines at the top and bottom.",
   "Trace over the profile naming the parts out loud: forehead, nose, lips, chin, neck.",
   "Now draw the opposite profile to complete a symmetrical vase and notice the confusion that sets in.",
   "Note how you resolved it (grid, space between the profiles, starting from the bottom…) and write it on the back."],
  why:"Lets you feel the conflict between the two modes."},
 stravinsky:{t:"Upside-down drawing: Picasso's Stravinsky", min:"40–60 min",
  mat:"The upside-down image on p. 93, HB pencil, paper, a quiet hour",
  steps:["Set aside an hour; music without words, or silence.",
   "Never turn the model or your drawing right side up until you're done.",
   "Start wherever you like and move from one line to the next, from one space to the adjacent shape, like a puzzle. Don't do the outline first.",
   "If you talk to yourself, use only visual language: this line curves like this, it goes at this angle relative to the edge of the paper.",
   "Hands and face will try to get themselves named: cover them with a finger or a sheet of paper and uncover one line at a time.",
   "At the end turn everything around and look at the result."],
  why:"The verbal part can't “read” upside-down images and steps aside."},
 capovolti:{t:"More upside-down drawings", min:"30–60 min",
  mat:"Images on pp. 99–101 or upside-down photos and drawings of your choice",
  steps:["Pick Spider-Man on p. 99 or the German knight on p. 100 (line version on p. 101).",
   "Draw a format with the same proportions as the image: the format governs shapes and spaces.",
   "Proceed as with Stravinsky, always upside down.",
   "After each drawing think back on how you felt: learn to recognize the R-state."],
  why:"Repeating the shift makes it familiar."},
 paesaggio:{t:"The remembered childhood landscape", min:"15 min",
  mat:"Paper, HB pencil",
  steps:["Before reading further, draw the landscape you used to draw as a child (house, sun, trees, mountains, road…).",
   "Title it “Remembered Childhood Landscape”.",
   "As you draw, recall the pleasure and confidence with which you put each symbol in its place.",
   "Cover one element with your hand and see how the balance of the composition changes (example on p. 115)."],
  why:"Brings back your symbols and your innate sense of composition."},
 contpuro:{t:"Pure contour drawing of your palm", min:"5 min (+ repeats)",
  mat:"Paper taped to the board, HB pencil, timer",
  steps:["Cup your non-drawing hand a little: you'll draw all the creases of the palm.",
   "Set the timer for 5 minutes.",
   "Turn completely away: you look only at your palm, never at the paper.",
   "Follow a crease millimeter by millimeter: eye and pencil moving at the same slow pace, like a seismograph.",
   "Don't stop or turn around until the timer goes off; the inner protests pass within a minute.",
   "If the shift didn't happen, try again with a crumpled piece of paper, a flower, a feather (p. 134)."],
  why:"The task is too slow and minute for the verbal part, which leaves the field."},
 pianomano:{t:"Drawing your hand on the picture plane", min:"15–20 min",
  mat:"Picture plane, viewfinder, clips, non-permanent marker, damp tissue",
  steps:["Rest your hand on the table with the fingers pointing toward your face (foreshortened view).",
   "Pick the viewfinder that best frames the hand, clip it to the plane and trace the inner edge with the marker (the format).",
   "Rest the plane on your fingertips, close one eye and don't move your head.",
   "Trace the edges on the plane exactly as you see them, without naming the parts; correct with the damp tissue.",
   "Repeat with more complicated poses (fist, crossed fingers, an object in your hand) and keep the best drawing."],
  why:"Lets you grasp hands-on that drawing is copying what lies on the plane."},
 pianostanza:{t:"Look at the world through the plane", min:"5 min",
  mat:"Picture plane with the large viewfinder",
  steps:["Hold the plane in front of your face, parallel to your eyes, and close one eye.",
   "Move it closer and farther to change the framing.",
   "Compare the angles of the ceiling or of a table with the crosshairs: vertical and horizontal.",
   "Imagine tracing them; then put the plane down and try to “see” it anyway."],
  why:"Prepares the imaginary picture plane you'll always use."},
 contmod:{t:"Modified contour drawing of your hand on a toned ground", min:"1 hour",
  mat:"Drawing pad, graphite stick, paper towel, HB and 4B pencils, three erasers, the plane with the hand drawn on it",
  steps:["Tape the sheets at the four corners and draw the format using the viewfinder as a template.",
   "Tone the paper: light graphite, then rub in circles to an even silver gray. Add the crosshairs, lightly.",
   "Transfer the main points of the drawing on the plane to the paper using the crosshairs (same scale).",
   "Put your hand back in the pose, close one eye and slowly draw every undulation of the edges, looking at your hand 90% of the time.",
   "For the nails draw the shapes of skin around them; if a part stumps you, move to the next shape.",
   "Finish: erase out the lights, darken the shadows, optionally lighten the background."],
  why:"It's the first “real” drawing: three-dimensional because it was copied from a flat view."},
 sedia:{t:"Negative spaces of a chair", min:"1 hour or more",
  mat:"Large viewfinder, picture plane, marker, drawing pad, pencils, erasers, graphite, paper towel",
  steps:["Format with the outer edge of the plane, toned ground, light crosshairs.",
   "Place a chair (ideally with rungs and slats) in front of a plain wall, 7–8 ft (2–2.5 m) from you. A lamp can add an interesting shadow.",
   "Compose with viewfinder and plane, one eye closed; imagine the chair disappearing and only the spaces remaining.",
   "Choose a simple space as your basic unit (e.g. between two slats), draw it on the plane and transfer it to the paper, checking position and angles against the crosshairs.",
   "From there draw one space after another like puzzle pieces, asking yourself only about widths and angles relative to the unit and to vertical/horizontal.",
   "At the end lighten the spaces or the chair with the eraser and add the shadows."],
  why:"The verbal part won't deal with “nothing”: the chair comes out right on its own."},
 copiespazi:{t:"Copy Homer and Rubens using negative spaces", min:"30–45 min",
  mat:"Images on pp. 189 and 190, pencil, paper",
  steps:["Copy Winslow Homer's boy on the wicker chair (p. 189), focusing on the negative spaces.",
   "Turn Rubens's studies of arms and legs (p. 190) upside down and draw the spaces around the forms first.",
   "Then turn the drawing right side up and complete the inner details."],
  why:"“Difficult” foreshortening becomes easy when you look around the forms."},
 spaziovunque:{t:"Negative space hunt", min:"every day",
  mat:"Just your eyes",
  steps:["During the day look for negative spaces: between branches, between buildings, the arrow in the FedEx logo.",
   "Imagine drawing them edge by edge.",
   "Do the same with a basket, a ladder, a whisk: ordinary objects that become beautiful."],
  why:"Mental practice makes the new perception automatic."},
 corridoio:{t:"One-point perspective: the hallway", min:"10 min + drawing",
  mat:"A long hallway, picture plane, pencil",
  steps:["Stand at the end of the hallway, in the center. Find your horizon line on the far wall and pick a point: the vanishing point.",
   "Hold up the plane parallel to your eyes, align the horizontal crosshair with the horizon and close one eye.",
   "Line up the pencil on the plane with the wall-ceiling edge: it slants down toward the vanishing point. Repeat on the other side and with the doors.",
   "The edges along the floor instead slant up toward the same point; verticals stay vertical.",
   "Sit down (lower horizon) and notice how the angles change.",
   "Draw the hallway in one-point perspective."],
  why:"Builds the “perspective mind-set” you'll later use by eye."},
 angolo:{t:"Sighting the angles of a room corner", min:"20 min",
  mat:"Plane with viewfinder, marker, pencil, paper",
  steps:["Sit 10–13 ft (3–4 m) from a corner of the room, preferably an uncluttered one.",
   "Compose with the plane, align the crosshairs at eye level and trace the vertical corner edge, then the ceiling-wall and floor-wall edges.",
   "Transfer the lines to paper: extended, they would converge at two vanishing points off the page.",
   "Now do it again with just the pencil: vertical for the corner edge, horizontal at the top, and “photograph” the triangle each angle forms.",
   "Always compare with the horizontal or the vertical, choosing whichever gives the smaller angle."],
  why:"Angles can only be seen by comparing them with the two constants."},
 gesto:{t:"The gesture for measuring proportions", min:"10 min",
  mat:"Pencil",
  steps:["Close one eye, arm extended and elbow locked, pencil on the imaginary plane.",
   "Mark the width of the basic unit with your thumb (e.g. the top of a door).",
   "Compare it with another measurement: 1:1, 1:2, 1:2⅔…",
   "Remember the ratio and “erase the measurement from the pencil”.",
   "In the drawing remeasure the unit and apply the same ratio: one… two…"],
  why:"Avoids the most common mistake: carrying the real measurement straight onto the paper."},
 duepunti:{t:"Two-point perspective drawing", min:"1–2 hours",
  mat:"Toned pad, pencils, erasers, plane with large viewfinder, two chairs",
  steps:["Starting procedure as for the chair; format with the outer edge of the plane.",
   "Pick an interesting spot (a kitchen corner, an open door, a balcony, an intersection): not necessarily an easy one.",
   "Compose with the viewfinder, choose a medium basic unit (window, door, picture) and draw it on the plane.",
   "Transfer it to the paper using the four quadrants of the crosshairs (enlarging a little).",
   "Proceed from part to adjacent part, sighting angles and proportions; use negative spaces for small objects and foliage.",
   "Squint to see the large masses of light and shadow: erase out the lights, darken the shadows. Check the parts that look “off” with the plane."],
  why:"With edges, spaces and relationships you can draw anything you see."},
 costanza:{t:"Testing size constancy", min:"15 min",
  mat:"A piece of paper to notch, picture plane, marker, a mirror",
  steps:["The four men (p. 230): notch a slip as tall as one figure and check that they're all the same; then turn the book upside down.",
   "The two tables (p. 232): trace one tabletop on the picture plane and lay it over the other.",
   "In a crowded place look at near and far heads through a paper tube.",
   "In the mirror, at arm's length, mark the top of your head and your chin with the marker: the image is about half life-size."],
  why:"The brain must be “caught in the act” before you'll believe the measurements."},
 misuretesta:{t:"Head proportions (frontal and profile)", min:"20 min",
  mat:"Paper, pencil, mirror, photos of faces",
  steps:["Draw a frontal oval with the central axis and the eye-level line halfway down.",
   "On your own head: measure with the pencil from the inner corner of the eye to the chin, then from the eyes to the top of the head. They're equal.",
   "Check on photos, in the mirror and on the TV screen.",
   "Draw the profile blank (p. 244) with the eye-level line at the halfway mark.",
   "Measure the back of the ear with the isosceles-triangle rule, then the bottom of the ear and the point where neck and skull meet; mark them on the blank."],
  why:"Memorizing these constants avoids the most common mistakes."},
 sargent:{t:"Copying Sargent's Madame X profile", min:"1 hour",
  mat:"Drawing pad, HB and 4B pencils, erasers, picture plane as a template",
  steps:["Draw the format with the plane and light crosshairs; no toned ground (it's a line drawing).",
   "Lay the plane over the drawing on p. 249 to see where the crosshairs fall and choose the basic unit (ear, nose, eye-to-chin).",
   "Follow the checks on pp. 251–252: hairline, tip of the nose, nose-chin angle, negative spaces in front of the face and neck, position of the ear.",
   "Assemble the drawing like a puzzle, comparing everything with the basic unit.",
   "At the end turn both original and copy upside down: the errors jump out."],
  why:"A dress rehearsal before the real model."},
 profilo:{t:"Profile portrait from life", min:"1 hour or more",
  mat:"A model (even someone watching TV or reading), picture plane, marker, drawing pad, pencils, erasers, two chairs",
  steps:["Format, light toned ground (or none, for a line drawing) and crosshairs.",
   "Model facing left if you're right-handed; sit 2–4 ft (60–120 cm) away.",
   "Compose with the plane, leaving room for neck and shoulders (the chin shouldn't touch the edge).",
   "Eye-to-chin basic unit: mark it on the plane and transfer it to the paper, along with the top of the hair and the back of the head.",
   "Start from the negative space in front of the profile; check the nose-chin angle, the space under the nostril, the angle of the eyelid and of the line of the mouth.",
   "Place the ear with the triangle, measure the back of the head, render the hair as masses and directions, then neck and collar through the negative spaces."],
  why:"Here the first three skills become a single skill."},
 courbet:{t:"Look at Courbet upside down", min:"5 min",
  mat:"Just the book",
  steps:["Look at Courbet's self-portrait upside down: you only see light and dark blotches.",
   "Turn it right side up: the same blotches become a head in relief.",
   "Look at the blotchy images on p. 272: first you see the pattern, then you understand what it represents."],
  why:"Understanding that shadows should be drawn as shapes, not interpreted."},
 frontale:{t:"Facial proportions in the mirror", min:"20 min",
  mat:"Mirror, paper, pencil",
  steps:["In front of the mirror (which acts as the picture plane) draw an oval with a central axis and the eye-level line halfway down.",
   "Tilt your head: axis and eye-level line stay at right angles.",
   "Divide the eye-level line into fifths (one eye of space between the eyes).",
   "Find the base of the nose with the inverted triangle from the outer corners of the eyes, then the mouth a third of the way from nose to chin.",
   "Mark nostrils, corners of the mouth, ears and neck width; then check on other people and photos."],
  why:"A general guide to adapt to every face."},
 tretquarti:{t:"The three-quarter view in the mirror", min:"30 min",
  mat:"Mirror, paper, pencil",
  steps:["Turn your head until the tip of the nose almost touches the contour of the far cheek.",
   "Find the central axis (center of the bridge of the nose and of the upper lip) and its tilt; the eye-level line is perpendicular to it.",
   "Start from the closed shape between nose and turned cheek; draw the far eye through the shapes around it (above, beside, the white, below).",
   "Near eye: it's about one eye-width from the edge of the nose.",
   "Lines parallel to the axis for nostrils and corners of the mouth; ear with the front-of-eye → back-of-ear rule."],
  why:"Prepares the final self-portrait, preferably in three-quarter view."},
 steichen:{t:"Copying the Steichen detail", min:"1 hour",
  mat:"4B (or 6B) pencil, erasers (one cut to a point), picture plane, graphite, paper towel",
  steps:["Format with a viewfinder; tone the paper to the darkest gray you can.",
   "Lay the plane over the image on p. 288; make the crosshairs on the paper with the eraser along a ruler.",
   "Choose the basic unit (e.g. the length of the nose) and transfer it.",
   "“Draw” with the eraser: first the large shapes of light, then the brightest lights (forehead, scarf, tip of the nose).",
   "Darken the shadow areas with the 4B, keeping the tones smooth.",
   "Step back, squint, and stop as soon as the face “appears”. Don't draw the eyes."],
  why:"Teaches how little it takes for the viewer to see everything."},
 tratteggio:{t:"Hatching and crosshatching", min:"15 min + practice",
  mat:"Paper, well-sharpened HB or 4B pencil",
  steps:["Make a group of 8–10 parallel marks moving your hand from the wrist: that's a “set”.",
   "Try direction, speed, spacing and length until you find your own.",
   "Cross a second set at a slightly different angle (vibrating effect) or a sharper one.",
   "Layer several sets to darken; also try curved strokes that follow the form.",
   "Practice on spheres and cylinders, even while on the phone."],
  why:"Hatching becomes your personal way of making tones."},
 autoritratto:{t:"Self-portrait in light and shadow", min:"1–2 hours",
  mat:"Drawing pad, pencils, erasers, mirror at arm's length, adjustable lamp, graphite, optionally a hat",
  steps:["Format and toned ground (light, medium or dark: your choice), crosshairs.",
   "Mirror at arm's length (it's your picture plane), board leaning against the wall, lamp to one side. Choose a frontal or three-quarter pose and don't move anything again.",
   "Choose the basic unit (e.g. eye-to-chin) and mark its ends on the mirror with the marker; transfer them to the paper.",
   "Squint and erase out the large shapes of light; then darken the shadowed side with the 4B.",
   "Don't draw the features right away: let them emerge from the shadows (for the eyes, a finger smudged with graphite is enough).",
   "Add the smaller shadows; get up now and then to look from a distance and correct."],
  why:"Brings the four skills together: the fifth, the likeness, emerges by itself."},
 confronto:{t:"Before and after", min:"10 min",
  mat:"The three pre-instruction drawings and the final self-portrait",
  steps:["Put the initial and the final self-portraits side by side.",
   "Notice what changed: fewer symbols, more observation.",
   "Measure the proportions of the end-of-course self-portraits in ch. 2.",
   "Bonus: a self-portrait as a character from art history."],
  why:"Makes visible the progress we tend to forget."},
 taccuino:{t:"A drawing a day", min:"10 min a day",
  mat:"A small sketchbook, a pencil",
  steps:["Always carry a sketchbook.",
   "In idle moments draw something nearby: a cup, scissors, a leaf.",
   "Or copy a newspaper photo upside down (sports and dance have beautiful negative spaces).",
   "When you can't draw, look for negative spaces, your eye level and angles around you.",
   "Tap “I drew today” on the home screen to count the days in a row."],
  why:"New pathways in the brain only consolidate with repetition."},
 problema:{t:"Draw one of your problems", min:"30 min",
  mat:"A sheet of paper and a real problem",
  steps:["Pick a real problem or decision.",
   "First insight: what are the shared edges (with whom? soft or hard)? What's in the negative spaces? Where's the horizon, what's the basic unit? What's in light and what's in shadow?",
   "Mentally turn the picture upside down to look for what you're missing.",
   "Saturation: gather the information you need.",
   "Incubation: give your brain a deadline and do something else.",
   "When the “aha” comes, verify it and put it into practice step by step."],
  why:"Transfer is learned best when you practice it on purpose."},
 insegna:{t:"Teach someone to draw", min:"an afternoon",
  mat:"Your materials, the book",
  steps:["Pick a friend or family member who “can't draw”.",
   "Have them do the pre-instruction drawings.",
   "Guide them through Vase/Faces, upside-down drawing and pure contour.",
   "Compare the results and tell them about the five skills."],
  why:"Explaining the process deepens your own understanding."}
},
