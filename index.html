memo:[
  {t:"The five skills", items:["Edges: the contour shared between two things.","Spaces: the negative spaces that share edges with the forms.","Relationships: angles relative to vertical/horizontal and proportions relative to the basic unit.","Lights and shadows: the logic of light, values.","Gestalt: the whole, which emerges by itself."]},
  {t:"Routine before every drawing", items:["Draw the format (edge of the viewfinder or of the plane).","Tone the paper, if you want to work on a gray ground.","Draw the light crosshairs.","Compose with viewfinder and plane, one eye closed.","Choose the basic unit (“One”) and draw it on the plane.","Transfer it to the paper with the help of the crosshairs.","Then draw, from adjacent part to adjacent part."]},
  {t:"Pocket perspective", items:["The horizon is always at your eye level.","Horizontal edges above the horizon: slant down toward the vanishing point.","At eye level: they stay horizontal.","Below the horizon: they slant up toward the vanishing point.","Verticals stay vertical (except for very tall buildings).","Stay on the plane: don't “poke through” it with the pencil."]},
  {t:"Sighting with the pencil", items:["One eye closed, arm extended, elbow locked.","Angles: compare them with vertical or horizontal (whichever is closer).","Proportions: always relative to the basic unit, as a 1:x ratio.","Erase the measurement from the pencil and remeasure in the drawing.","Believe your measurements: if you see it, draw it."]},
  {t:"The head in profile", items:["Eye-level line at half the head (top of skull/hair – chin).","Eye-to-chin = back of the eye – back of the ear (isosceles triangle).","Bottom of the ear about level with the space between nose and mouth.","The neck joins the skull high up, about level with the nose or mouth.","The features take up a small part of the head."]},
  {t:"The head, frontal and three-quarter", items:["Central axis and eye-level line always at right angles.","One eye of space between the eyes (eye-level line in fifths).","Base of the nose: inverted triangle from the outer corners of the eyes.","Mouth about a third of the way from nose to chin; corners under the pupils.","Nostrils under the inner corners of the eyes; ears from the eyes to nose-mouth.","Three-quarter: front corner of the eye – back of the ear = eye-to-chin; near eye one eye-width from the nose."]},
  {t:"Logic of light", items:["Highlight: where the light strikes directly.","Cast shadow: the darkest, where the light is blocked.","Reflected light: light bounced off nearby surfaces.","Crest shadow: on the ridge of the form, between light and reflected light.","Squint to see the large masses; stop when the form “appears”."]},
  {t:"When you're stuck", items:["Do two minutes of pure contour on a complex object.","Turn the model (or the drawing) upside down and keep going.","Draw the adjacent space or shape, not the “hard” part.","Stop naming the parts: ask yourself only about angles, widths, curves.","Get away from distractions: the shift in mode is fragile."]}
],
long:{
intro:[
 {h:"Drawing is like reading", p:[
  "The book starts from a comparison with reading. Nobody thinks you need a special gift to read: you learn the letters, the sounds, the syllables and the words, and one day it all comes together and you just read without thinking. Drawing works the same way. It's one big skill made of several smaller ones, and people who say “I can't draw” have usually just never learned one or more of them.",
  "The book is written for complete beginners who believe they have no talent. The exercises aren't meant to produce “art”. They teach the alphabet of seeing: a solid base you can then take anywhere you like, from portraits to landscapes to abstract art."]},
 {h:"The five basic skills", p:[
  "To draw what's in front of you, you need to see in five ways. Edges: where one thing ends and another begins. Spaces: what's around and between things. Relationships: angles and proportions, which is what perspective is about. Light and shadow: the shades of light and dark that make things look solid. And the gestalt: seeing the whole thing at once.",
  "The first four have to be taught directly, one at a time, and that's what chapters 6 to 10 do. The fifth can't be taught: it happens as a result of the others. After looking carefully at all the parts, you suddenly “get” the whole thing, with a little “aha!”. The author compares this to the pleasure you feel in front of something beautiful."]},
 {h:"The trick: give the verbal mind a job it doesn't want", p:[
  "The whole method rests on one simple observation. The part of your brain that works with words is fast and bossy, and it jumps on every task, even ones it's bad at. Show it a face and, instead of really looking, it names things: eye, nose, mouth. Then it draws the simple symbols it already knows for them. Fighting it directly doesn't work.",
  "What works is going around it: you give it a task it finds pointless, boring or impossible, and it steps aside by itself. Every exercise in the book is a version of this trick: an upside-down picture you can't name, an outline drawn so slowly it's unbearable, an empty space that is “nothing”, an angle that goes against what you know, a shadow that changes shape every time something moves."]},
 {h:"Your brain can change, the saboteur, and using the skills elsewhere", p:[
  "We now know that the brain changes with experience: learning a new skill creates new connections. So the idea of a fixed talent that you either have or don't is wrong. And like reading, once you've learned to draw, you keep the skill for life.",
  "But watch out for the “great saboteur”. Because it's being pushed aside, the verbal mind will always find something more urgent for you to do. The fix is the same: start anyway, with something it doesn't care about, even just a negative space or an upside-down copy. The resistance gets weaker over time. And the ways of seeing you learn by drawing can also change how you think and solve problems. That's what chapter 11 is about."]}
],
c1:[
 {h:"Why a bicycle?", p:[
  "Teaching someone to draw is like teaching them to ride a bike. You can explain it in words as much as you like, but they only really get it by trying, ideally after watching someone else do it. That's why advice like “look harder” or “check the proportions” doesn't help much: beginners don't know what to look at, or how.",
  "Drawing from life needs a special way of seeing, different from the one we use every day to recognize things and get around. In daily life it's enough to know “what” something is. To draw it, you have to see “how” it really looks: its shapes, its angles, how its parts relate to each other."]},
 {h:"It isn't magic", p:[
  "Many people think drawing is almost a magical gift, and artists don't always help. Ask them “how do you do it?” and they say “I just look and draw what I see”. That's true, but it doesn't explain anything. The book wants to take the mystery away. If you can sign your name or write a message, your hand is skilled enough. The problem isn't your hand; it's your eyes, or rather the way your brain interprets what your eyes see.",
  "So learning to draw is more about unlocking something than adding something new: the ability is already there, hidden under old habits of seeing."]},
 {h:"A different state of mind", p:[
  "People who draw well slip into a special state. They concentrate deeply, lose track of time, hear voices around them as background noise, and feel calm and confident. It's like what happens on a long highway drive, while reading a gripping book or while playing a sport.",
  "This state is fragile: a question or a ringing phone is enough to pull you back to your normal way of thinking. So learning to draw also means learning how to set things up to get into that state, and learning to notice when you're in it."]},
 {h:"Why hard subjects?", p:[
  "The exercises deliberately use the subjects people find hardest: a hand, a chair, a room in perspective, a portrait, a self-portrait. That's because drawing is always the same task, whatever the subject. You may as well prove to yourself that you can handle the ones that scare you most.",
  "Faces have an extra advantage. Anyone can tell straight away if a portrait doesn't look like the person, so you get instant feedback, and getting a good likeness gives you a lot of confidence. And recognizing faces is a specialty of the visual side of the brain, which is exactly the side we want to train."]}
],
c2:[
 {h:"Your tools and why you need them", p:[
  "The materials are simple: paper, a couple of pencils, a graphite stick, three erasers, tape and a board. Two tools are special, though: the “picture plane”, a clear plastic sheet with a cross drawn on it, and two black cardboard “viewfinders”, which are frames with a window cut out. They might look like extras, but the book sees them as essential for understanding what drawing from life really means.",
  "The picture plane turns an abstract idea into something you can hold: you look at the world through a window and copy what you see as if it were flattened onto the glass. The viewfinders help you frame the scene and choose what to include. All of them have the same width-to-height ratio, so whatever you see in the viewfinder fits onto your paper; only the size changes. Once you've learned the skills, you won't need them anymore."]},
 {h:"The “before” drawings", p:[
  "Before you learn anything, you make three drawings: a person from memory, a self-portrait in a mirror, and your own hand. It's an uncomfortable moment, but an important one. As you improve, you tend to forget how you used to draw and become more and more critical of yourself. Having a signed and dated starting point lets you see how far you've really come.",
  "When you look at these drawings, don't hunt for mistakes. Look for the small places where you really observed something: the curve of an eyebrow, the fold of a collar. They show that the ability to see is already there."]},
 {h:"Stuck with childhood symbols", p:[
  "Drawing from memory reveals something useful: the set of symbols each of us built up as a child. Almond-shaped eyes with a circle inside, a hook for a nose, little arches for fingernails. Often the same symbols turn up in the self-portrait too, even though you're looking at a real face: your hand draws what it “knows” instead of what it sees.",
  "The level of these drawings usually matches the age when you stopped drawing, often somewhere between nine and twelve. That says nothing about your potential, only where you stopped. The course doesn't teach technical tricks; it teaches you to see differently, and that's what transforms your drawings."]},
 {h:"You already have a style", p:[
  "The book doesn't teach a style, and your signature proves you don't need one: it's a drawing made of a single line, unique and recognizable, showing speed, pressure, rhythm and character. Every time you write your name, you're already using line to express yourself.",
  "Your personal style grows by itself as you learn to see better. Two people drawing the same model with the same materials will make two portraits that both look like the model, yet look very different from each other. There are many kinds of line: bold, broken, thin and precise, fading out and coming back. None is better than the others. The more clearly you see, the more your drawings show who you are."]}
],
c3:[
 {h:"Two brains in one", p:[
  "Seen from above, the two halves of the brain look like the two halves of a walnut, joined by a thick bundle of nerve fibers called the corpus callosum. Each half controls the opposite side of the body: the right hand is run by the left half, and the other way round. For a long time scientists thought the left half, where language lives in most people, was the “main” one, and the right half was a kind of silent little sibling.",
  "Roger Sperry and his team studied patients whose corpus callosum had been cut, and this changed everything: both halves do complex work, but in different ways. Sometimes they work together, sometimes one takes charge, sometimes they get in each other's way. To avoid arguing about exactly where things happen in the brain, the book simply talks about two ways of thinking: “L-mode” and “R-mode”."]},
 {h:"L-mode and R-mode", p:[
  "L-mode is the verbal, analytical way of thinking. It names things, breaks them into parts, counts, follows steps in order, uses symbols, reasons logically and keeps track of time. It's perfect for solving a math problem or writing an outline. But it likes shortcuts: once it has recognized something, it labels it and moves on.",
  "R-mode is the visual way of thinking that sees the whole. It sees how parts fit together, understands where things are in space, works through comparisons and hunches, doesn't notice time passing, and is fine with things that are unclear or contradictory. This is what you need to draw what's in front of you, because it doesn't swap the real thing for an idea of it. Try describing a spiral staircase without twirling your finger, and you'll see how words can fall short."]},
 {h:"An old prejudice", p:[
  "Many languages show a bias against the left, and so indirectly against the right half of the brain, which controls the left side of the body. “Sinister” comes from the Latin word for left, while “dexterous” (skillful) comes from the word for right. In French, “gauche” (left) also means clumsy. Left-handed children used to be forced to write with their right hand, often with bad consequences. As the author points out, words were invented by the verbal half of the brain, and it kept the nicest ones for itself.",
  "Sudden flashes of insight, like Archimedes shouting “eureka!” in his bath, are moments when R-mode spots a connection that step-by-step reasoning had missed."]},
 {h:"Left-handers, right-handers, and which side takes over", p:[
  "Left- and right-handed people learn to draw in exactly the same way. There's no point switching hands: it just makes your lines clumsier. Draw with the hand you normally use.",
  "The key idea for the rest of the book is how the two halves of the brain share the work. Two things seem to matter: which side gets there first, and which side cares more. The verbal side is quick and bossy, and it only lets go when a task seems too slow, too detailed or impossible. The exercises are designed exactly so that the verbal side gives up."]}
],
c4:[
 {h:"Vase/Faces: feeling the clash", p:[
  "The first exercise is designed to make you get stuck. You copy one half of a picture that is both a vase and a face in profile, then go over the face line saying the parts out loud: forehead, nose, lips, chin. This switches on your verbal side. Then you have to draw the facing profile so that the vase is the same on both sides, and that can only be done by looking at shapes, curves and distances.",
  "Halfway through, almost everyone feels confused, and some people's hand actually freezes: you no longer know whether the line should go left or right. That's the whole point: to make you feel the clash between two ways of thinking. Everyone finds their own way out, such as looking at the space between the profiles, drawing a grid, starting from the bottom, or no longer thinking of it as a face. It's worth writing down what worked for you."]},
 {h:"Think like an island navigator", p:[
  "The book compares two sailors. The European navigator sets off with a written plan, routes and coordinates, and follows it step by step. The navigator from the Truk Islands keeps the destination in mind in relation to the other islands and keeps adjusting course by watching the sun, the wind and the waves. He sails brilliantly, but couldn't explain how in words.",
  "You should draw the second profile like the second navigator. The right questions are only about shape and space: Where does this curve start? How deep does it go? What angle does it make with the edge of the paper? How long is it compared with the line I just drew? No names, and no rules like “the chin sticks out as far as the lips”."]},
 {h:"Drawing upside down", p:[
  "Things that are upside down are hard to recognize and name. A famous face upside down becomes unrecognizable; your own handwriting becomes hard to read. The verbal side, which depends on recognizing things, finds the task annoying and pointless, and backs off. The visual side doesn't care whether something is upside down or not: it just sees interesting lines and shapes.",
  "When people copy Picasso's portrait of Stravinsky upside down, almost all of them are surprised by how good it is. Often the best parts are the hardest ones, like the crossed legs coming toward you, because they didn't know what they were drawing. Where the brain does recognize something, like the hands and face, the doubts and the erasing come back. The lesson is simple: whatever you see, draw it exactly as it is."]},
 {h:"Noticing when you're in R-mode", p:[
  "You don't notice the switch from one way of thinking to the other while it's happening, but you can recognize it afterwards. You lost track of time, other people's words became just sounds, you felt alert but relaxed and confident, and the drawing started to feel like a fascinating puzzle.",
  "Doing more upside-down drawings helps you get used to this feeling. The goal of the course is to be able to switch into it even when the subject is the right way up, by always looking for visual information that the verbal side doesn't want or can't deal with."]}
],
c5:[
 {h:"How children draw", p:[
  "At around 18 months, children start scribbling, just for the joy of seeing a line come out of the pencil. Then comes the big discovery: a mark can stand for something. A circle with two dots becomes mom, the dog or the sun. From there, children build up a set of symbols, improve them and repeat them until they're fixed.",
  "At around four or five, drawings start telling stories and showing feelings: a giant arm because it's the one holding the umbrella, a sister showing all her teeth. Then comes the symbolic landscape, which is almost the same for everyone: ground at the bottom, sky at the top, a house with a doorknob, the sun in a corner, trees, pointy mountains. Young children's sense of composition is amazing: everything sits exactly where it should within the edges of the paper."]},
 {h:"The crisis at ten", p:[
  "Between about nine and eleven, things change. Language takes over, children focus on single objects and lose their sense of the whole page. Above all, they want realism: things that look real and seem to go back into the distance. The symbols they know are no longer good enough.",
  "Without the right teaching, the drawings “don't come out right”. Kids get frustrated and embarrassed, often made worse by a sarcastic comment from an adult or a classmate. Many stop drawing for good. They grow up into adults who say they can't even draw a straight line and who, if asked to draw a person, still draw the same figure they drew at ten."]},
 {h:"The cube puzzle", p:[
  "A cube seen from one corner shows the problem perfectly. We know it's made of squares with right angles. But to make it look like a cube, you have to draw shapes that aren't square, with sharp and wide angles, exactly as the eye sees them. People who start from what they know (a right angle at the bottom, a flat base) pile up mistakes and get confused.",
  "It's not a problem with the hand: kids can draw lines perfectly well. It's their knowledge, useful in a thousand other situations, that stops them from seeing the thing as it really is. Picasso said that art is a lie that makes us see the truth. Here the “lie” is drawing slanted shapes in order to get a true-looking picture."]},
 {h:"Putting the symbols aside", p:[
  "Faced with a face, the verbal mind pulls out its collection of symbols: here's an eye, here's a nose, here's some hair. The same happens with hands, trees and grass. You don't need to fight these symbols. Just give yourself tasks that have no symbols, so the visual side can look in peace.",
  "Drawing your childhood landscape again brings those symbols back to light and reminds you how “perfect” they were in their own way. But drawing from life needs something different: looking for a long time, collecting lots of information and seeing how it all fits together, the way Dürer did when he drew his famous hare."]}
],
c6:[
 {h:"What an edge is", p:[
  "In everyday language, an edge is an outline or a border. In drawing it means something more precise: it's where two things touch, and the line you draw there (the contour line) belongs to both of them. In Vase/Faces, the profile was the edge of the face and of the vase at the same time. In a jigsaw puzzle, the edge of a boat is also the edge of the water.",
  "The border of your paper (the “format”) is a shared edge too: it's the outer limit of the sky, the ground and every shape that touches it. This idea seems obvious, but it's the basis of the next chapter, on negative spaces."]},
 {h:"Pure contour drawing and its paradox", p:[
  "The main exercise in this chapter comes from the teacher Kimon Nicolaïdes, who told students to imagine they were touching the edge of the object with their pencil, and to look at the object instead of the paper. The book's version goes further: you turn away from the paper and draw the creases in your palm for five minutes, extremely slowly, without ever looking at your drawing.",
  "The result looks nothing like a hand: it's a tangle of lines. And yet it's the most useful exercise in the course: students who skip it make less progress. Going so slowly and into such detail bores the verbal side (“it's a crease, I already said that”), so it leaves. The visual side then discovers that every crease is made of details, and every detail of smaller details. You start to see ordinary things with the wonder of a child again."]},
 {h:"The picture plane", p:[
  "The most important idea in this chapter is the picture plane: an imaginary window, always facing you straight on, that artists look through. Everything behind it, even things far away, looks flattened onto the glass, like in a photo. Drawing from life means copying that flat image onto your paper.",
  "Alberti described this idea in the Renaissance, Dürer built real devices for it, Van Gogh had a blacksmith make him a heavy frame that he dragged down to the beach, and Holbein drew on glass to work faster. With the clear plastic picture plane you do the same: you rest it on your hand (with the fingers pointing toward you), close one eye, keep your head still and trace the edges. The result is amazing: a very hard view, drawn easily."]},
 {h:"One eye closed, one view", p:[
  "Closing one eye removes depth from what you see (depth comes from using both eyes together). The image becomes flat, so you can copy it. Keeping your head still means you draw just one view: if you can't see a finger, you don't draw it. The closer the object, the more it helps to close one eye.",
  "The strange thing is that the flat image, once copied onto paper, looks 3D to the viewer. Whenever you ask “how do I make this finger come toward me?”, the answer is always the same: draw exactly what you see on the glass. The next exercise, the “modified contour” drawing on a gray background, puts it all together: you look at your hand almost all the time, check angles against the cross lines, draw the shapes around the nails instead of the nails themselves, and end up with the first real drawing of the course."]}
],
c7:[
 {h:"Negative spaces and positive shapes", p:[
  "Objects are the “positive shapes”. The spaces between and around them are the “negative spaces”. The name isn't great, but the idea is powerful: in a drawing, these spaces are just as real as the objects. The book's example is a cartoon character running through a door and leaving a hole shaped like itself: what's left of the door is the negative space, solid and with a clear shape.",
  "Since shapes and spaces share their edges, drawing a space also means drawing the shape next to it. And spaces have no names and no memorized symbols: there's nothing to “know” about them, so you see them as they really are. A wild sheep's horns coming toward you, or an animal's legs, become easy if you draw the spaces between them."]},
 {h:"What they're good for", p:[
  "Negative spaces do three things. They make hard parts easy, like things coming toward you or complicated shapes, because you get them “for free” by drawing what's around them. They hold the drawing together and make the composition stronger: when you give spaces and shapes the same attention, the whole page becomes interesting. And they train your eye: after this lesson you start seeing spaces everywhere, between branches, between buildings, in the hidden arrow of a well-known logo.",
  "The verbal side plays its part too: it doesn't want to bother with “nothing”, so when it sees an empty space it backs off. For the visual side, shapes and spaces are equally interesting."]},
 {h:"The border and composition", p:[
  "Composition is how shapes and spaces are arranged inside the border of your drawing (the “format”). Small children have a natural feel for it, then lose it when they start focusing on objects. Many beginners treat the paper as if it had no edges, and then “fill in the background” at the end.",
  "That's why every drawing starts with choosing your view in the viewfinder and drawing the border on your paper. The border shapes everything: the same object can look great in an upright rectangle and awkward in a wide one. And if you take care of the negative spaces, many composition problems solve themselves."]},
 {h:"The basic unit", p:[
  "One of the most common questions is where to start. If your first shape is too big, the part you were interested in won't fit on the page. If it's too small, you have to fill the page with things you don't care about. The basic unit solves this. You pick a medium-sized shape or space, call it “One”, and carefully decide its size and position compared with the border and the cross lines. Then you measure everything else against it: one to three-quarters, one to two, and so on.",
  "Experienced artists do this in an instant, almost without noticing. When Matisse watched a slow-motion film of himself, he was surprised to see his hand measuring in the air before drawing the model's head. A chair is the perfect subject to practice with: we know too much about chairs (equal legs, wide seat), and what we know goes against what we see. If you draw only the spaces, the chair comes out right by itself."]}
],
c8:[
 {h:"Perspective without fear", p:[
  "Perspective scares a lot of students; even Van Gogh struggled with it for years. The book tackles it in two steps. First, a few ideas from formal perspective (the rules with vanishing points). Then the method almost every artist actually uses: measuring by eye with a pencil, called “sighting”. It's like learning to drive: at first there seem to be too many rules, then they become automatic and driving becomes fun.",
  "The real difficulty is that perspective seems to contradict itself. A hallway has a flat ceiling and floor and is the same height all the way along, but to draw it you have to draw slanted lines that come together. The verbal side protests (“that's impossible!”), while the visual side accepts what it sees. One student measured the same angle three times, insisting it couldn't be right, then finally drew it and found that it worked."]},
 {h:"The basic ideas of perspective", p:[
  "You look from one fixed point: you don't move and you don't turn your head. The picture plane (the imaginary glass) stays straight in front of your eyes. The horizon line is always at your eye level: if you climb a cliff it goes up with you, if you sit down it goes down, even when you can't actually see it. Where you put it on the page is up to you.",
  "In one-point perspective, horizontal lines going into the distance all meet at a single “vanishing point” on the horizon. Lines above the horizon slant down toward it, lines below it slant up, and lines exactly at eye level stay flat. The vertical lines of buildings stay vertical, except in the rare case of three-point perspective, when you look up at a skyscraper or down from one."]},
 {h:"Two vanishing points, and sighting", p:[
  "In real life the most common view has two vanishing points, often with lots of objects facing different ways, each with its own points. These points almost always fall outside the page, sometimes very far away. Nobody wants to work with strings and enormous rulers.",
  "That's why artists use sighting. The perspective rules still help you know what to expect: “this edge is above my eyes, so it should slant down”. Then you measure the real angle by comparing it with a vertical or horizontal line, the two fixed references an artist holds on to like a life jacket. It's easier to remember the shape of the angle (like a slice of pie) than the number of degrees, and to compare with whichever line, vertical or horizontal, gives the smaller angle. Always keep your pencil flat on the imaginary glass: don't point it into the room."]},
 {h:"Measuring proportions", p:[
  "The second half of sighting is about proportions, and it uses a fixed routine. Close one eye, stretch your arm out and lock your elbow (so the measurements stay consistent), and hold the pencil flat on the imaginary glass. Measure your basic unit by marking it on the pencil with your thumb, compare it with something else, and you get a simple ratio, for example one to two and two-thirds.",
  "Then comes the rule the author's students called “erase the measurement from the pencil”. Your drawing is a different size from the real thing, so you don't copy the length onto the paper; you copy the ratio. You measure the unit again in your drawing and apply the same ratio. The hard part isn't the technique; it's trusting your own measurements instead of checking them again and again. Once you can do this, you can draw anything you see, including things coming toward you."]}
],
c9:[
 {h:"Your brain edits what you see", p:[
  "One of the most surprising things you discover when learning to draw is called “perceptual constancy”. Your brain knows that heads are all roughly the same size and that tables are rectangles, and it adjusts the image coming from your eyes to fit what it knows. And it doesn't tell you it has done this.",
  "The book's examples are unsettling. Four identical figures in a landscape look like different sizes. Two identical tabletops look different: one long and narrow, the other almost square. Your head in the mirror seems life-size, but it's actually half the size. Even after you measure, the illusion doesn't go away. The only fix is to stop and measure, and then trust the measurement more than your feeling."]},
 {h:"The chopped-off skull", p:[
  "The most common mistake in beginners' portraits is where they put the eyes. Almost everyone thinks the eyes are a third of the way down the head. In fact, in adults, the eyes are halfway between the top of the head (or hair) and the bottom of the chin. Because the eyes, nose and mouth are the interesting part, the brain makes them look bigger and shrinks the forehead and skull, so in the drawing the top of the head gets cut off.",
  "In one of the author's classes, students measured this and still honestly said they couldn't see it: “we'll see it when we believe it”. Measuring your own head, in the mirror, on photos or even on the TV screen helps convince the logical side. The face really takes up only a small part of the head, and drawing the whole skull makes a huge difference to the likeness."]},
 {h:"Ears, neck and other measurements", p:[
  "In a profile, the second typical mistake is putting the ear too close to the face, which also cuts off the back of the head. The rule to remember: the distance from eye level to the chin is the same as the distance from the back of the eye to the back of the ear. Join the three points and you get a triangle with two equal sides that you can picture right on the model.",
  "The bottom of the ear is roughly level with the space between nose and mouth, but this varies from person to person, so check it. The neck joins the head higher than you'd think, roughly at the level of the nose or mouth, and it's wide. Not a thin stick under an oval, like in children's drawings."]},
 {h:"From Sargent to a real person", p:[
  "Copying drawings by great artists is an old way of learning that's coming back. It makes you slow down and see what the artist saw, and the pictures you copy stay in your memory for a long time. Sargent's profile of Madame X lets you practice every step: the basic unit, the empty spaces in front of the face and neck, angles compared with the cross lines, and where the ear goes.",
  "Then you draw a real person. A few tricks help you get past the symbols: draw the white of the eye as a shape instead of drawing the iris; look at the spaces around glasses, which in profile look different from the shape you know; draw the collar by drawing the spaces around it; draw hair as masses, directions and dark areas, not single hairs. Most of all, avoid putting the model into words: if you think “he has a long face”, you'll end up drawing it longer than it really is."]}
],
c10:[
 {h:"How light works", p:[
  "What students usually call “shading”, the book calls the logic of light: light falls on things and creates light and shadow in predictable ways. There are four parts. The highlight: where the light hits most directly. The cast shadow: the darkest part, where the object blocks the light. Reflected light: weaker light bouncing back from nearby surfaces. The crest shadow: a dark band along the curve of the form, between the highlight and the reflected light.",
  "The last two are the hardest to see, but they're what makes things look round. Everything is measured in “values”, from the white of the paper to the darkest black of the graphite: light areas are “high” values, dark areas are “low” values. The ideal path goes from line, to shapes, to relationships, to values, and from there on to color and painting."]},
 {h:"Why it works: shapes with no names", p:[
  "Shadow shapes have no names, and they change with every tiny movement of the model. The verbal side has no use for them, so it leaves you alone. We use this information all the time to understand the shape of things, but without noticing. Turn a self-portrait in light and shadow upside down and you see only a patchwork of blobs. Turn it the right way up and the blobs disappear, leaving a solid-looking head.",
  "Here's another surprise: if you draw the shapes of light and shadow exactly as they look, viewers don't notice them; they just see a “real” face. The visual side of the brain is very good at filling in missing information, and that's where the magic comes from. Give the viewer a few right clues and they'll see things you didn't draw, like the eye in shadow in Hopper's self-portrait or in Steichen's photograph. The hard part is knowing when to stop."]},
 {h:"Face proportions", p:[
  "Portraits come in three poses: front view, profile and three-quarter view. In the front view there are some general rules, to be adjusted for each face. The middle line of the face and the eye line always stay at right angles, even if the head is tilted. The gap between the eyes is one eye wide. You find the bottom of the nose with an upside-down triangle drawn from the outer corners of the eyes. The mouth is about a third of the way from nose to chin. The nostrils are below the inner corners of the eyes, the corners of the mouth below the pupils. The ears run from eye level to between nose and mouth. The neck is almost as wide as the jaw. Noses, mouths, ears and necks are nearly always bigger than you expect.",
  "The three-quarter view is the most expressive and the trickiest. The two halves of the face are different widths, the eye and mouth on the far side look shorter and change shape, and you can see the side and bottom of the nose. All of this goes against the symmetrical symbols you learned as a child. The classic mistake is moving the near eye closer to the nose: the gap is about one eye wide. For the ear, the rule becomes: from the front corner of the eye to the back of the ear = eye level to chin."]},
 {h:"Hatching, the self-portrait and the gestalt", p:[
  "There are two ways to make tones. Hatching: groups of parallel lines drawn by moving your hand from the wrist, crossed with other groups at a slightly different or sharper angle, and layered to make it darker. Every artist develops their own, almost like a signature. And smooth tone, made with small overlapping movements. You can only learn both through practice.",
  "The final self-portrait brings everything together. The mirror is your picture plane, and a lamp to one side creates clear light and shadow. You start with the big areas, erasing the light parts out of the gray paper and darkening the shadows, and you let the eyes, nose and mouth appear instead of drawing them first. Every now and then you get up to look at it from a distance, then go back to work. At the end, next to your first self-portrait, the difference is obvious: real observation instead of symbols. The likeness, the gestalt, appears by itself, because you've seen all the parts well."]}
],
c11:[
 {h:"Keep drawing", p:[
  "New connections in the brain only become solid if you repeat them. The advice is simple: always carry a small sketchbook, and in spare moments draw whatever is nearby. Copying newspaper photos upside down is the quickest way to switch into drawing mode; drawing from life and copying great artists are the best practice.",
  "Even when you can't draw, you can train your eye: look for negative spaces, find your eye level, judge an angle against a vertical line, check the proportions of faces on TV."]},
 {h:"Computers and the visual mind", p:[
  "Computers are very good at imitating the verbal, step-by-step way of thinking: they count, sort and follow instructions better than we do. Progress on visual skills has been much slower. Recognizing a face in three-quarter view, or telling a friendly smile from a mocking one, is still hard for machines but very easy for a child.",
  "That's why the author finds it strange that schools put more and more weight on exactly the skills where machines beat us, and neglect the skills of seeing. She supports an idea: teach children how their brain works, which way of thinking each problem needs, and how to switch into it."]},
 {h:"The five stages of creativity", p:[
  "The creative process is described in five stages, each led by one way of thinking. First insight (R-mode): you notice something that doesn't add up, and a question comes up: “I wonder why…”. Saturation (L-mode): you collect everything known about the problem, until the information won't fit together and you get frustrated. Incubation (R-mode): you stop thinking about it and your mind keeps working on its own, looking for the pattern where everything fits.",
  "Then comes illumination: the sudden “aha!”, which often arrives while you're doing something else, with a feeling of joy and of everything falling into place. Finally, verification (L-mode guided by R-mode): the hard work of turning the idea into something real, which many people never finish. You can even “program” the incubation stage: tell yourself you need an answer by a certain date, then let it go."]},
 {h:"Seeing a problem like a drawing", p:[
  "The example of a designer deciding whether to take on a client shows how to use the five skills as a way of thinking. Edges: where do my interests meet the client's, and is that boundary soft or hard? Negative spaces: what don't I know, and who else has a say? Relationships: what is each side's point of view, and what's the basic unit to measure everything against: time, money, quality? Light and shadow: what's clear and what's still in the dark? The gestalt: look at the whole thing, maybe turning it upside down in your mind.",
  "The chapter ends with real examples, like two inventors who redesigned a surgical tool that had been used almost unchanged for a century, and with cave paintings, proof that people tens of thousands of years ago already had an extraordinary ability to imagine and picture things. The final question is whether we can recover that visual power to see the dangers and opportunities of the future before they arrive."]}
],
c12:[
 {h:"Drawing shows who you are", p:[
  "Every drawing, whatever it shows, also shows something about the person who made it: how they see things and how they feel. You draw in visual mode, in silence, and afterwards you can go back to words to make sense of what came out. If words aren't enough, you go back to intuition. The exercises in the book are only the first steps on this path.",
  "You never finish learning to draw: there's always the feeling that in your next drawing you'll see a little deeper."]},
 {h:"Tips for carrying on", p:[
  "Draw everything: no subject is too hard or too ordinary, even a tuft of grass or an artichoke. Study great artists by copying their drawings, not to copy their style but to understand how they looked at things. Protect your own style and give it time to grow. If a drawing goes wrong, stop, calm down and remember that everything you need is right there in front of your eyes.",
  "Don't wait for inspiration: set things up every day so you can switch into the right state of mind, otherwise the new paths in your brain close up again. Teach someone else, because explaining the lessons helps you remember them too. And use the same skills for life's problems: look at them from different points of view, see their parts in the right proportions, and let them ripen while you do something else."]}
]
}

/* ---------- obiettivo e lettura del risultato di ogni esercizio (stessi id) ---------- */
// goal = cosa alleni e cosa devi ottenere · read = come interpretare quello che hai disegnato
const GOALS = {
en:{
 strumenti:{goal:"Make the two tools you'll use for the whole course: a clear sheet with a cross on it (the picture plane) and two cardboard frames (the viewfinders).",
  read:"It worked if a viewfinder clipped onto the plastic sheet shows a clean window, and the cross lines run exactly through the middle. Small inaccuracies don't matter; what matters is that all the rectangles have the same shape."},
 pre1:{goal:"Record how you draw a person today, before learning anything. It's not a test: it's a photo of your starting point.",
  read:"Don't judge it as good or bad. Look for shapes your hand drew automatically (a standard eye, a stick neck, a smile like a curve): those are childhood symbols, and the course will replace them with real observation."},
 pre2:{goal:"Record how you draw a real face you can see, so you can compare it with your final self-portrait in chapter 10.",
  read:"Compare it with drawing 1: if the eyes, nose and mouth look the same as in the drawing from memory, you drew what you know, not what you saw. That's completely normal at this stage. Note too where the eyes are: most beginners put them too high."},
 pre3:{goal:"Record how you draw something real right in front of you, and spot the symbols that repeat across all three drawings.",
  read:"Look for places where you really looked (a knuckle, a wrinkle, an unusual angle): they prove you can already see. Fingernails or fingers all drawn the same way are symbols. Write both on the back."},
 firma:{goal:"Realize that you already draw with a personal line every day, and that style is something you have, not something to learn.",
  read:"If your three versions of your name feel different (calm, nervous, elegant, rushed), you've understood the point: a line carries character. There's no right or wrong version."},
 vasi:{goal:"Feel in your own body the clash between naming things (verbal mind) and looking at shapes (visual mind).",
  read:"The exercise works when you get confused or stuck halfway through the second profile: that moment of confusion is the result. How you got unstuck (looking at the space, a grid, starting from the bottom) shows you how to switch into visual mode."},
 stravinsky:{goal:"Experience the switch into visual mode (R-mode) for the first time, and discover that you can copy a complex drawing accurately.",
  read:"Turn it the right way up and compare: most people are surprised by how accurate it is. The best parts are usually the ones you couldn't recognize while drawing (like the legs). Parts that look worse (often the hands and face) are where your verbal mind recognized something and took over."},
 capovolti:{goal:"Repeat the switch into visual mode until you recognize how it feels and can find it again more easily.",
  read:"Don't only check accuracy: ask yourself how you felt. If you lost track of time, didn't hear sounds around you and felt calm and focused, you were in R-mode. If you kept getting distracted or bored, try again with a quieter setting."},
 paesaggio:{goal:"Bring back the symbols you used as a child, and the natural sense of composition you had then.",
  read:"Notice how quickly and confidently each symbol came out: that's what automatic symbols feel like. When you cover one element and the picture feels unbalanced, you're seeing your instinct for composition at work."},
 contpuro:{goal:"Switch off your verbal mind by looking so slowly and closely that it gets bored, and discover how much detail there is in ordinary things.",
  read:"The drawing will look like a tangle of lines, not like a hand, and that's the right result. Judge it by what you experienced: if after a minute or two you got absorbed in the lines and forgot the time, it worked. A drawing that looks “nice” probably means you peeked."},
 pianomano:{goal:"Understand with your own hands that drawing from life means copying a flat image, exactly as it appears on a pane of glass.",
  read:"The traced hand should look three-dimensional even though you only copied flat lines: that's the key discovery. If parts look odd, you probably moved your head or opened both eyes while tracing."},
 pianostanza:{goal:"Learn to imagine the picture plane in front of you, so you can later “see” the flat image without the plastic sheet.",
  read:"It worked if you noticed that edges you know are horizontal (ceiling, table) actually look slanted on the sheet. If, after putting the sheet down, you can still picture those angles, you've started to internalize the plane."},
 contmod:{goal:"Make your first complete drawing from life, combining slow observation, the picture plane and a gray background.",
  read:"Check that the hand looks solid and that tricky parts (fingers pointing at you, nails) look believable. If something looks flat or wrong, compare it with the tracing on the plastic: usually you drew what you know about hands instead of what you saw."},
 sedia:{goal:"Learn to draw the empty spaces instead of the object, and see that the object comes out right by itself.",
  read:"Look at the chair: if the legs, slats and rungs look believable even though you drew only the spaces, you've got it. Where the chair looks wrong, you probably went back to drawing the chair itself instead of the spaces around it."},
 copiespazi:{goal:"Use negative spaces to handle foreshortening (arms and legs coming toward you), which is usually the hardest thing to draw.",
  read:"Compare your copy with the original: arms and legs should look shortened in the right way. If they look too long, you drew the limb as you know it, not the spaces around it."},
 spaziovunque:{goal:"Make seeing negative spaces automatic, so your eye does it even when you're not drawing.",
  read:"There's no drawing to judge. It's working when you start noticing spaces without trying: between branches, under a table, between two people."},
 corridoio:{goal:"Understand with your own eyes how lines going into the distance slant toward a single vanishing point.",
  read:"In your drawing, all the edges going into the distance should meet at one point at your eye level. If a line doesn't, measure it again: lines above your eyes slant down, lines below slant up."},
 angolo:{goal:"Learn to measure angles by comparing them with a vertical or horizontal line, instead of guessing.",
  read:"Lay the plastic sheet over your drawing, or check again with the pencil: if the angles match, your eye is learning. If the angles you drew are too flat or too steep, your brain “straightened” them toward what it expects."},
 gesto:{goal:"Learn the basic gesture for measuring proportions: compare sizes as ratios, not as actual lengths.",
  read:"It's working if your measurement stays the same when you repeat it (elbow locked, one eye closed), and if you can describe things as ratios (“the door is 1 to 2½”). If the numbers change every time, your arm is bending."},
 duepunti:{goal:"Use edges, spaces and relationships together to draw a whole real scene with depth.",
  read:"The scene should feel deep and stable. If something looks “wrong”, check its angle against the vertical or horizontal and its size against the basic unit: the mistake is almost always an angle you guessed instead of measuring."},
 costanza:{goal:"Catch your brain secretly changing sizes, so you'll trust measurements over what you think you see.",
  read:"The surprise is the result: identical figures that look different, a reflection half the size of your head. If you're still not convinced after measuring, that's normal: the illusion doesn't go away, you just learn to trust the measurement."},
 misuretesta:{goal:"Learn the basic proportions of the head and check them on real people, so you stop putting the eyes too high.",
  read:"On real heads, eye level is halfway between the top of the head and the chin. If your measurements say so but it still “looks wrong”, that's your brain at work: trust the measurement."},
 sargent:{goal:"Rehearse all the steps of a profile portrait on a still image, before working with a real person.",
  read:"Turn the original and your copy upside down: the differences jump out. The most common ones are the ear too close to the face and the back of the head cut off. Fix them by checking against the basic unit."},
 profilo:{goal:"Draw a real person in profile, using edges, spaces and relationships together as one skill.",
  read:"Aim for a likeness, not perfection. If it doesn't look like the person, check the eye level (halfway down the head), the position of the ear and the angle from nose to chin: these are where it usually goes wrong."},
 courbet:{goal:"Understand that light and shadow are just shapes, and that the brain turns them into volume by itself.",
  read:"It worked if upside down you saw only blotches and right side up a solid head. That's the lesson: draw the blotches as they are, and the viewer's brain will do the rest."},
 frontale:{goal:"Learn the general proportions of a face seen from the front, to use as a starting guide.",
  read:"Compare your guide with real faces: the rules (one eye between the eyes, eye line halfway down) will be roughly right, but every face differs a little. The differences are what make a person look like themselves."},
 tretquarti:{goal:"Understand how a face changes when it turns: the far side gets narrower and the features change shape.",
  read:"Check the most common mistake: the near eye too close to the nose (it should be about one eye's width away). If the face looks flat or symmetrical, you drew it as if seen from the front."},
 steichen:{goal:"Learn to draw with light and shadow instead of lines, and discover how little you need for the viewer to see a face.",
  read:"It worked if a face “appears” from the gray when you squint, even without drawn eyes. If it looks muddy, you probably kept adding: stopping earlier is part of the skill."},
 tratteggio:{goal:"Develop your own way of making tones with lines, which you'll use to shade any drawing.",
  read:"There's no correct hatching. Look for even sets of lines and smooth steps from light to dark. With practice your lines will become faster and more regular, and recognizably yours."},
 autoritratto:{goal:"Bring all four skills together in a finished self-portrait, and let the likeness (the fifth skill) emerge by itself.",
  read:"Put it next to your “before” self-portrait: look for fewer symbols, eyes in the right place, a whole skull, and believable light and shadow. Don't expect perfection: what matters is that you drew what you saw."},
 confronto:{goal:"See your progress clearly, before you forget how you used to draw.",
  read:"Look for concrete differences: real shapes instead of symbols, better proportions, more confident lines. Write them down: they're your proof that drawing can be learned."},
 taccuino:{goal:"Keep the new ways of seeing alive through short, regular practice.",
  read:"Don't judge single sketches. What counts is regularity: if you're drawing most days and switching into drawing mode more easily, it's working."},
 problema:{goal:"Use the five drawing skills as a way of thinking about a real problem.",
  read:"It worked if you discovered something new: a missing piece of information, another person's point of view, a better question. You don't need to solve the problem right away."},
 insegna:{goal:"Fix what you've learned by explaining it, and share it with someone who thinks they can't draw.",
  read:"It worked if they're surprised by their upside-down drawing, and if you found you could explain why it works. Where your explanation got stuck shows you what's worth reviewing."}
},
it:{
 strumenti:{goal:"Costruire i due strumenti che userai per tutto il corso: il foglio trasparente con la croce (piano trasparente) e le due cornici di cartoncino (mirini).",
  read:"È riuscito se il mirino fissato al piano mostra una finestra pulita e le linee della croce passano esattamente al centro. Piccole imprecisioni non contano: conta che tutti i rettangoli abbiano la stessa forma."},
 pre1:{goal:"Registrare come disegni una persona oggi, prima di imparare qualsiasi cosa. Non è una prova: è una foto del tuo punto di partenza.",
  read:"Non giudicarlo bello o brutto. Cerca le forme che la mano ha tracciato in automatico (un occhio standard, un collo a bastoncino, il sorriso a curva): sono i simboli dell'infanzia, e il corso li sostituirà con l'osservazione."},
 pre2:{goal:"Registrare come disegni un volto vero che hai davanti, per confrontarlo con l'autoritratto finale del capitolo 10.",
  read:"Confrontalo con il disegno 1: se occhi, naso e bocca sono uguali a quelli disegnati a memoria, hai disegnato quello che sai, non quello che vedi. In questa fase è normalissimo. Guarda anche dove sono gli occhi: quasi tutti all'inizio li mettono troppo in alto."},
 pre3:{goal:"Registrare come disegni una cosa vera che hai proprio davanti, e trovare i simboli che si ripetono nei tre disegni.",
  read:"Cerca i punti in cui hai guardato davvero (una nocca, una piega, un angolo insolito): dimostrano che sai già vedere. Unghie o dita tutte uguali sono simboli. Annota entrambe le cose sul retro."},
 firma:{goal:"Accorgerti che disegni già ogni giorno con una linea personale, e che lo stile è qualcosa che hai, non che devi imparare.",
  read:"Se le tre versioni del tuo nome comunicano cose diverse (calma, nervosismo, eleganza, fretta), hai colto il punto: la linea trasmette carattere. Non esiste una versione giusta o sbagliata."},
 vasi:{goal:"Sentire su di te lo scontro tra dare un nome alle cose (mente verbale) e guardare le forme (mente visiva).",
  read:"L'esercizio funziona quando a metà del secondo profilo ti confondi o ti blocchi: quel momento di confusione è il risultato. Il modo in cui ne sei uscito (guardare lo spazio, una griglia, partire dal basso) ti mostra come passare alla modalità visiva."},
 stravinsky:{goal:"Provare per la prima volta il passaggio alla modalità visiva (R) e scoprire che sai copiare con precisione un disegno complesso.",
  read:"Raddrizzalo e confronta: quasi tutti si sorprendono di quanto sia preciso. Le parti migliori di solito sono quelle che non riconoscevi mentre disegnavi (come le gambe). Le parti peggiori (spesso mani e volto) sono quelle in cui la mente verbale ha riconosciuto qualcosa e ha preso il comando."},
 capovolti:{goal:"Ripetere il passaggio alla modalità visiva finché non riconosci com'è e lo ritrovi più facilmente.",
  read:"Non guardare solo la precisione: chiediti come ti sei sentito. Se hai perso la cognizione del tempo, non sentivi i rumori intorno ed eri calmo e concentrato, eri in modalità R. Se ti distraevi o ti annoiavi, riprova in un posto più tranquillo."},
 paesaggio:{goal:"Riportare a galla i simboli che usavi da bambino e il senso naturale della composizione che avevi allora.",
  read:"Nota con quanta rapidità e sicurezza è uscito ogni simbolo: è così che funzionano i simboli automatici. Quando copri un elemento e il disegno ti sembra sbilanciato, stai vedendo all'opera il tuo istinto per la composizione."},
 contpuro:{goal:"Spegnere la mente verbale guardando così lentamente e da vicino da annoiarla, e scoprire quanti dettagli ci sono nelle cose comuni.",
  read:"Il disegno sembrerà un groviglio di linee, non una mano, ed è il risultato giusto. Giudicalo da quello che hai provato: se dopo un minuto o due ti sei perso nelle linee e hai dimenticato il tempo, ha funzionato. Un disegno «carino» probabilmente vuol dire che hai sbirciato."},
 pianomano:{goal:"Capire con le tue mani che disegnare dal vero significa copiare un'immagine piatta, esattamente come appare su un vetro.",
  read:"La mano ricalcata dovrebbe sembrare tridimensionale anche se hai copiato solo linee piatte: è questa la scoperta. Se alcune parti sembrano strane, probabilmente hai mosso la testa o aperto entrambi gli occhi."},
 pianostanza:{goal:"Imparare a immaginare il piano davanti a te, per poter poi «vedere» l'immagine piatta anche senza il foglio di plastica.",
  read:"È riuscito se hai notato che bordi che sai orizzontali (soffitto, tavolo) sul piano appaiono inclinati. Se, posato il piano, riesci ancora a immaginare quegli angoli, hai cominciato a interiorizzarlo."},
 contmod:{goal:"Fare il tuo primo disegno completo dal vero, unendo osservazione lenta, piano trasparente e fondo grigio.",
  read:"Controlla che la mano sembri solida e che le parti difficili (dita verso di te, unghie) siano credibili. Se qualcosa sembra piatto o sbagliato, confrontalo con il ricalco sul piano: di solito hai disegnato quello che sai delle mani invece di quello che vedevi."},
 sedia:{goal:"Imparare a disegnare gli spazi vuoti invece dell'oggetto, e vedere che l'oggetto viene giusto da solo.",
  read:"Guarda la sedia: se gambe, stecche e traverse sono credibili anche se hai disegnato solo gli spazi, ci sei. Dove la sedia sembra sbagliata, probabilmente sei tornato a disegnare la sedia invece degli spazi intorno."},
 copiespazi:{goal:"Usare gli spazi negativi per gli scorci (braccia e gambe che vengono verso di te), di solito la cosa più difficile da disegnare.",
  read:"Confronta la copia con l'originale: braccia e gambe devono apparire accorciate nel modo giusto. Se sembrano troppo lunghe, hai disegnato l'arto come lo conosci, non gli spazi intorno."},
 spaziovunque:{goal:"Rendere automatico il vedere gli spazi negativi, così l'occhio lo fa anche quando non disegni.",
  read:"Non c'è un disegno da giudicare. Funziona quando cominci a notare gli spazi senza sforzo: tra i rami, sotto un tavolo, tra due persone."},
 corridoio:{goal:"Capire con i tuoi occhi come le linee che vanno in profondità si inclinano verso un unico punto di fuga.",
  read:"Nel disegno tutti i bordi che vanno in profondità devono incontrarsi in un punto all'altezza dei tuoi occhi. Se una linea non ci arriva, misurala di nuovo: sopra gli occhi le linee scendono, sotto salgono."},
 angolo:{goal:"Imparare a misurare gli angoli confrontandoli con una verticale o un'orizzontale, invece di tirare a indovinare.",
  read:"Sovrapponi il piano al disegno o ricontrolla con la matita: se gli angoli coincidono, l'occhio sta imparando. Se li hai disegnati troppo piatti o troppo ripidi, il cervello li ha «raddrizzati» verso quello che si aspetta."},
 gesto:{goal:"Imparare il gesto base per misurare le proporzioni: confrontare le misure come rapporti, non come lunghezze reali.",
  read:"Funziona se ripetendo la misura ottieni lo stesso risultato (gomito bloccato, un occhio chiuso) e se riesci a descrivere le cose come rapporti («la porta è 1 a 2½»). Se i numeri cambiano ogni volta, il braccio si sta piegando."},
 duepunti:{goal:"Usare insieme bordi, spazi e rapporti per disegnare un'intera scena reale con profondità.",
  read:"La scena deve sembrare profonda e stabile. Se qualcosa «non torna», controlla il suo angolo rispetto a verticale e orizzontale e la sua misura rispetto all'unità base: quasi sempre l'errore è un angolo indovinato invece che misurato."},
 costanza:{goal:"Cogliere il cervello mentre cambia di nascosto le dimensioni, per fidarti delle misure più di quello che credi di vedere.",
  read:"La sorpresa è il risultato: figure identiche che sembrano diverse, un riflesso grande la metà della tua testa. Se anche dopo aver misurato non sei convinto, è normale: l'illusione non sparisce, impari solo a fidarti della misura."},
 misuretesta:{goal:"Imparare le proporzioni base della testa e verificarle su persone vere, per smettere di mettere gli occhi troppo in alto.",
  read:"Sulle teste vere gli occhi sono a metà tra la cima della testa e il mento. Se le misure lo confermano ma ti «sembra sbagliato», è il cervello all'opera: fidati della misura."},
 sargent:{goal:"Provare tutti i passaggi del ritratto di profilo su un'immagine ferma, prima di lavorare con una persona vera.",
  read:"Capovolgi originale e copia: le differenze saltano all'occhio. Le più comuni sono l'orecchio troppo vicino al viso e la nuca tagliata. Correggile confrontando con l'unità base."},
 profilo:{goal:"Disegnare una persona vera di profilo, usando bordi, spazi e rapporti insieme come un'unica abilità.",
  read:"Punta alla somiglianza, non alla perfezione. Se non somiglia, controlla la linea degli occhi (a metà testa), la posizione dell'orecchio e l'angolo naso-mento: è lì che di solito si sbaglia."},
 courbet:{goal:"Capire che luci e ombre sono solo forme, e che il cervello le trasforma da solo in volume.",
  read:"È riuscito se capovolto vedevi solo macchie e raddrizzato una testa in rilievo. È questa la lezione: disegna le macchie come sono e il cervello di chi guarda farà il resto."},
 frontale:{goal:"Imparare le proporzioni generali del volto visto di fronte, da usare come guida di partenza.",
  read:"Confronta la guida con volti veri: le regole (un occhio tra gli occhi, linea degli occhi a metà) saranno più o meno giuste, ma ogni volto è un po' diverso. Le differenze sono proprio ciò che rende una persona riconoscibile."},
 tretquarti:{goal:"Capire come cambia un volto quando si gira: il lato lontano si stringe e i lineamenti cambiano forma.",
  read:"Controlla l'errore più comune: l'occhio vicino troppo attaccato al naso (deve stare a circa un occhio di distanza). Se il volto sembra piatto o simmetrico, l'hai disegnato come se fosse di fronte."},
 steichen:{goal:"Imparare a disegnare con luci e ombre invece che con le linee, e scoprire quanto poco serve perché chi guarda veda un volto.",
  read:"È riuscito se, socchiudendo gli occhi, un volto «appare» dal grigio anche senza occhi disegnati. Se sembra sporco, probabilmente hai continuato ad aggiungere: fermarsi prima fa parte dell'abilità."},
 tratteggio:{goal:"Sviluppare il tuo modo di creare i toni con le linee, da usare per ombreggiare qualsiasi disegno.",
  read:"Non esiste un tratteggio giusto. Cerca gruppi di linee regolari e passaggi graduali dal chiaro allo scuro. Con la pratica le linee diventano più veloci, regolari e riconoscibili come tue."},
 autoritratto:{goal:"Unire le quattro abilità in un autoritratto finito e lasciare che la somiglianza (la quinta abilità) emerga da sola.",

/* ---------- texture a pastello: generate una volta sola con un canvas ---------- */
// --tex: riempimento a tratteggio obliquo · --tex2: tratto granuloso dei bordi · --paper: grana della carta
function makeTextures(){
  try{
    const T = 180;
    const mk = (fn) => { const c = document.createElement("canvas"); c.width = c.height = T; const g = c.getContext("2d"); fn(g); return "url(" + c.toDataURL() + ")"; };
    const strokes = (g, n, a0, a1, w0, w1, ang) => {
      for(let i = 0; i < n; i++){
        const x = Math.random() * T, y = Math.random() * T, l = 5 + Math.random() * 16, a = ang + (Math.random() - .5) * .35;
        const dx = Math.cos(a) * l, dy = Math.sin(a) * l;
        g.globalAlpha = a0 + Math.random() * (a1 - a0); g.lineWidth = w0 + Math.random() * (w1 - w0);
        for(const ox of [-T, 0, T]) for(const oy of [-T, 0, T]){ g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + dx + ox, y + dy + oy); g.stroke(); }
      }
      g.globalAlpha = 1;
    };
    const tex = mk(g => {
      g.globalAlpha = .82; g.fillRect(0, 0, T, T); g.globalAlpha = 1; g.lineCap = "round";
      strokes(g, 900, .2, .6, .8, 1.8, -0.95);
      g.globalCompositeOperation = "destination-out"; strokes(g, 380, .25, .55, .6, 1.3, -0.95);
    });
    const tex2 = mk(g => {
      g.globalAlpha = .9; g.fillRect(0, 0, T, T); g.globalCompositeOperation = "destination-out";
      for(let i = 0; i < 2200; i++){ g.globalAlpha = .25 + Math.random() * .6; g.fillRect(Math.random() * T, Math.random() * T, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6); }
    });
    const paper = mk(g => {
      for(let i = 0; i < 1400; i++){ g.fillStyle = Math.random() < .5 ? "#7A5A30" : "#FFFFFF"; g.globalAlpha = .03 + Math.random() * .06; g.fillRect(Math.random() * T, Math.random() * T, 1 + Math.random() * 2, 1 + Math.random() * 2); }
      g.strokeStyle = "#8A6A3A"; g.lineCap = "round";
      for(let i = 0; i < 40; i++){ const x = Math.random() * T, y = Math.random() * T, a = Math.random() * 6.28, l = 4 + Math.random() * 10; g.globalAlpha = .05; g.lineWidth = .6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l, y, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    });
    const r = document.documentElement.style;
    r.setProperty("--tex", tex); r.setProperty("--tex2", tex2); r.setProperty("--paper", paper);
  }catch(e){}
}

function mascot(mood, size){
  const id = "m" + (++mid);

/* ---------- navigazione: il gesto "indietro" del telefono segue le schermate ---------- */
// profondità: home 0 · tab e capitolo 1 · esercizio 2
const DEPTH = {home:0, chapter:1, list:1, memo:1, settings:1, ex:2};
let curDepth = 0, fromPop = false, skipPop = null;
function screen(st){
  if(fromPop) return;
  const d = DEPTH[st.s];
  try{
    if(d > curDepth) history.pushState(st, "");
    else if(d === curDepth) history.replaceState(st, "");
    else { skipPop = st; history.go(d - curDepth); }
  }catch(e){}
  curDepth = d;
}
function showState(st){
  st = st || {s:"home"};
  if(st.s === "chapter" && chById(st.id)) chapter(st.id);
  else if(st.s === "ex" && exById(st.id)) exercise(st.id, st.from);
  else if(st.s === "list") list();
  else if(st.s === "memo") memo();
  else if(st.s === "settings") settings();
  else home();
}
window.addEventListener("popstate", (e) => {
  if(skipPop){ const st = skipPop; skipPop = null; try{ history.replaceState(st, ""); }catch(err){} return; }
  const st = e.state || {s:"home"};
  fromPop = true;
  try{ showState(st); } finally { fromPop = false; }
  curDepth = DEPTH[st.s] || 0;
});

function mount(v){
  app.innerHTML = ""; app.appendChild(v);
  // barre fisse fuori dal contenitore animato, così non si spostano durante l'animazione
  v.querySelectorAll(".pop .tabbar").forEach(el => app.appendChild(el));
  window.scrollTo(0, 0);
}

// iPhone, app installata: nessun gesto di sistema → swipe dal bordo sinistro per tornare indietro
(function(){
  let x0 = null, y0 = 0;
  addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX < 24 && curDepth > 0 ? t.clientX : null; y0 = t.clientY; }, {passive:true});
  addEventListener("touchend", e => {
    if(x0 === null) return; const t = e.changedTouches[0];
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 60) history.back();
    x0 = null;
  }, {passive:true});
})();

    a.download = "matitina-backup-" + today() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  v.querySelector("#imp").onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t => { const d = JSON.parse(t); if(!d || typeof d !== "object" || !d.done) throw 0; S = Object.assign(fresh(), d); save(); applyPalette(); applyLang(); settings(tr("restored")); })
      .catch(() => settings(tr("bad")));
  };
  v.appendChild(tabBar("settings"));
  mount(v);
}
