const EN = {
ch:{
intro:{idea:"Drawing is a skill you can learn, just like reading. You don't need talent: you need a few basic skills, learned one at a time and in the right order.",
 points:[
  "This book is really about learning to see. The same way of seeing also helps you think and solve problems.",
  "Drawing is made of five basic skills: seeing edges, seeing spaces, seeing relationships (angles and proportions), seeing light and shadow, and seeing the whole thing at once (the “gestalt”). The first four can be taught; the fifth comes on its own.",
  "The trick used in the whole course: your brain has a verbal, logical side and a visual side. To let the visual side work, give the verbal side a job it doesn't want to do: upside-down pictures, very slow details, empty spaces, puzzling shapes, shadows.",
  "Your brain keeps changing as you learn. Learning to draw builds new connections, and once you have the skill you keep it for life, like reading.",
  "Watch out for the “great saboteur”: the verbal side of your brain will find a thousand excuses to stop you drawing. The fix is the same trick: start with a task it finds boring and lets go of.",
  "Pages 27–31 show the 5-day workshop: a first self-portrait, upside-down drawing, a hand, negative spaces, perspective, a profile, and a final self-portrait."]},
c1:{idea:"To draw well, you have to see the way artists see. Like riding a bike, it's hard to explain in words: you learn it by doing it.",
 points:[
  "Drawing and seeing go hand in hand. Artists look at things differently from the way we look at them in everyday life.",
  "Advice like “look more carefully” or “check the proportions” doesn't help much. What helps is being shown how, with a clear method.",
  "If your eyesight and hand control are normal (you can sign your name or type a message), you can learn to draw.",
  "While drawing you slip into a different state of mind: focused, absorbed, losing track of time, a bit like driving on a long empty highway. It breaks easily: one question or a ringing phone is enough.",
  "The book picks subjects people think are “hard” on purpose (a hand, a chair, a room, a profile, a self-portrait). The task of drawing is always the same; only the subject changes.",
  "Portraits are very motivating. They also use something the brain's right side is especially good at: recognizing faces."]},
c2:{idea:"Get your materials, make your tools, and draw three “before” pictures to record where you're starting from.",
 points:[
  "What you need (pp. 44–46): paper, pencils, a graphite stick, erasers, a clear plastic “picture plane”, two cardboard “viewfinders” and a mirror. You only need the picture plane and viewfinders until you can imagine them in your head.",
  "The picture plane, the viewfinders and the rectangle you draw on the paper all have the same shape (same width-to-height ratio). That way, whatever you see in the viewfinder fits onto your paper, just bigger or smaller.",
  "The “pre-instruction” drawings are your proof of progress. As you improve you tend to forget how you used to draw, so it's good to have a record.",
  "Drawing from memory shows the simple symbols you learned as a child: the same eye, nose or fingernail shape every time, drawn almost automatically.",
  "How well you draw now only shows the age when you stopped drawing. It says nothing about how well you could draw.",
  "Your style is personal, like your handwriting. The course doesn't teach a style; it teaches you to see. There are many kinds of line (bold, broken, thin and clean, “lost and found”) and they're all fine (p. 59)."]},
c3:{idea:"The two halves of your brain handle information differently. Drawing needs the visual way of thinking (the book calls it R-mode), which is usually drowned out by the verbal way (L-mode).",
 points:[
  "The two halves of the brain are linked by a thick bundle of nerves (the corpus callosum), and each one controls the opposite side of the body. Roger Sperry's “split-brain” studies showed that each half has its own way of understanding things.",
  "L-mode (verbal side): uses words, analyzes, uses symbols, thinks in steps, follows logic and time. R-mode (visual side): works without words, sees how parts fit together, deals with real things, compares, ignores time, thinks in space, uses intuition, sees the whole (full list on pp. 75–76).",
  "Many languages show an old prejudice against the left (“sinister” comes from the Latin for left; in French “gauche” means clumsy), and so against the right side of the brain, which controls the left hand.",
  "A sudden “eureka!” moment is a sign of R-mode: you suddenly see a link between things that seemed unrelated.",
  "Left-handed and right-handed people learn in the same way: draw with the hand you normally use.",
  "Which side of the brain takes over a task depends on which is faster and which “cares” more. The verbal side only lets go of a task when it finds it too slow, too detailed or impossible. The exercises in the book use exactly this."]},
c4:{idea:"Two exercises to feel the switch between the two ways of thinking: first the clash (Vase/Faces), then the way out (drawing upside down).",
 points:[
  "In Vase/Faces, naming the parts of a face (nose, lips, chin) switches on the verbal side. But finishing the vase so both sides match needs the visual side. The two clash and you get stuck.",
  "Drawing in R-mode means asking yourself only questions about shape and space: Where does this curve start? How deep does it go? What angle does it make with the edge of the paper?",
  "The book compares two sailors. A European navigator follows a written plan. A navigator from the Truk Islands keeps adjusting by watching the sun, wind and waves. Artists work like the second one.",
  "When a picture is upside down, you can't easily name what's in it. The verbal side gives up and the visual side works in peace. Even hard parts (like legs pointing toward you) turn out well, because you don't know what you're drawing.",
  "You notice you were in R-mode afterwards: you lost track of time, didn't follow what people said, felt calm but alert, and the drawing felt like a fascinating puzzle.",
  "The goal of the course: learn to switch into that state whenever you want, even when the subject is the right way up."]},
c5:{idea:"Around age 9 or 10 most people stop drawing: the symbols they learned as small children take the place of really looking.",
 points:[
  "How children's drawing develops: scribbling (from about 18 months), then symbols (a circle with eyes can be mom, the sun or a cat), then drawings that tell stories, then the same symbolic landscape repeated over and over.",
  "Small children have an almost perfect sense of where to place things on the page. Later they lose it, because they focus on one object at a time.",
  "Around age 10 language takes over. Kids want their drawings to look real, but they can't make it happen and many give up, often after someone makes fun of their drawing.",
  "The cube puzzle: to make a cube look like a cube, you have to draw shapes that are not squares, exactly as your eye sees them. Knowing that “all the corners are right angles” gets in the way of seeing.",
  "The symbols you memorized (eye, nose, hand, tree) pop up automatically. The fix is always the same: give the verbal side a task it doesn't want to do.",
  "In R-mode you slow down, lose track of time, stop following words, and feel calm and capable. The course teaches you to reach this state on purpose."]},
c6:{idea:"First skill, edges: in drawing, an edge is a line shared by two things, so one line draws both of them.",
 points:[
  "An edge is where two things meet. The line you draw there (the contour) belongs to both, like the shared edge between two jigsaw pieces. The border of your paper is an edge too.",
  "“Pure contour drawing” means drawing very slowly without ever looking at the paper. It won't give you a nice drawing, but it's the most useful exercise in the course: the verbal side gets bored and switches off.",
  "You discover that every detail is made of smaller details, and those of even smaller ones. Ordinary things become amazing again.",
  "The “picture plane” is an imaginary pane of glass in front of you, always facing you straight on. Drawing from life means copying what you see as if it were flattened onto that glass (artists like Alberti, Dürer and Van Gogh used real frames for this).",
  "Close one eye and keep your head still: you get one fixed view, flat like a photo. Copy that flat image onto paper and, strangely, it looks 3D.",
  "Starting on a gray background (graphite rubbed into the paper) takes away the fear of the blank page and hides your erasing."]},
c7:{idea:"Second skill, spaces: the empty “negative” spaces around and between things are as real as the things themselves. Drawing them makes hard parts easy.",
 points:[
  "Objects are “positive shapes”; the spaces around them are “negative spaces”. They share edges, so when you draw one you also draw the other. Spaces have no names, so you see them as they really are.",
  "Negative spaces help in three ways: they make tricky shapes easy (like things pointing toward you), they hold the whole drawing together and make it look better, and they train your eye.",
  "Composition means how shapes and spaces are arranged inside the border of your drawing (the “format”). The border shapes everything, so always start by framing the scene with the viewfinder and drawing the border on your paper.",
  "The “basic unit” is a medium-sized shape or space you pick as your starting point, and call “One”. You measure everything else against it (one to three-quarters, one to two…), so your drawing doesn't end up running off the page.",
  "A chair is the perfect subject: you know too much about chairs (four equal legs, a wide seat), and what you know doesn't match what you actually see.",
  "Set-up routine before every exercise (pp. 179–180): draw the border, tone the paper gray, draw the cross lines, frame the scene with the viewfinder, mark the basic unit on the picture plane, copy it onto your paper, then draw."]},
c8:{idea:"Third skill, relationships: perspective and proportion. First learn the basic ideas, then learn to measure angles and sizes by holding up your pencil (“sighting”).",
 points:[
  "Perspective asks you to accept things that seem wrong: a cube is drawn with angles that aren't right angles and sides that aren't equal, and yet it looks like a cube.",
  "Key ideas: you look from one fixed point; the picture plane is the imaginary glass in front of you; the horizon line is always at your eye level (it goes up and down with you); lines going into the distance meet at “vanishing points”.",
  "Horizontal edges above your eye level slant down toward the vanishing point; edges below your eye level slant up; edges exactly at eye level stay flat. Vertical lines stay vertical.",
  "In two-point perspective the vanishing points are almost always off the page. That's why artists measure by eye with a pencil instead of using rulers.",
  "Angles: compare them with a vertical or horizontal line held flat on the imaginary glass, without pointing the pencil into the room. Remember the shape of the angle (like a slice of pie) rather than the number of degrees.",
  "Proportions: arm straight, elbow locked, one eye closed. Mark the basic unit on the pencil with your thumb and compare it with something else. Then forget that length, measure the unit again in your drawing (which is a different size) and use the same ratio.",
  "The hardest part is trusting your own measurements. If you see it, draw it."]},
c9:{idea:"Edges, spaces and relationships come together in a profile portrait. You'll learn to beat the brain's habit of “correcting” sizes.",
 points:[
  "Your brain changes the size and shape of what you see to match what it already knows (“size constancy”), without telling you. Measuring is the only way to catch it doing this.",
  "The “chopped-off skull” mistake: people think the eyes are a third of the way down the head. In fact they're halfway between the top of the head (skull or hair) and the chin.",
  "The eyes, nose and mouth take up a small part of the head. The brain makes them look bigger because they're the parts that matter most to us.",
  "The ear: the distance from eye level to chin equals the distance from the back of the eye to the back of the ear (they form a triangle with two equal sides). The bottom of the ear is about level with the gap between nose and mouth.",
  "The neck joins the head higher up than you'd expect, and it's wide. Not a thin stick under an oval.",
  "Tips: to place the iris, draw the white of the eye around it as a shape; for glasses and collars, draw the spaces around them; for hair, draw the big masses, directions and dark areas, not single hairs.",
  "Copying drawings by great artists is great practice: it makes you slow down and see what they saw."]},
c10:{idea:"Fourth skill, light and shadow: following how light falls on things makes them look solid. The fifth skill, seeing the whole (the gestalt), then comes on its own as an “aha!”.",
 points:[
  "Light has four parts: the highlight (where light hits directly), the cast shadow (the darkest area, where the object blocks the light), reflected light (light bouncing back from nearby surfaces), and the crest shadow (a dark band on the curve of the form, between the light and the reflected light).",
  "“Values” are shades from the white of the paper to the darkest black. “High” values are light, “low” values are dark.",
  "Shapes of light and shadow have no names and change every time the model moves, so the verbal side ignores them. Upside down they just look like patches (see Courbet, pp. 270–271).",
  "People looking at a drawing fill in missing parts from just a few clues. A hint is enough, so you need to know when to stop.",
  "Three poses: front view, profile, three-quarter view. Front view: there's one eye's width between the eyes; the nostrils are below the inner corners of the eyes; the corners of the mouth are below the pupils; the ears run from eye level to between nose and mouth; the neck is almost as wide as the jaw.",
  "Three-quarter view: the side turned away looks narrower, and its eye and mouth change shape. From the front corner of the eye to the back of the ear equals eye level to chin. Common mistake: putting the near eye too close to the nose.",
  "Hatching (lines side by side) and crosshatching (lines crossing) come with practice and become your personal touch."]},
c11:{idea:"The five drawing skills also help you think: you can “see” a problem in terms of edges, spaces, relationships, light and shadow.",
 points:[
  "Draw a little every day: carry a sketchbook, copy photos upside down, copy great artists, or even just practice seeing in your head.",
  "Computers are great at L-mode tasks. R-mode tasks (reading a facial expression, having a hunch) are much harder to copy, and yet schools keep focusing on L-mode skills.",
  "Five stages of creativity: First insight (R-mode, noticing the problem), Saturation (L-mode, research), Incubation (R-mode, your mind works on it while you do other things), Illumination (the “aha!”), Verification (L-mode guided by R-mode, the hard work of making it real).",
  "You can “program” your brain: ask it to find an answer by a certain date, then stop thinking about it.",
  "The example of a designer: the edges shared with a client, the empty spaces still to explore, horizon and vanishing points, a basic unit, the lights and shadows of the project, and the whole picture.",
  "Real creativity also has to be useful to others. Cave paintings show how strong the human ability to imagine and picture things has always been."]},
c12:{idea:"The course is just the beginning: you never stop learning to draw, and every drawing also shows something about the person who made it.",
 points:[
  "You draw in R-mode, then use L-mode to think about what you made: a drawing shows how you see and feel things.",
  "No subject is too hard or too ordinary: everything is worth drawing.",
  "Copy great artists, not to copy their style, but to understand how they looked at things.",
  "Look after your own style and let it grow. If a drawing goes wrong, calm down and go back to looking.",
  "Don't wait for inspiration: every day, set things up so you can switch into drawing mode.",
  "Teach someone else: going over the lessons helps you remember them too."]}
},
ex:{
 strumenti:{t:"Make the picture plane and viewfinders", min:"20 min",
  mat:"Clear plastic sheet 8×10 in (20×25 cm), black cardboard, permanent marker, scissors",
  steps:["On the clear plastic sheet (the picture plane), use the permanent marker to draw one vertical and one horizontal line crossing in the middle.",
   "Cut two pieces of black cardboard the same size as the plastic (8×10 in) and draw lines from corner to corner on each.",
   "Small viewfinder: draw a rectangle 2 in (5 cm) in from every edge (its corners land on the diagonal lines) and cut it out to make a window.",
   "Large viewfinder: do the same, but 1 in (2.5 cm) in from the edges.",
   "To use them, clip either viewfinder onto the plastic sheet."],
  why:"The windows, the plastic sheet and your drawing border all have the same shape: only the size changes."},
 pre1:{t:"“Before” drawing 1: a person from memory", min:"15–20 min",
  mat:"Plain paper, HB pencil, tape, drawing board",
  steps:["Tape 3–4 sheets on top of each other to the board (the extra sheets make a softer surface).",
   "Think of a person (you can also use a photo or an old drawing of yours to help you remember).",
   "Draw them as well as you can: just the head, head and shoulders, or the whole body.",
   "Write a title, sign it and date it in the bottom right corner."],
  why:"It shows how much your childhood symbols control your hand."},
 pre2:{t:"“Before” drawing 2: self-portrait in a mirror", min:"20–30 min",
  mat:"Small mirror, HB pencil, drawing board leaning against the wall",
  steps:["Tape the mirror to the wall and sit about an arm's length away, so you can see your whole head.",
   "Lean the board against the wall with its bottom edge resting in your lap.",
   "Look at your reflection and draw yourself.",
   "Add a title, sign it and date it."],
  why:"You'll compare it with your final self-portrait (ch. 10)."},
 pre3:{t:"“Before” drawing 3: my hand", min:"15–20 min",
  mat:"HB pencil, paper",
  steps:["Sit at a table.",
   "Draw the hand you don't draw with, in any position you like.",
   "Add a title, sign it and date it.",
   "Compare the three drawings: look for shapes you drew the same way each time (eyes that all look alike, fingernails that all look alike) and write them on the back. Then put the drawings away until the end of the course."],
  why:"The notes on the back become a record of where you started."},
 firma:{t:"Your signature as a drawing", min:"10 min",
  mat:"Plain paper, HB pencil",
  steps:["Sign your name as you normally do and look at it as if it were a drawing: nobody else makes it quite like you.",
   "Look at the five signatures in the margin (p. 56): it's the same name, but each one shows a different personality. What do they say to you?",
   "Write your name again in at least three different kinds of line and notice what changes (speed, pressure, rhythm, size)."],
  why:"You already express yourself through line. The course focuses on seeing; your style will grow by itself."},
 vasi:{t:"Vase/Faces", min:"5–10 min",
  mat:"Paper, HB pencil",
  steps:["Copy one half of the vase/faces picture (p. 83): the face on the left if you're right-handed, on the right if you're left-handed.",
   "Draw a short horizontal line at the top and at the bottom: these will be the top and bottom of the vase.",
   "Go over the face line again, saying the parts out loud as you pass them: forehead, nose, lips, chin, neck.",
   "Now draw the other face, facing it, so the vase is the same on both sides. Notice how confused you start to feel.",
   "Write on the back how you got out of it (drew a grid, looked at the space between the faces, started from the bottom…)."],
  why:"You feel the two ways of thinking getting in each other's way."},
 stravinsky:{t:"Upside-down drawing: Picasso's Stravinsky", min:"40–60 min",
  mat:"The upside-down picture on p. 93, HB pencil, paper, a quiet hour",
  steps:["Find an hour where nobody will disturb you. Play music without words, or work in silence.",
   "Don't turn the picture or your drawing the right way up until you've finished.",
   "Start anywhere and move from each line to the one next to it, and from each space to the shape beside it, like doing a puzzle. Don't draw the outline first.",
   "If you talk to yourself, only talk about what you see: “this line curves like this”, “it's at this angle compared with the edge of the paper”.",
   "The hands and face will tempt you to name them. Cover the picture with a finger or a piece of paper and uncover it one line at a time.",
   "When you're done, turn everything the right way up and look at what you made."],
  why:"The verbal side of your brain can't “read” an upside-down picture, so it steps aside."},
 capovolti:{t:"More upside-down drawings", min:"30–60 min",
  mat:"The pictures on pp. 99–101, or any photos or drawings you like, turned upside down",
  steps:["Choose Spider-Man on p. 99 or the German knight on p. 100 (a line version is on p. 101).",
   "Draw a border on your paper with the same shape as the picture: the border decides how shapes and spaces fit.",
   "Draw it the same way as Stravinsky, keeping it upside down the whole time.",
   "After each drawing, think about how you felt while drawing: learn to recognize when you're in R-mode."],
  why:"The more you make the switch, the more familiar it becomes."},
 paesaggio:{t:"The landscape you drew as a child", min:"15 min",
  mat:"Paper, HB pencil",
  steps:["Before you read on, draw the landscape you used to draw as a child (house, sun, trees, mountains, road…).",
   "Call it “Remembered Childhood Landscape”.",
   "While you draw, remember how happily and confidently you put each thing in its place.",
   "Cover one thing with your hand and see how the balance of the picture changes (example on p. 115)."],
  why:"It brings back your childhood symbols and your natural sense of where things go on the page."},
 contpuro:{t:"Pure contour drawing of your palm", min:"5 min (+ repeats)",
  mat:"Paper taped to the board, HB pencil, timer",
  steps:["Hold the hand you don't draw with slightly cupped: you're going to draw all the creases in your palm.",
   "Set a timer for 5 minutes.",
   "Turn your body fully away from the paper: look only at your palm, never at the drawing.",
   "Follow one crease a millimeter at a time, moving your eyes and pencil together, very slowly, like a needle recording an earthquake.",
   "Don't stop or look at the paper until the timer rings. The urge to stop usually fades within a minute.",
   "If you didn't feel the switch, try again with a crumpled piece of paper, a flower or a feather (p. 134)."],
  why:"The task is too slow and detailed for the verbal side of your brain, so it gives up and leaves the job to the visual side."},
 pianomano:{t:"Drawing your hand on the picture plane", min:"15–20 min",
  mat:"Picture plane, viewfinder, clips, non-permanent marker, damp tissue",
  steps:["Rest your hand on the table with your fingers pointing at your face, so they look shortened.",
   "Pick the viewfinder that frames your hand best, clip it to the plastic sheet and trace the inside of the window with the marker (this is your border).",
   "Rest the plastic sheet on your fingertips, close one eye and keep your head still.",
   "Trace the edges you see through the plastic, exactly as they look, without naming the parts. Fix mistakes with the damp tissue.",
   "Try again with harder poses (a fist, crossed fingers, holding something) and keep your best drawing."],
  why:"You see with your own eyes that drawing means copying what appears on the flat glass."},
 pianostanza:{t:"Look at the room through the plane", min:"5 min",
  mat:"Picture plane with the large viewfinder",
  steps:["Hold the plastic sheet in front of your face, facing you straight on, and close one eye.",
   "Move it closer and farther away to change what's in the frame.",
   "Compare the edges of the ceiling or a table with the two cross lines (one vertical, one horizontal).",
   "Imagine tracing those edges. Then put the sheet down and try to “see” it in front of you anyway."],
  why:"It trains you to use an imaginary picture plane, which you'll use all the time."},
 contmod:{t:"Your hand on a gray background (modified contour)", min:"1 hour",
  mat:"Drawing pad, graphite stick, paper towel, HB and 4B pencils, three erasers, the plastic sheet with your hand drawing on it",
  steps:["Tape the paper down at the four corners and draw the border, using the viewfinder as a stencil.",
   "Tone the paper: rub on a light layer of graphite, then rub in circles with the paper towel until it's an even silvery gray. Lightly draw the cross lines.",
   "Using the cross lines as a guide, copy the main points of your hand drawing from the plastic sheet onto the paper (same size).",
   "Put your hand back in the same pose, close one eye and slowly draw every bump and curve of the edges. Look at your hand, not the paper, 90% of the time.",
   "For the fingernails, draw the shapes of skin around them. If a part confuses you, move on to the next shape.",
   "To finish: erase the light areas, darken the shadows and, if you like, lighten the background."],
  why:"It's your first “real” drawing, and it looks 3D because you copied a flat view."},
 sedia:{t:"Drawing the spaces around a chair", min:"1 hour or more",
  mat:"Large viewfinder, picture plane, marker, drawing pad, pencils, erasers, graphite, paper towel",
  steps:["Draw the border using the outside edge of the plastic sheet, tone the paper gray and lightly draw the cross lines.",
   "Put a chair (ideally one with bars and slats) in front of a plain wall, about 7–8 ft (2–2.5 m) from you. A lamp can add an interesting shadow.",
   "Frame it with the viewfinder and plastic sheet, one eye closed. Imagine the chair disappearing so that only the spaces around it are left.",
   "Choose one simple space as your basic unit (for example between two slats). Draw it on the plastic, then copy it onto your paper, checking its position and angles against the cross lines.",
   "From there, draw one space after another like puzzle pieces. Only ask yourself how wide each one is and what angle it makes, compared with the basic unit and with vertical and horizontal.",
   "At the end, lighten either the spaces or the chair with the eraser and add the shadows."],
  why:"The verbal side of your brain isn't interested in “nothing”, so the chair comes out right by itself."},
 copiespazi:{t:"Copy Homer and Rubens by drawing the spaces", min:"30–45 min",
  mat:"Pictures on pp. 189 and 190, pencil, paper",
  steps:["Copy Winslow Homer's boy in the wicker chair (p. 189), paying attention to the empty spaces.",
   "Turn Rubens's studies of arms and legs (p. 190) upside down and draw the spaces around the shapes first.",
   "Then turn your drawing the right way up and add the details inside."],
  why:"Arms and legs pointing toward you look hard, but become easy when you look at the spaces around them."},
 spaziovunque:{t:"Hunt for negative spaces", min:"every day",
  mat:"Just your eyes",
  steps:["During the day, look for the empty spaces between things: between branches, between buildings, the hidden arrow in the FedEx logo.",
   "Imagine drawing their edges one by one.",
   "Try it with a basket, a ladder or a whisk: everyday objects suddenly look beautiful."],
  why:"Practicing in your head makes this new way of seeing automatic."},
 corridoio:{t:"One-point perspective: a hallway", min:"10 min + drawing",
  mat:"A long hallway, picture plane, pencil",
  steps:["Stand in the middle of one end of the hallway. Find your eye level on the far wall and choose a point there: this is the vanishing point.",
   "Hold up the plastic sheet facing you, line up its horizontal line with your eye level and close one eye.",
   "Hold your pencil flat against the plastic along the line where the wall meets the ceiling: you'll see it slants down toward the vanishing point. Do the same on the other side and with the doors.",
   "The lines along the floor slant up toward the same point. Vertical lines stay vertical.",
   "Sit down (your eye level drops) and notice how the angles change.",
   "Draw the hallway in one-point perspective."],
  why:"It builds your sense of perspective, which you'll later use just by eye."},
 angolo:{t:"Measuring the angles of a room corner", min:"20 min",
  mat:"Picture plane with viewfinder, marker, pencil, paper",
  steps:["Sit 10–13 ft (3–4 m) from a corner of the room, preferably one without much furniture.",
   "Frame it with the plastic sheet, line up the horizontal line with your eye level, and trace the vertical line of the corner, then the lines where the walls meet the ceiling and the floor.",
   "Copy the lines onto paper. If you extended them, they would meet at two vanishing points off the page.",
   "Now do it again using only your pencil: hold it vertical for the corner and horizontal for the top lines, and “take a mental photo” of the wedge-shaped gap each angle makes.",
   "Always compare an angle with either the horizontal or the vertical, whichever is closer (it gives the smaller gap)."],
  why:"You can only see an angle properly by comparing it with a perfectly vertical or horizontal line."},
 gesto:{t:"Measuring proportions with your pencil", min:"10 min",
  mat:"Pencil",
  steps:["Close one eye, stretch your arm out straight with the elbow locked, and hold the pencil flat on the imaginary glass in front of you.",
   "Line up the pencil tip with one end of your basic unit (for example the top of a door) and slide your thumb to the other end.",
   "Compare that length with something else: is it the same (1:1), twice as long (1:2), 2⅔ times as long (1:2⅔)…?",
   "Remember the ratio, then forget the actual length on the pencil.",
   "On your drawing, measure your basic unit again and use the same ratio: one… two…"],
  why:"It avoids the most common mistake: copying the length on your pencil directly onto the paper."},
 duepunti:{t:"Two-point perspective drawing", min:"1–2 hours",
  mat:"Toned drawing pad, pencils, erasers, picture plane with large viewfinder, two chairs",
  steps:["Do the same set-up as for the chair, using the outside edge of the plastic sheet for the border.",
   "Choose an interesting view (a corner of the kitchen, an open door, a balcony, a street corner). It doesn't have to be an easy one.",
   "Frame it with the viewfinder, choose a medium-sized basic unit (a window, a door, a picture on the wall) and draw it on the plastic.",
   "Copy it onto the paper using the four sections made by the cross lines (making it a little bigger).",
   "Work from each part to the part next to it, measuring angles and proportions. Use negative spaces for small objects and plants.",
   "Squint to see the big areas of light and shadow: erase the light areas and darken the shadows. Check anything that looks “wrong” with the plastic sheet."],
  why:"With edges, spaces and relationships, you can draw anything you can see."},
 costanza:{t:"Catching your brain resizing things", min:"15 min",
  mat:"A strip of paper you can mark, picture plane, marker, a mirror",
  steps:["The four men (p. 230): mark the height of one figure on a strip of paper and check the others: they're all the same size. Then turn the book upside down.",
   "The two tables (p. 232): trace one tabletop on the plastic sheet and place it over the other: they're identical.",
   "In a busy place, look at heads near and far through a rolled-up paper tube.",
   "In the mirror, at arm's length, mark the top of your head and your chin with the marker: your reflection is only about half the size of your real head."],
  why:"You need to catch your brain “cheating” before you'll trust your measurements."},
 misuretesta:{t:"Head proportions (front and side view)", min:"20 min",
  mat:"Paper, pencil, mirror, photos of faces",
  steps:["Draw an oval for a head seen from the front, with a vertical line down the middle and a horizontal eye line halfway down.",
   "On your own head, measure with the pencil from the inner corner of your eye to your chin, then from your eyes to the top of your head. They're the same.",
   "Check this on photos, in the mirror and on a TV screen.",
   "Draw the blank head shape in profile (p. 244), with the eye line halfway down.",
   "Find the back of the ear using the triangle rule (eye level to chin = back of the eye to back of the ear), then the bottom of the ear and the point where neck and skull meet. Mark them on the shape."],
  why:"Remembering these measurements helps you avoid the most common mistakes."},
 sargent:{t:"Copying Sargent's portrait of Madame X in profile", min:"1 hour",
  mat:"Drawing pad, HB and 4B pencils, erasers, the plastic sheet as a stencil",
  steps:["Draw the border with the plastic sheet and add light cross lines. Don't tone the paper (this is a line drawing).",
   "Place the plastic sheet over the drawing on p. 249 to see where the cross lines fall, and choose a basic unit (the ear, the nose, or eye level to chin).",
   "Follow the checks on pp. 251–252: the hairline, the tip of the nose, the angle from nose to chin, the empty spaces in front of the face and neck, the position of the ear.",
   "Build the drawing like a puzzle, comparing everything with the basic unit.",
   "When you've finished, turn both the original and your copy upside down: the mistakes will jump out at you."],
  why:"It's a rehearsal before you draw a real person."},
 profilo:{t:"Profile portrait of a real person", min:"1 hour or more",
  mat:"A model (someone watching TV or reading is fine), picture plane, marker, drawing pad, pencils, erasers, two chairs",
  steps:["Draw the border, tone the paper lightly (or leave it white for a line drawing) and add the cross lines.",
   "If you're right-handed, have the model face left. Sit 2–4 ft (60–120 cm) away.",
   "Frame them with the plastic sheet, leaving room for the neck and shoulders (the chin shouldn't touch the edge).",
   "Use eye level to chin as your basic unit: mark it on the plastic and copy it onto the paper, along with the top of the hair and the back of the head.",
   "Start with the empty space in front of the face. Check the angle from nose to chin, the space under the nostril, the angle of the eyelid and of the line of the mouth.",
   "Place the ear using the triangle rule, measure the back of the head, draw the hair as masses and directions, then draw the neck and collar using the spaces around them."],
  why:"This is where the first three skills become a single skill."},
 courbet:{t:"Look at Courbet upside down", min:"5 min",
  mat:"Just the book",
  steps:["Look at Courbet's self-portrait upside down: all you see are light and dark patches.",
   "Turn it the right way up: the same patches turn into a solid-looking head.",
   "Look at the patchy pictures on p. 272: first you see only the pattern, then you understand what it shows."],
  why:"To understand that you should draw shadows as shapes, not as what you think they are."},
 frontale:{t:"Face proportions in the mirror", min:"20 min",
  mat:"Mirror, paper, pencil",
  steps:["In front of the mirror (which works as your picture plane), draw an oval with a vertical line down the middle and the eye line halfway down.",
   "Tilt your head: the middle line and the eye line always stay at right angles to each other.",
   "Divide the eye line into five equal parts: the gap between the eyes is one eye wide.",
   "Find the bottom of the nose by drawing an upside-down triangle from the outer corners of the eyes. The mouth is about a third of the way from the nose to the chin.",
   "Mark the nostrils, the corners of the mouth, the ears and the width of the neck. Then check these on other people and on photos."],
  why:"A general guide you adjust to each face."},
 tretquarti:{t:"The three-quarter view in the mirror", min:"30 min",
  mat:"Mirror, paper, pencil",
  steps:["Turn your head until the tip of your nose almost touches the outline of the far cheek.",
   "Find the middle line of the face (through the middle of the nose and the upper lip) and see how it tilts. The eye line is at right angles to it.",
   "Start with the enclosed shape between the nose and the far cheek. Draw the far eye by drawing the shapes around it (above, beside, the white of the eye, below).",
   "The near eye is about one eye's width from the edge of the nose.",
   "Use lines parallel to the middle line to place the nostrils and the corners of the mouth. Place the ear with the rule: front corner of the eye to back of the ear = eye level to chin."],
  why:"It prepares you for the final self-portrait, which works best in three-quarter view."},
 steichen:{t:"Copying a detail from Steichen's photo", min:"1 hour",
  mat:"4B (or 6B) pencil, erasers (one cut to a point), picture plane, graphite, paper towel",
  steps:["Draw the border with a viewfinder and tone the paper as dark gray as you can.",
   "Lay the plastic sheet over the picture on p. 288. Draw the cross lines on your paper with the eraser, using a ruler.",
   "Choose a basic unit (for example the length of the nose) and copy it onto your paper.",
   "“Draw” with the eraser: first the big areas of light, then the brightest spots (forehead, scarf, tip of the nose).",
   "Darken the shadow areas with the 4B pencil, keeping the tones smooth.",
   "Step back, squint, and stop as soon as the face “appears”. Don't draw the eyes."],
  why:"It shows how little you need to draw for the viewer to see everything."},
 tratteggio:{t:"Hatching and crosshatching", min:"15 min + practice",
  mat:"Paper, sharp HB or 4B pencil",
  steps:["Draw a group of 8–10 parallel lines, moving your hand from the wrist: this is called a “set”.",
   "Try different directions, speeds, spacings and lengths until you find the ones that feel like yours.",
   "Draw a second set across the first, at a slightly different angle (for a shimmering effect) or at a sharper angle.",
   "Add more sets on top to make it darker. Also try curved lines that follow the shape of an object.",
   "Practice on balls and tubes, even while you're on the phone."],
  why:"Hatching becomes your own personal way of shading."},
 autoritratto:{t:"Self-portrait in light and shadow", min:"1–2 hours",
  mat:"Drawing pad, pencils, erasers, mirror at arm's length, adjustable lamp, graphite, a hat if you like",
  steps:["Draw the border, tone the paper (light, medium or dark: your choice) and add the cross lines.",
   "Put the mirror at arm's length (it's your picture plane), lean the board against the wall and place the lamp to one side. Choose a front or three-quarter pose and then don't move anything.",
   "Choose a basic unit (for example eye level to chin) and mark its two ends on the mirror with the marker. Copy them onto your paper.",
   "Squint and erase the big areas of light. Then darken the side in shadow with the 4B pencil.",
   "Don't draw the eyes, nose and mouth straight away: let them appear out of the shadows (for the eyes, a fingertip with a bit of graphite is often enough).",
   "Add the smaller shadows. Get up every now and then to look at the drawing from a distance and correct it."],
  why:"It brings all four skills together, and the fifth, the likeness, appears by itself."},
 confronto:{t:"Before and after", min:"10 min",
  mat:"Your three “before” drawings and your final self-portrait",
  steps:["Put your first and your final self-portraits side by side.",
   "Notice what changed: fewer symbols, more real observation.",
   "Measure the proportions of the end-of-course self-portraits shown in ch. 2.",
   "Bonus: draw yourself as a character from a famous painting."],
  why:"It shows you the progress you'd otherwise forget."},
 taccuino:{t:"A drawing a day", min:"10 min a day",
  mat:"A small sketchbook and a pencil",
  steps:["Always carry a sketchbook with you.",
   "Whenever you have a spare moment, draw something nearby: a cup, scissors, a leaf.",
   "Or copy a newspaper photo upside down (sports and dance photos have great negative spaces).",
   "When you can't draw, look around you for negative spaces, your eye level and angles.",
   "Tap “I drew today” on the home screen to keep count of the days in a row."],
  why:"New connections in your brain only become solid if you repeat them."},
 problema:{t:"Draw one of your problems", min:"30 min",
  mat:"A sheet of paper and a real problem",
  steps:["Pick a real problem or decision you're facing.",
   "First insight: where are the edges you share with others (who are they? are the edges soft or hard?) What's in the empty spaces? Where's your horizon, and what's your basic unit? What's in the light, and what's in shadow?",
   "Turn the picture upside down in your mind to look for what you're missing.",
   "Saturation: collect the information you need.",
   "Incubation: give your brain a deadline, then do something else.",
   "When the “aha!” comes, check it and put it into practice step by step."],
  why:"Using these skills in other areas of life works best when you practice it on purpose."},
 insegna:{t:"Teach someone to draw", min:"an afternoon",
  mat:"Your materials and the book",
  steps:["Choose a friend or relative who says they “can't draw”.",
   "Have them do the three “before” drawings.",
   "Take them through Vase/Faces, upside-down drawing and pure contour drawing.",
   "Compare the results and tell them about the five skills."],
  why:"Explaining how it works helps you understand it better yourself."}
},

  gomma3:["Kneaded eraser", "to lighten without rubbing"],
