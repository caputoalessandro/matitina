memo:[
  {t:"The five skills", items:["Edges: the contour shared between two things.","Spaces: the negative spaces that share edges with the forms.","Relationships: angles relative to vertical/horizontal and proportions relative to the basic unit.","Lights and shadows: the logic of light, values.","Gestalt: the whole, which emerges by itself."]},
  {t:"Routine before every drawing", items:["Draw the format (edge of the viewfinder or of the plane).","Tone the paper, if you want to work on a gray ground.","Draw the light crosshairs.","Compose with viewfinder and plane, one eye closed.","Choose the basic unit (“One”) and draw it on the plane.","Transfer it to the paper with the help of the crosshairs.","Then draw, from adjacent part to adjacent part."]},
  {t:"Pocket perspective", items:["The horizon is always at your eye level.","Horizontal edges above the horizon: slant down toward the vanishing point.","At eye level: they stay horizontal.","Below the horizon: they slant up toward the vanishing point.","Verticals stay vertical (except for very tall buildings).","Stay on the plane: don't “poke through” it with the pencil."]},
  {t:"Sighting with the pencil", items:["One eye closed, arm extended, elbow locked.","Angles: compare them with vertical or horizontal (whichever is closer).","Proportions: always relative to the basic unit, as a 1:x ratio.","Erase the measurement from the pencil and remeasure in the drawing.","Believe your measurements: if you see it, draw it."]},
  {t:"The head in profile", items:["Eye-level line at half the head (top of skull/hair – chin).","Eye-to-chin = back of the eye – back of the ear (isosceles triangle).","Bottom of the ear about level with the space between nose and mouth.","The neck joins the skull high up, about level with the nose or mouth.","The features take up a small part of the head."]},
  {t:"The head, frontal and three-quarter", items:["Central axis and eye-level line always at right angles.","One eye of space between the eyes (eye-level line in fifths).","Base of the nose: inverted triangle from the outer corners of the eyes.","Mouth about a third of the way from nose to chin; corners under the pupils.","Nostrils under the inner corners of the eyes; ears from the eyes to nose-mouth.","Three-quarter: front corner of the eye – back of the ear = eye-to-chin; near eye one eye-width from the nose."]},
  {t:"Logic of light", items:["Highlight: where the light strikes directly.","Cast shadow: the darkest, where the light is blocked.","Reflected light: light bounced off nearby surfaces.","Crest shadow: on the ridge of the form, between light and reflected light.","Squint to see the large masses; stop when the form “appears”."]},
  {t:"When you're stuck", items:["Do two minutes of pure contour on a complex object.","Turn the model (or the drawing) upside down and keep going.","Draw the adjacent space or shape, not the “hard” part.","Stop naming the parts: ask yourself only about angles, widths, curves.","Get away from distractions: the shift in mode is fragile."]}
],
long:{
intro:[
 {h:"Drawing like reading", p:[
  "The book's underlying idea is a comparison with reading. Nobody thinks reading requires a special gift: you learn the letters, the sounds, the syllables, the vocabulary, and at some point the pieces fuse and you “read” without thinking about it. Drawing works the same way: it's a global skill made of smaller skills, and people who say “I can't draw” have usually just never learned one or more of these components.",
  "The book is designed precisely for people starting from zero who think they have no talent. The exercises don't aim at making “art”, but at building the alphabet of seeing: a solid base from which everyone can then go wherever they like, from portraits to landscapes to abstraction."]},
 {h:"The five basic skills", p:[
  "To draw what's in front of you, you need five ways of seeing. Edges: where one thing ends and another begins. Spaces: what lies around and between things. Relationships: angles and proportions, that is, perspective. Lights and shadows: the degrees of light and dark that make things look solid. And the gestalt, the perception of the whole.",
  "The first four must be taught directly, one at a time, and that's what chapters 6 to 10 do. The fifth can't be taught: it arrives as a consequence, an “aha” you feel when, after carefully observing the parts, you suddenly see the whole thing. The author likens it to aesthetic pleasure, the sense of beauty."]},
 {h:"The strategy: a task the verbal part rejects", p:[
  "The heart of the method is a simple observation. The part of the brain that works with words is fast, dominant and tends to jump on every task, even when it's not suited to it. Faced with a face, instead of looking it “names”: eye, nose, mouth, and draws the symbols it knows. Fighting it head-on doesn't work.",
  "What works is getting around it: offering a task it finds pointless, boring or impossible, so that it steps aside on its own. Every exercise in the book is a variation on this trick: an upside-down image that can't be named, a contour so slow it's unbearable, an empty space that is “nothing”, an angle that contradicts what you know, a shadow that changes shape with every movement."]},
 {h:"Plasticity, the saboteur and transfer", p:[
  "Today we know the brain changes with experience: learning a new skill creates new connections. This undermines the idea of a fixed talent, given or withheld at birth. Like reading, once drawing is acquired it stays for life.",
  "Beware, though, of the “great saboteur”: precisely because it's being pushed aside, the verbal mind will always find something more urgent to do. The remedy is the same: start anyway with something it rejects, even just a negative space or an upside-down copy. Over time the resistance fades. And the skills of seeing, learned by drawing, can be transferred to how you think and solve problems: that's the subject of chapter 11."]}
],
c1:[
 {h:"Why the bicycle", p:[
  "Teaching drawing is like teaching bike riding: you can describe it in words as much as you like, but you only really get it by trying, perhaps after watching someone do it. That's why phrases like “look harder” or “check the proportions” are of little use: learners don't know what to look at, or how.",
  "Drawing from life depends on a particular way of seeing, different from the one we use every day to recognize objects and get around. In normal life it's enough to grasp “what” a thing is; to draw it you have to see “how” it really is, with its shapes, its angles, its relationships."]},
 {h:"It isn't magic", p:[
  "Many people consider drawing an almost magical ability, and artists often don't help: asked “how do you do it?”, they answer “I look and draw what I see”. True, but it explains nothing. The book aims to remove the mystery: anyone who can sign their name or write a message already has enough coordination. The problem isn't the hand, it's the eye, or rather the way the brain interprets what the eye sees.",
  "That's why the teaching aims more at unlocking than at adding: the abilities are there, but old habits of seeing cover them up."]},
 {h:"A different state of mind", p:[
  "People who draw well enter a particular state: intense concentration, time disappearing, surrounding voices turning into background noise, a feeling of calm and confidence. It's similar to what happens on a long highway drive, while reading a gripping novel or playing a sport.",
  "This state is fragile: a question or a ringing phone is enough to snap you back to your usual way of thinking. Learning to draw also means learning to create the conditions for entering it, and to recognize it when you're in it."]},
 {h:"Why difficult subjects", p:[
  "The exercises deliberately use the subjects considered hardest: a hand, a chair, a room in perspective, a portrait, a self-portrait. The reason is that drawing is always the same task, whatever the subject; you might as well prove to yourself that you can tackle the ones that scare you most.",
  "Faces have an extra advantage: anyone can tell right away if a portrait is off, so the feedback is immediate, and achieving a likeness gives great confidence. Plus, face recognition is a specialty of the visual part of the brain, the very part we want to train."]}
],
c2:[
 {h:"The tools and why you need them", p:[
  "The materials are simple: paper, a couple of pencils, a graphite stick, three erasers, tape, a board. Two tools, though, are special: the clear picture plane with crosshairs drawn on it and the black cardboard viewfinders. They look like accessories, but the book considers them essential to understanding what drawing from life really is.",
  "The picture plane makes concrete a concept that usually stays abstract: looking at the world through a window and copying what you see “flattened” on the glass. The viewfinders are for framing and choosing the composition. They all share the same width-to-height ratio, so what you see in the viewfinder can be transferred to the paper changing only the scale. Once the skills are internalized, you can do without them."]},
 {h:"The pre-instruction drawings", p:[
  "Before learning anything, you make three drawings: a person from memory, a self-portrait in a mirror, your own hand. It's an uncomfortable moment, but an important one: progress brings a curious amnesia, you forget how you used to draw and become ever more critical. Having a dated, signed starting point lets you truly measure how far you've come.",
  "When you look at these drawings, it's worth searching not for flaws but for the little spots where you really observed: the curve of an eyebrow, the fold of a collar. They're the sign that the ability to see is already there."]},
 {h:"The tyranny of symbols", p:[
  "Drawing from memory brings out something valuable: the symbol system each of us built as a child. Almond eyes with a little circle, a hooked nose, fingernails like small arches. Often the same symbols reappear unchanged in the self-portrait too, that is, even while looking at a real face: the hand draws what it “knows” instead of what it sees.",
  "The level of these drawings generally matches the age at which you stopped drawing, often between nine and twelve. It says nothing about potential: it only shows where you stopped. The course doesn't teach technical tricks, but how to see differently, and that's what transforms the results."]},
 {h:"Your style is already yours", p:[
  "The book doesn't teach a style. Your signature proves it: it's a drawing made with a line, unique and recognizable, expressing speed, pressure, rhythm, character. Already today, writing your name, you use line expressively.",
  "Personal style emerges by itself as you learn to see better: two people drawing the same model with the same materials get two portraits that are both good likenesses yet very different. There are many kinds of line, bold, broken, thin and precise, disappearing and reappearing, and none is better than the others. The more clearly you see, the more the drawing also reveals who made it."]}
],
c3:[
 {h:"A double brain", p:[
  "Seen from above, the two hemispheres look like the two halves of a walnut, joined by a bundle of fibers, the corpus callosum. Each controls the opposite side of the body: the right hand depends on the left hemisphere and vice versa. For a long time the left, seat of language in the vast majority of people, was thought to be the “main” one, and the right a mute younger sibling.",
  "Roger Sperry and his group's studies on patients whose corpus callosum had been severed changed this view: both hemispheres perform complex functions, but in different ways. Sometimes they cooperate, sometimes one takes charge, sometimes they conflict. To avoid arguments about precise localization, the book speaks of “L-mode” and “R-mode”."]},
 {h:"L-mode and R-mode", p:[
  "L-mode is verbal and analytic: it names, breaks down, counts, follows a sequence, uses symbols, reasons in logical steps, keeps track of time. It's perfect for a theorem or an outline, but it tends to simplify: recognizing a thing is enough for it to categorize it and move on.",
  "R-mode is visual and holistic: it sees how parts fit together, grasps relationships in space, works by analogy and intuition, doesn't feel time passing and accepts what is ambiguous or contradictory. It's what you need to draw what's in front of you, because it doesn't replace reality with a concept. Try describing a spiral staircase without making the spiral gesture and you'll notice how inadequate words can be."]},
 {h:"An old prejudice", p:[
  "Many languages betray a bias against the left, and so indirectly against the right hemisphere that controls it: “sinister” comes from the Latin for left, “dexterous” from the word for right; in French gauche means clumsy. Left-handed children used to be forced to use their right hand, often with heavy consequences. As the author notes, words were invented by the verbal half of the brain, which kept the best ones for itself.",
  "Sudden insights too, Archimedes's classic “eureka” in the bath, are moments when R-mode sees a connection that step-by-step reasoning hadn't found."]},
 {h:"Left-handers, right-handers and who takes the task", p:[
  "Left- and right-handers learn to draw the same way: there's no need to switch to the other hand, which only makes the line clumsier. You draw with the hand you normally use.",
  "The key point for the rest of the book is how the two hemispheres divide the work. Two things seem to count: who gets there first and who cares more. The verbal part is fast and dominant, and only gives way if the task seems too slow, too detailed or impossible for it. The exercises are built exactly this way, so that it's the one to give up."]}
],
c4:[
 {h:"Vase/Faces: feeling the conflict", p:[
  "The first exercise is designed to create a glitch. You copy half a profile, then trace over it saying the names of the parts out loud: forehead, nose, lips, chin. This switches on the verbal part. Then you're asked to draw the other profile to get a symmetrical vase, a task that can only be solved by looking at shapes, curves and distances.",
  "Halfway through almost everyone feels confusion, sometimes a real paralysis of the hand: you no longer know whether the line should go right or left. That's exactly the point: making the clash between two ways of thinking perceptible. Everyone finds their own way out, looking at the space between the profiles, drawing a grid, starting from the bottom, no longer thinking of a face, and it's useful to note it down."]},
 {h:"Thinking like an island navigator", p:[
  "The book compares two navigators. The European one sets out with a written plan, routes and coordinates, and carries it out stage by stage. The navigator from the Truk Islands keeps the destination in mind in relation to the other islands and constantly corrects course by watching sun, wind and waves: he navigates superbly but couldn't explain it in words.",
  "The second profile should be drawn like the second navigator. The right questions are purely spatial: where does this curve begin? how deep is it? what angle does it make with the edge of the paper? how long is it compared to the line I just drew? No names, no rules like “the chin juts out as far as the lips”."]},
 {h:"Upside-down drawing", p:[
  "Upside-down things are hard to recognize and name: a famous face upside down becomes unrecognizable, your own handwriting illegible. The verbal part, which lives on recognition, finds the task annoying and pointless and withdraws. The visual part, on the other hand, makes no distinction between right side up and upside down: it just sees interesting lines and shapes.",
  "Copying Picasso's portrait of Stravinsky upside down, almost everyone gets a surprising result. Often the most successful parts are the hardest ones, like the foreshortened crossed legs, because you didn't know what you were drawing. Where the brain does recognize something, the hands and face, the doubts and erasures return. The lesson is simple: if you see it, draw it just as it is."]},
 {h:"Recognizing the R-state", p:[
  "You don't perceive the shift from one mode to the other as it happens, but you recognize it afterwards. You lose track of time, other people's words become sounds, you feel alert yet relaxed, confident, and the drawing starts to seem like a fascinating puzzle.",
  "Repeating the experience with other upside-down drawings helps you get familiar with this feeling. The course's goal is to be able to bring it on even when the subject is right side up, always looking for visual information that the verbal part doesn't want or can't handle."]}
],
c5:[
 {h:"How children draw", p:[
  "Around a year and a half comes scribbling: the pure pleasure of seeing a line come out of the pencil. Then the great discovery: a mark can stand for something. A circle with two dots becomes mom, the dog, the sun. From there children build a vocabulary of symbols, refine them and repeat them until they become rock-solid.",
  "Around four or five, drawings tell stories and express emotions: a huge arm because it's the one holding the umbrella, a sister with her teeth on full display. Then comes the symbolic landscape, almost the same for everyone: ground at the bottom, sky at the top, the house with its doorknob, the sun in a corner, trees, cone-shaped mountains. Young children's sense of composition is striking: every element sits exactly where it should within the edges of the paper."]},
 {h:"The crisis at ten", p:[
  "Between nine and eleven things change. Language takes over, children focus on individual objects and lose their sense of composition. Above all they want realism: things that look real, that recede into space. And the symbols they know are no longer enough.",
  "Without suitable teaching the drawing “doesn't come out right”, frustration and embarrassment set in, often made worse by a sarcastic remark from an adult or a classmate. Many stop for good. They become the adults who say they can't draw a straight line and who, if forced to draw a person, still produce the figure they drew at ten."]},
 {h:"The cube paradox", p:[
  "To grasp the crux of the problem, a cube seen corner-on is enough. We know it's made of squares and right angles, but to make it look like a cube you have to draw shapes that aren't square, with acute and obtuse angles, exactly as they appear to the eye. Those who start from what they know, right angle at the bottom, straight base, pile up errors and get confused.",
  "It isn't a problem of the hand: kids draw lines perfectly well. It's knowledge, useful in a thousand other situations, that prevents them from seeing the thing as it is. Picasso said art is a lie that makes us see the truth: here the “lie” is drawing crooked shapes to get a true image."]},
 {h:"Setting symbols aside", p:[
  "Faced with a face, the verbal mind pulls out its repertoire: here's the eye, here's the nose, here's the hair. The same goes for hands, trees, grass. There's no need to fight these symbols: just offer tasks for which no symbols exist, so the visual part can look in peace.",
  "Redrawing the childhood landscape serves to bring them back to light and to remember how “perfect” they were in their way. But drawing from life asks for something else: looking for a long time, gathering a great deal of information and seeing how it fits together, as Dürer did with his hare."]}
],
c6:[
 {h:"What an edge is", p:[
  "In everyday language an edge is an outline, a boundary. In drawing it has a more precise meaning: it's where two things touch, and the line that represents it, the contour line, belongs to both. The profile in Vase/Faces was both the edge of the face and of the vase; in a jigsaw puzzle the edge of the boat is also the edge of the water.",
  "The format, that is the edge of the paper, is also a shared edge: it's the outer limit of the sky, the ground, all the shapes that touch it. This seemingly trivial concept is the basis of the next chapter on negative spaces."]},
 {h:"Pure contour and its paradox", p:[
  "The chapter's key exercise comes from Kimon Nicolaïdes's method, which asked students to draw imagining they were touching the edge with the pencil and looking at the model instead of the paper. The book's version is more drastic: turned the other way, you draw the creases of your palm for five minutes, extremely slowly, without ever looking at the paper.",
  "The result looks nothing like a hand: it's a tangle of marks. Yet it's the most effective exercise in the course: when it's skipped, students progress less. The extreme slowness and minuteness bore the verbal part (“it's a crease, I already said that”), which leaves; the visual part discovers that every crease is made of details and every detail of smaller details, almost like a fractal. Childlike wonder at ordinary things returns."]},
 {h:"The picture plane", p:[
  "The chapter's most important concept is the picture plane: an imaginary window, always parallel to your face, through which the artist looks. What lies behind it, even if it goes into depth, appears flattened on the glass as in a photograph. Drawing from life means copying that flat image onto the paper.",
  "Alberti described this idea in the Renaissance, Dürer built actual devices, Van Gogh had a blacksmith make him a very heavy frame that he dragged down to the beach, and Holbein too drew on glass to work faster. With the clear picture plane you do the same: you rest it on your foreshortened hand, close one eye, keep your head still and trace the edges. The result is astonishing: a very difficult view rendered with ease."]},
 {h:"One eye closed, a single view", p:[
  "Closing one eye eliminates binocular vision, the kind that gives depth: the image becomes flat and therefore copyable. Keeping your head still guarantees you draw a single view: if a finger can't be seen, you don't draw it. The closer the object, the more it pays to close one eye.",
  "The paradox is that the flat image, copied onto paper, looks three-dimensional to the viewer. To questions like “how do I make the finger come toward me?” the answer is always the same: draw exactly what you see on the plane. The modified contour on a toned ground brings it all together: you look at the hand almost all the time, check angles with the crosshairs, draw the shapes around the nails instead of the nails, and the result is the course's first real drawing."]}
],
c7:[
 {h:"Negative spaces and positive forms", p:[
  "Objects are the positive forms; the spaces between and around them are the negative spaces. The name isn't a happy one, but the idea is powerful: in drawing these spaces are as real as the objects. The book's example is a cartoon character crashing through a door and leaving a hole in its shape: what's left of the door is the negative space, solid and with a precise shape.",
  "Since forms and spaces share edges, drawing a space also means drawing the form next to it. And spaces have no names, no memorized symbols, there's nothing to “know” about them: that's why you see them as they really are. A wild sheep's horns seen foreshortened or an animal's legs become easy if you draw the space between them."]},
 {h:"What they're for", p:[
  "Negative spaces have three functions. They make the hard parts easy, like foreshortening and complicated shapes, because you draw them “for free” by looking at what surrounds them. They unify the drawing and strengthen the composition: when spaces and forms get the same attention, the whole sheet becomes interesting. And they train perception: after this lesson you start seeing spaces everywhere, between branches, between buildings, in the hidden arrow of a famous logo.",
  "The verbal part plays a role too: it doesn't want to deal with “nothing”, so faced with an empty space it withdraws. For the visual part, on the other hand, forms and spaces are equally fascinating."]},
 {h:"Format and composition", p:[
  "Composition is the way forms and spaces are arranged within the format, that is within the edges of the drawing. Young children have an instinctive sense of it, then lose it by focusing on objects. Many beginners treat the paper as if it had no edges and then “fill in the background”.",
  "That's why every drawing starts by choosing the framing with the viewfinder and drawing the format on the paper. The format rules: the same shape looks good in a vertical rectangle and bad in a horizontal one. And if you take care of the negative spaces, many composition problems solve themselves."]},
 {h:"The basic unit", p:[
  "One of the most common doubts is where to start. If the first shape is too big, what interested you ends up off the page; if it's too small, you have to fill in with useless things. The basic unit solves the problem: you choose a medium-sized shape or space, call it “One”, position and size it carefully relative to the format and crosshairs, and measure everything else in relation to it: one to three-quarters, one to two, and so on.",
  "Experienced artists do it in an instant, almost without noticing; Matisse, watching himself in slow motion, was amazed to see his hand measuring in the air before drawing the model's head. The chair is the ideal subject to practice on: we know too much about chairs (equal legs, wide seat) and what we know contradicts what we see. By drawing only the spaces, the chair comes out right on its own."]}
],
c8:[
 {h:"Perspective without fear", p:[
  "Perspective frightens many students; even Van Gogh struggled with it for a long time. The book tackles it in two steps: first a few concepts of formal perspective, then the method almost all artists actually use, intuitive perspective or “sighting”. It's like the rules of the road: at first they seem too many, then they become automatic and driving is a pleasure.",
  "The real difficulty is the paradox. A hallway has horizontal ceiling and floor and a constant height, but to draw it you must draw slanted lines that converge. The verbal part protests (“that can't be!”), the visual part accepts what it sees. One student, after measuring the same angle three times and saying it was impossible, finally drew it and discovered that it worked."]},
 {h:"The concepts of formal perspective", p:[
  "The point of view is fixed: you don't move and you don't turn your head. The picture plane stays parallel to your eyes. The horizon line is always at the viewer's eye level: if you climb a cliff it rises with you, if you sit down it drops, even when it isn't visible. Where to put it on the page is a compositional choice.",
  "In one-point perspective, horizontal edges going into depth converge toward a single vanishing point on the horizon. Those above the horizon slant down toward it, those below slant up, those at eye level stay horizontal. The verticals of buildings stay vertical, except in the rare three-point perspective, looking at skyscrapers from below or above."]},
 {h:"Two vanishing points and sighting", p:[
  "In reality the most common view is two-point, often with many objects oriented differently, each with its own points. Almost always these points fall off the page, sometimes very far away: nobody wants to work with strings and yard-long rulers.",
  "That's why you sight. The formal rules remain as an expectation: I know this edge above my eyes must slant down, so I look for it. Then I measure the real angle by comparing it with the vertical or the horizontal, the two constants the artist clings to like a life preserver. It's better to remember the “pie slice” the angle forms rather than the degrees, and to choose the reference that gives the smaller angle. Always staying on the plane: the pencil mustn't “poke through” it by pointing toward the back of the room."]},
 {h:"Measuring proportions", p:[
  "The second half of sighting concerns proportions. The gesture is formal: one eye closed, arm extended, elbow locked so the scale stays constant, pencil on the imaginary plane. You measure the basic unit by marking it with your thumb on the pencil, compare it with another measurement and get a simple ratio, for example one to two and two-thirds.",
  "Then comes the rule students summed up as “erase the measurement from the pencil”: the drawing has a different scale from reality, so you don't carry the measurement onto the paper, you carry the ratio. You remeasure the unit in the drawing and apply the same ratio. The hardest part isn't technical: it's believing your own measurements without endlessly rechecking them. Those who learn to sight can draw anything they see, foreshortening included."]}
],
c9:[
 {h:"The brain retouches what you see", p:[
  "One of the most surprising phenomena for those learning to draw is perceptual constancy. The brain knows that heads are more or less the same size and that a table is rectangular, and it corrects the image coming from the eye to match what it knows. It doesn't warn us it has done so.",
  "The book's examples are disconcerting: four identical figures in a landscape look different sizes; two identical tabletops look one long and narrow and the other almost square; your own head in the mirror seems life-size but is half the real size. Even after measuring, the illusion remains. The only remedy is to introduce a “snag”, a measurement, and then trust it more than the feeling."]},
 {h:"The chopped-off skull", p:[
  "The most common mistake in beginners' portraits concerns the position of the eyes. Almost everyone sees them a third of the way down, while in adults the eye-level line is at half the head, between the top of the skull (or hair) and the bottom of the chin. Since the features are the interesting part, the brain enlarges them and shrinks the forehead and skull, and in the drawing the head ends up cut off at the top.",
  "The students in one of the author's classes, even while measuring, sincerely said they couldn't see it: “we'll see it when we believe it”. Measuring on your own head, in the mirror, on photos, even on the TV screen, serves to convince the logical part. The features actually occupy a small portion of the head, and a whole skull completely changes the likeness."]},
 {h:"Ear, neck and other measurements", p:[
  "In profile the second typical mistake is the ear too close to the features, which also leads to cutting off the back of the skull. The rule to remember: the distance from the eye-level line to the chin equals that from the back of the eye to the back of the ear. Joining the three points you visualize an isosceles triangle right on the model.",
  "The bottom of the ear falls roughly between nose and mouth, but it varies from person to person and must be checked. The neck joins the skull higher than you'd think, roughly at the level of the nose or mouth, and it's wide: no thin neck stuck under an oval as in children's drawings."]},
 {h:"From Sargent to the real model", p:[
  "Copying a master drawing is an old method back in fashion: it forces you to slow down and see what the artist saw, and copied images stay imprinted for a long time. Sargent's profile of Madame X lets you practice every step: basic unit, negative spaces in front of the face and neck, angles relative to the crosshairs, position of the ear.",
  "Then the real portrait. A few tricks help get around the symbols: drawing the white of the eye as a negative space instead of the iris; looking at the spaces around glasses, which in profile have shapes different from the ones we know; drawing the collar through the spaces around it; rendering hair by masses, directions and dark areas instead of drawing individual hairs. And above all avoiding verbal judgments about the model: whoever thinks “he has a long face” ends up drawing it longer than it really is."]}
],
c10:[
 {h:"The logic of light", p:[
  "Light-and-shadow, which students call “shading”, becomes in the book the logic of light: light falls on forms and produces lights and shadows in predictable ways. There are four elements. The highlight, where the source strikes most directly. The cast shadow, the darkest, where the object blocks the light. Reflected light, weaker, bounced off nearby surfaces. The crest shadow, on the ridge of the form between highlight and reflected light.",
  "The last two are the hardest to see but they're the ones that “round out” forms. It's all measured in values, from the white of the paper to the densest black of the graphite: lights = high values, darks = low values. The ideal path goes from line to shapes, to relationships, to values, and from there to color and painting."]},
 {h:"Why it works: shapes without names", p:[
  "Shadow shapes have no names and change with every slightest movement of the model: the verbal part has no use for them and leaves the field. We constantly use this information to understand the volume of things, but without noticing. Turning a chiaroscuro self-portrait upside down you see only a mosaic of blotches; set right, the blotches vanish and a head in relief remains.",
  "Here lies another paradox: if you draw the shapes of light and shadow exactly as they appear, viewers don't notice them, they just see a “real” face. The visual part of the brain is excellent at filling in missing information, and the magic relies on this: given a few right clues, the viewer sees things that aren't drawn, like the shadowed eye in Hopper's self-portrait or in Steichen's photograph. The hard part is knowing when to stop."]},
 {h:"Facial proportions", p:[
  "Portraits come in three poses: frontal, profile, three-quarter. In the frontal view some general rules apply, to be adapted to each face: the central axis and the eye-level line always stay at right angles even if the head is tilted; there's one eye's space between the eyes; the base of the nose is found with an inverted triangle starting from the outer corners of the eyes; the mouth is about a third of the way from nose to chin; the nostrils fall under the inner corners of the eyes, the corners of the mouth under the pupils; the ears go from the eyes to nose-mouth; the neck is nearly as wide as the jaw. Noses, mouths, ears and necks are almost always bigger than you expect.",
  "The three-quarter view is the most expressive and the trickiest: the two halves of the face have different widths, the eye and mouth on the turned side are shorter and change shape, you see the side and base of the nose. All this contradicts the symmetrical symbols of childhood. The classic mistake is moving the near eye closer to the nose: the distance is about one eye-width. For the ear the rule becomes: from the front corner of the eye to the back of the ear = eye-to-chin."]},
 {h:"Hatching, self-portrait and gestalt", p:[
  "For tones there are two techniques. Hatching: groups of parallel marks made moving the hand from the wrist, crossed at a slightly different or sharper angle, layered to darken; every artist develops their own, almost a signature. And continuous tone, made with small overlapping movements. Both can only be learned through practice.",
  "The final self-portrait brings it all together: the mirror acts as the picture plane, a lamp to one side creates clear lights and shadows, you start from the large masses by erasing the lights out of the gray ground and darkening the shadows, and the features are allowed to emerge instead of being drawn first. Now and then you get up to look critically from a distance and then go back to work. In the end, next to the initial self-portrait, the difference is obvious: no more symbols, but observation. The likeness, the gestalt, comes by itself as the result of all the parts seen well."]}
],
c11:[
 {h:"Keep drawing", p:[
  "New connections in the brain only consolidate with repetition. The advice is simple: a small sketchbook always with you and a drawing of whatever happens to be at hand in idle moments. Copying newspaper photos upside down is the quickest way to shift modes; drawing from life and copying the masters are the best practice.",
  "Even when you can't draw you can train your eye: look for negative spaces, find your own horizon line, judge an angle against the vertical, check the proportions of faces on TV."]},
 {h:"Computers and the visual mind", p:[
  "Computers imitate the verbal, sequential way of thinking very well: they count, sort and follow procedures better than we do. Progress in visual abilities has been much slower: recognizing a face in three-quarter view or telling a friendly smile from a mocking one remains hard for machines and very easy for a child.",
  "That's why the author finds it paradoxical that schools stress more and more precisely the skills in which machines outdo us, neglecting perceptual ones. She takes up a proposal: teach kids how their brain works, which mode each problem needs and how to access it."]},
 {h:"The five stages of creativity", p:[
  "The creative process is described in five stages, each with a prevailing mode. First insight (R): looking around you notice something that doesn't add up and a question arises, “I wonder why…”. Saturation (L): you gather everything known about the problem, until the information won't fit together and frustration sets in. Incubation (R): you stop thinking about it and the mind works on its own, searching for the pattern in which everything holds together.",
  "Then illumination, the sudden “aha” that often comes while doing something else, with a sense of joy and of things falling into place. Finally verification (L guided by R): the laborious part of turning the insight into something concrete, which many never complete. You can even “program” incubation: tell yourself you need a solution by a certain date, and then let go."]},
 {h:"Seeing a problem like a drawing", p:[
  "The example of the designer who must decide whether to accept a client shows how to use the five skills as metaphors. Edges: where do my interests touch the other's, and what's that boundary like, soft or hard? Negative spaces: what don't I know, who else decides? Relationships: what's each party's horizon, what's the basic unit to measure everything against, time, money, quality? Lights and shadows: what's clear and what stays in the dark? The gestalt: look at the whole, perhaps turning it upside down in your mind.",
  "The chapter closes with real examples, like two inventors rethinking a surgical retractor used for almost a century, and with cave art, proof of an extraordinary ability to imagine and visualize tens of thousands of years ago. The final question is whether we can recover that visual power to foresee the dangers and opportunities of the future."]}
],
c12:[
 {h:"Drawing reveals you", p:[
  "Every drawing, whatever its subject, also shows who made it: how they see things and what they feel. You draw in visual mode, in silence, and then you can return to words to interpret what emerged; if words aren't enough, you go back to intuition again. The book's exercises are only the first steps of this journey.",
  "Learning to draw never ends: there's always the feeling that in the next drawing you'll see a little deeper."]},
 {h:"Advice for going on", p:[
  "Draw everything: no subject is too hard or too ordinary, even a tuft of grass or an artichoke. Study the masters by copying their drawings, not to imitate their style but to understand how they looked. Protect your own style and give it time to grow. If a drawing goes wrong, stop, calm down and remember that everything you need is right there in front of your eyes.",
  "Don't wait for inspiration: you have to set up the conditions for entering the right state, every day, otherwise the newly opened paths close again. And teach someone else, because explaining the lessons fixes them in the one explaining too. Finally, use the same skills for life's problems: look at them from several points of view, see their parts in the right proportions, let them ripen while you do something else."]}
]
}
};

/* ---------- texture a pastello: generate una volta sola con un canvas ---------- */
// --tex: riempimento a tratteggio obliquo · --tex2: tratto granuloso dei bordi · --paper: grana della carta
function makeTextures(){
  try{
    const T = 180;
    const mk = (fn) => { const c = document.createElement("canvas"); c.width = c.height = T; const g = c.getContext("2d"); fn(g); return "url(" + c.toDataURL() + ")"; };
    const strokes = (g, n, a0, a1, w0, w1, ang) => {
      for(let i = 0; i < n; i++){
        const x = Math.random() * T, y = Math.random() * T, l = 5 + Math.random() * 16, a = ang + (Math.random() - .5) * .35;
        const dx = Math.cos(a) * l, dy = Math.sin(a) * l;
        g.globalAlpha = a0 + Math.random() * (a1 - a0); g.lineWidth = w0 + Math.random() * (w1 - w0);
        for(const ox of [-T, 0, T]) for(const oy of [-T, 0, T]){ g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + dx + ox, y + dy + oy); g.stroke(); }
      }
      g.globalAlpha = 1;
    };
    const tex = mk(g => {
      g.globalAlpha = .82; g.fillRect(0, 0, T, T); g.globalAlpha = 1; g.lineCap = "round";
      strokes(g, 900, .2, .6, .8, 1.8, -0.95);
      g.globalCompositeOperation = "destination-out"; strokes(g, 380, .25, .55, .6, 1.3, -0.95);
    });
    const tex2 = mk(g => {
      g.globalAlpha = .9; g.fillRect(0, 0, T, T); g.globalCompositeOperation = "destination-out";
      for(let i = 0; i < 2200; i++){ g.globalAlpha = .25 + Math.random() * .6; g.fillRect(Math.random() * T, Math.random() * T, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6); }
    });
    const paper = mk(g => {
      for(let i = 0; i < 1400; i++){ g.fillStyle = Math.random() < .5 ? "#7A5A30" : "#FFFFFF"; g.globalAlpha = .03 + Math.random() * .06; g.fillRect(Math.random() * T, Math.random() * T, 1 + Math.random() * 2, 1 + Math.random() * 2); }
      g.strokeStyle = "#8A6A3A"; g.lineCap = "round";
      for(let i = 0; i < 40; i++){ const x = Math.random() * T, y = Math.random() * T, a = Math.random() * 6.28, l = 4 + Math.random() * 10; g.globalAlpha = .05; g.lineWidth = .6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l, y, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    });
    const r = document.documentElement.style;
    r.setProperty("--tex", tex); r.setProperty("--tex2", tex2); r.setProperty("--paper", paper);
  }catch(e){}
}

/* ---------- navigazione: il gesto "indietro" del telefono segue le schermate ---------- */
// profondità: home 0 · tab e capitolo 1 · esercizio 2
const DEPTH = {home:0, chapter:1, list:1, memo:1, settings:1, ex:2};
let curDepth = 0, fromPop = false, skipPop = null;
function screen(st){
  if(fromPop) return;
  const d = DEPTH[st.s];
  try{
    if(d > curDepth) history.pushState(st, "");
    else if(d === curDepth) history.replaceState(st, "");
    else { skipPop = st; history.go(d - curDepth); }
  }catch(e){}
  curDepth = d;
}
function showState(st){
  st = st || {s:"home"};
  if(st.s === "chapter" && chById(st.id)) chapter(st.id);
  else if(st.s === "ex" && exById(st.id)) exercise(st.id, st.from);
  else if(st.s === "list") list();
  else if(st.s === "memo") memo();
  else if(st.s === "settings") settings();
  else home();
}
window.addEventListener("popstate", (e) => {
  if(skipPop){ const st = skipPop; skipPop = null; try{ history.replaceState(st, ""); }catch(err){} return; }
  const st = e.state || {s:"home"};
  fromPop = true;
  try{ showState(st); } finally { fromPop = false; }
  curDepth = DEPTH[st.s] || 0;
});

  addEventListener("touchend", e => {
    if(x0 === null) return; const t = e.changedTouches[0];
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 60) history.back();
    x0 = null;
  }, {passive:true});
})();

/* ---------- barra delle sezioni in basso ---------- */
function tabBar(active){
  const [l1, l2, l3, l4] = tr("tabs");
  const tabs = [["home",l1,ICON.book,home,"--k1"],["list",l2,ICON.pencil,list,"--k2"],["memo",l3,ICON.pin,memo,"--k4"],["settings",l4,ICON.gear,settings,"--k5"]];
  const bar = $(`<nav class="tabbar" aria-label="${esc(tr("sections"))}">${tabs.map(([id, l, icon, , k]) => `<button class="tab cr ${id === active ? "on" : ""}" data-t="${id}" ${id === active ? 'aria-current="page"' : ""}><span style="color:var(${k});display:flex">${icon}</span><span>${l}</span></button>`).join("")}</nav>`);
  bar.querySelectorAll(".tab").forEach(b => b.onclick = () => { if(b.dataset.t !== active) tabs.find(t => t[0] === b.dataset.t)[3](); else window.scrollTo({top:0, behavior:"smooth"}); });
  return bar;
}

function exRow(e, i, showCh){
  const c = chById(e.ch), done = !!S.done[e.id];
  return `<button class="row cr ${done ? "done" : ""}" data-ex="${e.id}" style="--k:${c.k}">
    <span class="num cr">${done ? "✓" : esc(i)}</span>
    <span class="t"><b>${esc(e.t)}</b><span class="sub">PDF p. ${esc(pgs(e.pp))} · ${esc(e.min)}${showCh ? " · " + tr("ch") + " " + esc(c.n) : ""}</span></span>
    <span class="go" aria-hidden="true">›</span>
  </button>`;
}

/* ---------- HOME: il libro capitolo per capitolo ---------- */
function home(){
  screen({s:"home"});
  const next = EXS.find(e => !S.done[e.id]);
  const n = doneCount(), drew = S.days[today()];
  const hero = next ? `
    <section class="hero cr"><div class="hero-in cr">
      <div class="hero-art">${scene()}<span class="bubble cr">${esc(pick(tr("greet")))}</span>${mascot(n ? "wave" : "happy", 100)}</div>
      <span class="label">${esc(tr("nextEx", chById(next.ch).n))}</span>
      <h2>${esc(next.t)}</h2>
      <span class="pg cr">${ICON.page} PDF p. ${esc(pgs(next.pp))}</span>
      <button class="btn btn-deep cr" id="go">${esc(tr("openEx"))}</button>
    </div></section>` : `
    <section class="hero cr"><div class="hero-in cr">
      <div class="hero-art">${scene()}<span class="bubble cr">${esc(tr("bravo"))}</span>${mascot("cheer", 100)}</div>
      <span class="label">${esc(tr("courseDone"))}</span>
      <h2>${esc(tr("allDone"))}</h2>
      <p>${esc(tr("keepOn"))}</p>
    </div></section>`;
  const v = $(`<div class="pop">
    <header class="top">
      <div class="brand">${mascot("happy", 40)}${logo()}</div>
      <div class="stats">
        <span class="chip cr" title="${esc(tr("exDone"))}">${ICON.check}${n}/${EXS.length}</span>
        <span class="chip cr" title="${esc(tr("streak"))}">${ICON.flame}${streakNow()}</span>
      </div>
    </header>
    ${hero}
    <button class="btn ${drew ? "btn-ghost" : "btn-main"} cr" id="drew">${esc(tr(drew ? "drewToday" : "iDrew"))}</button>
    <div class="sec-h"><h3>${esc(tr("chapters"))}</h3><span class="label">${CH.length - 1} ${esc(tr("plusIntro"))}</span></div>
    <div class="list">${CH.map(c => { const pr = chProgress(c); return `
      <button class="row cr ${pr >= 1 ? "done" : ""}" data-ch="${c.id}" style="--k:${c.k}">
        <span class="num cr">${pr >= 1 ? "✓" : esc(c.n)}</span>
        <span class="t"><b>${esc(c.title)}</b><span class="sub">PDF pp. ${pg(c.from)}–${pg(c.to)} · ${esc(tr("nEx", c.ex.length))}</span></span>
        <span class="meter cr" aria-label="${Math.round(pr * 100)}%"><i style="width:calc(${Math.round(pr * 100)}% - 4px)"></i></span>
      </button>`; }).join("")}</div>
    <footer class="foot"><span>${tr("footBook")}</span><span>${esc(tr("footData"))}</span></footer>
  </div>`);
  if(next) v.querySelector("#go").onclick = () => exercise(next.id, "home");
  v.querySelector("#drew").onclick = () => { if(drew) return; bumpDay(); save(); home(); };
  v.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => chapter(b.dataset.ch));
  v.appendChild(tabBar("home"));
  mount(v);
}

const chLabel = (c) => c.id === "intro" ? tr("intro") : tr("chapter") + " " + esc(c.n);

/* ---------- CAPITOLO: riassunto ed esercizi ---------- */
function chapter(id){
  screen({s:"chapter", id});
  const c = chById(id), i = CH.indexOf(c), prev = CH[i - 1], nxt = CH[i + 1], long = S.view === "esteso";
  const v = $(`<div class="pop" style="--k:${c.k}">
    <button class="back" id="bk">${ICON.back} ${esc(tr("book"))}</button>
    <div class="page-h">
      <span class="label">${chLabel(c)} · PDF pp. ${pg(c.from)}–${pg(c.to)}</span>
      <h2>${esc(c.title)}</h2>${scribble(c.k)}
      ${c.sub ? `<p class="en">${esc(c.sub)}</p>` : ""}
    </div>
    <div class="seg cr" role="tablist" aria-label="${esc(tr("howRead"))}">
      <button class="cr ${long ? "" : "on"}" role="tab" aria-selected="${!long}" data-v="breve">${esc(tr("short"))}</button>
      <button class="cr ${long ? "on" : ""}" role="tab" aria-selected="${long}" data-v="esteso">${esc(tr("long"))}</button>
    </div>
    ${long ? `<div class="long">${c.long.map(s => `<section class="card cr"><h3>${esc(s.h)}</h3>${s.p.map(p => `<p>${esc(p)}</p>`).join("")}</section>`).join("")}</div>`
    : `<div class="card cr idea"><span class="label">${esc(tr("idea"))}</span>${esc(c.idea)}</div>
    <div class="card cr"><h3>${esc(tr("key"))}</h3><ol class="points">${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>`}
    ${c.ex.length ? `<div class="sec-h"><h3>${esc(tr("exercises"))}</h3><span class="label">${esc(tr("ofDone", c.ex.filter(e => S.done[e.id]).length, c.ex.length))}</span></div>
      <div class="list">${c.ex.map((e, k) => exRow(e, k + 1)).join("")}</div>` : ""}
    <div class="sec-h"><h3>${esc(tr("reading"))}</h3></div>
    <button class="btn ${S.read[c.id] ? "btn-ghost" : "btn-deep"} cr" id="read">${esc(tr(S.read[c.id] ? "readUndo" : "iRead"))}</button>
    <div class="nav2">
      ${prev ? `<button class="btn btn-ghost btn-sm cr" id="prev">‹ ${prev.id === "intro" ? tr("Intro") : tr("Ch") + " " + esc(prev.n)}</button>` : "<span></span>"}
      ${nxt ? `<button class="btn btn-ghost btn-sm cr" id="nxt">${tr("Ch")} ${esc(nxt.n)} ›</button>` : "<span></span>"}
    </div>
  </div>`);
  v.querySelector("#bk").onclick = home;
  v.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if(S.view === b.dataset.v) return; S.view = b.dataset.v; save(); chapter(id); });
  v.querySelector("#read").onclick = () => { if(S.read[c.id]) delete S.read[c.id]; else S.read[c.id] = today(); save(); chapter(id); };
  if(prev) v.querySelector("#prev").onclick = () => chapter(prev.id);
  if(nxt) v.querySelector("#nxt").onclick = () => chapter(nxt.id);
  v.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => exercise(b.dataset.ex, "chapter"));
  mount(v);
}

/* ---------- ESERCIZIO ---------- */
function exercise(id, from, mood){
  screen({s:"ex", id, from});
  const e = exById(id), c = chById(e.ch), done = S.done[id];
  const v = $(`<div class="pop" style="--k:${c.k}">
    <button class="back" id="bk">${ICON.back} ${from === "list" ? esc(tr("exercises")) : from === "home" ? esc(tr("book")) : chLabel(c)}</button>
    <div class="page-h">
      <span class="label">${chLabel(c)} · ${esc(tr("exercise"))}</span>
      <h2>${esc(e.t)}</h2>${scribble(c.k)}
    </div>
    <div class="meta">
      <span class="pg cr">${ICON.page} PDF p. ${esc(pgs(e.pp))}</span>
      ${e.img ? `<span class="pg cr">${esc(tr("imgAt"))} ${pg(e.img)}</span>` : ""}
      <span class="chip cr">${esc(e.min)}</span>
    </div>
    <div class="react">${mascot(mood || (done ? "cheer" : "squint"), 96)}</div>
    <div class="card cr">
      <div class="kv"><span class="label">${esc(tr("need"))}</span><p>${esc(e.mat)}</p></div>
      <div class="kv"><span class="label">${esc(tr("steps"))}</span><ol class="points">${e.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <div class="kv"><span class="label">${esc(tr("why"))}</span><p class="why">${esc(e.why)}</p></div>
      <p class="hint">${esc(tr("full", pg(e.p)))}</p>
    </div>
    <div class="donebar">
      ${done ? `<div class="ok cr">${esc(tr("doneOn", niceDate(done)))}</div>
        <button class="btn btn-ghost btn-sm cr" id="undo">${esc(tr("undo"))}</button>`
      : `<button class="btn btn-deep cr" id="do">${esc(tr("markDone"))}</button>`}
    </div>
    <div class="card cr">
      <label class="label" for="note">${esc(tr("notes"))}</label>
      <textarea id="note" placeholder="${esc(tr("notesPh"))}">${esc(S.notes[id] || "")}</textarea>
      <p class="hint" id="saved">${esc(tr("autosave"))}</p>
    </div>
  </div>`);
  v.querySelector("#bk").onclick = () => from === "list" ? list() : from === "home" ? home() : chapter(c.id);
  const d = v.querySelector("#do"), u = v.querySelector("#undo");
  if(d) d.onclick = () => { S.done[id] = today(); bumpDay(); save(); exercise(id, from, "cheer"); };
  if(u) u.onclick = () => { delete S.done[id]; save(); exercise(id, from, "sad"); };
  let tm;
  v.querySelector("#note").oninput = (ev) => {
    const t = ev.target.value; clearTimeout(tm);
    tm = setTimeout(() => { if(t.trim()) S.notes[id] = t; else delete S.notes[id]; save(); const s = document.getElementById("saved"); if(s) s.textContent = tr("saved"); }, 400);
  };
  mount(v);
}

/* ---------- TUTTI GLI ESERCIZI ---------- */
function list(){
  screen({s:"list"});
  const n = doneCount();
  const v = $(`<div class="pop">
    <div class="page-h"><span class="label">${esc(tr("exercises"))}</span><h2>${esc(tr("ofDone", n, EXS.length))}</h2>${scribble("var(--k2)")}</div>
    <div class="react">${mascot(n >= EXS.length ? "cheer" : n ? "happy" : "wave", 90)}</div>
    ${CH.filter(c => c.ex.length).map(c => `
      <div class="sec-h"><h3>${c.id === "intro" ? "" : tr("Ch") + " " + esc(c.n) + " · "}${esc(c.title)}</h3></div>
      <div class="list">${c.ex.map((e, k) => exRow(e, k + 1)).join("")}</div>`).join("")}
  </div>`);
  v.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => exercise(b.dataset.ex, "list"));
  v.appendChild(tabBar("list"));
  mount(v);
}

/* ---------- PROMEMORIA: materiali e regole da tenere sottomano ---------- */
function memo(){
  screen({s:"memo"});
  const have = MATS.filter(m => S.mats[m.id]).length;
  const v = $(`<div class="pop">
    <div class="page-h"><span class="label">${esc(tr("memo"))}</span><h2>${esc(tr("memoH"))}</h2>${scribble("var(--k4)")}</div>
    <details class="card cr" style="--k:var(--k4)" ${have < MATS.length ? "open" : ""}><summary>${esc(tr("mats"))} · ${have}/${MATS.length}</summary>
      <div class="in">
        <p class="hint" style="margin:0 0 6px">${esc(tr("matsHint", pg(44), pg(46)))}</p>
        ${MATS.map(m => `<button class="tick ${S.mats[m.id] ? "on" : ""}" data-m="${m.id}" aria-pressed="${!!S.mats[m.id]}"><span class="bx cr">${S.mats[m.id] ? "✓" : ""}</span><span>${esc(m.t)}<span class="sub">${esc(m.s)}</span></span></button>`).join("")}
      </div>
    </details>
    ${MEMO.map((x, i) => `<details class="card cr" style="--k:var(--k${(i + 1) % 6 + 1})"><summary>${esc(x.t)}</summary>
      <div class="in"><ol class="points">${x.items.map(i => `<li>${esc(i)}</li>`).join("")}</ol>
      <p class="hint">${esc(tr("inBook"))} ${pg(x.p)}</p></div></details>`).join("")}
  </div>`);
  v.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const id = b.dataset.m; if(S.mats[id]) delete S.mats[id]; else S.mats[id] = 1; save();
    const on = !!S.mats[id]; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); b.querySelector(".bx").textContent = on ? "✓" : "";
    v.querySelector("details summary").textContent = tr("mats") + " · " + MATS.filter(m => S.mats[m.id]).length + "/" + MATS.length;
  });
  v.appendChild(tabBar("memo"));
  mount(v);
}

/* ---------- IMPOSTAZIONI ---------- */
function settings(note){
  screen({s:"settings"});
  const v = $(`<div class="pop">
    <div class="page-h"><span class="label">${esc(tr("opts"))}</span><h2>${esc(tr("optsH"))}</h2>${scribble("var(--k5)")}</div>
    <div class="sec-h"><h3>${esc(tr("lang"))}</h3></div>
    <div class="seg cr" style="--k:var(--k5)" role="radiogroup" aria-label="${esc(tr("lang"))}">${LANGS.map(l => `<button class="cr ${l.id === S.lang ? "on" : ""}" role="radio" aria-checked="${l.id === S.lang}" lang="${l.id}" data-lang="${l.id}">${esc(l.name)}</button>`).join("")}</div>
    <div class="sec-h"><h3>${esc(tr("box"))}</h3><span class="label">${esc(tr("tryThem"))}</span></div>
    <div class="pals">${PALETTES.map(p => `<button class="pal cr ${p.id === S.palette ? "on" : ""}" data-id="${p.id}">
        <span class="sw cr" style="--fill:${p.bg}">${p.ks.map(k => `<i class="cr flat" style="--fill:${k}"></i>`).join("")}</span>
        <span class="pt2"><b>${esc(S.lang === "en" ? p.en[0] : p.name)}</b><span>${esc(S.lang === "en" ? p.en[1] : p.sub)}</span></span>
      </button>`).join("")}</div>
    <div class="sec-h"><h3>${esc(tr("pages"))}</h3></div>
    <div class="card cr">
      <p style="margin:0 0 10px">${esc(tr("pagesP"))}</p>
      <div class="stepper"><button class="btn btn-ghost cr" id="minus" aria-label="${esc(tr("less"))}">−</button><output id="off">${S.off > 0 ? "+" + S.off : S.off}</output><button class="btn btn-deep cr" id="plus" aria-label="${esc(tr("more"))}">+</button></div>
      <p class="hint">${esc(tr("pagesTry", pg(33)))}</p>
    </div>
    <div class="sec-h"><h3>${esc(tr("backup"))}</h3></div>
    <div class="stack">
      <button class="btn btn-ghost cr" id="exp">${esc(tr("exp"))}</button>
      <label class="btn btn-ghost cr" for="imp">${esc(tr("imp"))}</label><input type="file" id="imp" accept="application/json,.json" hidden>
      <span class="msg" id="msg">${esc(note || "")}</span>
    </div>
    <footer class="foot"><span>${esc(tr("disclaimer"))}</span></footer>
  </div>`);
  v.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { if(S.lang === b.dataset.lang) return; S.lang = b.dataset.lang; save(); applyLang(); settings(); });
  v.querySelectorAll(".pal").forEach(b => b.onclick = () => { S.palette = b.dataset.id; save(); applyPalette(); settings(); });
  const setOff = (k) => { S.off = Math.max(-50, Math.min(50, k)); save(); settings(); };
  v.querySelector("#minus").onclick = () => setOff((S.off || 0) - 1);
  v.querySelector("#plus").onclick = () => setOff((S.off || 0) + 1);
  v.querySelector("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}));
    a.download = "matitina-backup-" + today() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  v.querySelector("#imp").onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t => { const d = JSON.parse(t); if(!d || typeof d !== "object" || !d.done) throw 0; S = Object.assign(fresh(), d); save(); applyPalette(); applyLang(); settings(tr("restored")); })
      .catch(() => settings(tr("bad")));
  };
  v.appendChild(tabBar("settings"));
  mount(v);
}

makeTextures();
applyPalette();
try{ history.replaceState({s:"home"}, ""); }catch(e){}
home();
window.APP = {mascot, PALETTES, CH, EXS};   // usato da scripts/icone.mjs e scripts/verifica.mjs
})();
</script>
